 footage"}, "featured": false, "figure": {"en": "estimated damage, according to police", "value": "$8,000"}, "image": {"addedAt": "2026-11-09T23:10:00Z", "addedBy": "claude", "alt": {"en": "Carved and painted decoration on the grey stone tower of a Hindu temple, against a blue sky."}, "caption": {"en": "A Hindu temple in Melbourne. It is not the temple in this story; the photo is illustrative."}, "credit": "Katyare", "file": "images/murugan-temple-in-melbourne-victoria-australia.jpg", "licence": "CC0", "og": "og/murugan-temple-in-melbourne-victoria-australia.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Murugan_temple_in_Melbourne,_Victoria,_Australia.JPG", "srcset": "img/murugan-temple-in-melbourne-victoria-australia-800.webp 800w, img/murugan-temple-in-melbourne-victoria-australia-1280.webp 1280w", "url": "img/murugan-temple-in-melbourne-victoria-australia-1280.webp"}, "priority": 8, "risk": "amber", "section": "community", "slug": "tarneit-temple-power-cuts-police-investigating", "sources": [{"checked": "2026-11-10", "title": "The Indian Sun: Police investigate $8,000 damage at Hindu temple as community leaders demand action (9 Nov 2026)", "url": "https://www.theindiansun.com.au/2026/11/09/police-investigate-8000-damage-at-hindu-temple-as-community-leaders-demand-action/"}], "status": "published", "type": "news", "updated": "2026-11-09T23:10:00Z"}, {"approvedAt": "2026-11-08T20:02:36Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["If you or someone in your family would find it easier to get voting information in your own language, the Victorian Electoral Commission (VEC) offers phone help ahead of the state election on Saturday 28 November.", {"h": "Which number to call"}, {"dl": [["Tamil", "03 9209 0168"], ["Urdu", "03 9209 0165"], ["Nepali", "03 9209 0163"], ["Hindi, Punjabi, Gujarati, Malayalam, Sinhala and any other language", "03 9209 0112"]]}, "Hindi, Punjabi, Gujarati, Malayalam and Sinhala do not have their own VEC line or translated information page. Speakers of these languages can use the general number above, which the VEC lists for 'any other language'.", "Auslan users can contact the VEC through the National Relay Service and then call 03 8620 1100.", {"h": "Key dates"}, {"dl": [["Tue 17 Nov, 10am–4pm", "Low-sensory voting (one site in each district)"], ["Wed 18 – Fri 27 Nov", "Early voting"], ["Wed 25 Nov, 6pm", "Postal vote applications close"], ["Sat 28 Nov, 8am–6pm", "Election day"]]}, {"h": "Check you are enrolled"}, "The electoral roll closed at 8pm on Tuesday 3 November, so it is too late to enrol or update your details for this election. You can still check your enrolment on the VEC website by entering your name and address exactly as they appear on the roll. If you cannot find your details, call the VEC on 131 832.", {"h": "Other help"}, "The VEC says it is mailing more than 3 million printed EasyVote guides to Victorian households. It also publishes Easy English guides on voting, and its online map shows voting centre locations.", {"note": "The Melbourne Indian does not endorse candidates or parties. Phone numbers are from the VEC website, checked on 9 November 2026."}], "dek": "The Victorian Electoral Commission has dedicated phone lines for Tamil, Urdu and Nepali speakers. For Hindi, Punjabi, Gujarati, Malayalam and other languages, there is one number to call.", "headline": "Voting help in Hindi, Punjabi, Tamil and more: who to call before 28 November"}, "figure": {"en": "VEC line for languages without their own number", "value": "03 9209 0112"}, "image": {"addedAt": "2026-11-08T20:13:38Z", "addedBy": "claude", "alt": {"en": "Voters stand at cardboard voting screens in a hall with a chequered carpet while electoral staff work at a table."}, "caption": {"en": "A polling place in suburban Melbourne during the 2016 federal election."}, "credit": "John O'Neill (jjron)", "file": "images/polling-place-melbourne-2016.jpg", "licence": "Public domain", "og": "og/polling-place-melbourne-2016.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Polling_place,_Melbourne_Suburbs,_Vic,_jjron,_02.07.2016.jpg", "url": "img/polling-place-melbourne-2016-640.webp"}, "priority": 7, "risk": "green", "section": "civic", "slug": "vec-voting-help-indian-languages", "sources": [{"checked": "2026-11-08", "title": "Victorian Electoral Commission: Information in your language", "url": "https://www.vec.vic.gov.au/information-in-your-language"}, {"checked": "2026-11-08", "title": "Victorian Electoral Commission: 2026 state election", "url": "https://www.vec.vic.gov.au/voting/2026-state-election"}, {"checked": "2026-11-08", "title": "Victorian Electoral Commission: Check my enrolment", "url": "https://www.vec.vic.gov.au/enrolment/check-my-enrolment"}, {"checked": "2026-11-08", "title": "Victorian Electoral Commission: Easy English guides on voting", "url": "https://www.vec.vic.gov.au/voting/learn-to-vote/easy-english-guides-on-voting"}, {"checked": "2026-11-08", "title": "VEC voting centre map", "url": "https://maps.vec.vic.gov.au/elections"}, {"checked": "2026-11-09", "title": "Victorian Electoral Commission: Voting options (low-sensory voting)", "url": "https://www.vec.vic.gov.au/voting/2026-state-election/voting-options"}, {"checked": "2026-11-09", "title": "Victorian Electoral Commission: 100 days until the 2026 state election (EasyVote guides)", "url": "https://vec.vic.gov.au/about-us/media/100-days-until-the-2026-victorian-state-election---what-you-need-to-know"}, {"checked": "2026-11-09", "title": "Victorian Electoral Commission: Contact us", "url": "https://www.vec.vic.gov.au/contact-us"}], "status": "published", "type": "guide", "updated": "2026-11-08T20:13:38Z"}, {"approvedAt": "2026-11-08T23:46:39Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "created": "2026-11-08T23:46:39Z", "date": "2026-11-09", "en": {"body": ["Victorians vote on Saturday 28 November. Candidate nominations for the Legislative Assembly (lower house) closed at 12 noon on Monday 9 November.", "This guide covers the seven lower house districts where at least one in 10 residents was born in India. The figures come from the 2021 Census, compiled by the Parliament of Victoria Library on the current district boundaries.", {"note": "Candidates are listed in the order they will appear on the ballot paper, as published by the Victorian Electoral Commission (VEC) after its ballot draw on Monday 9 November."}, {"h": "Tarneit: 20.5% born in India"}, "Tarneit District is in the Western Metropolitan Region for the upper house. Candidates:", {"dl": [["MOINUDDIN, Aijaz", "No party listed"], ["WIGHT, Dylan", "Australian Labor Party"], ["ISLAM, SM Zaberul", "No party listed"], ["ELSBURY, Andrew", "The West Party"], ["VAN KEULEN, Leah", "Victorian Socialists"], ["NIYONGABIRE, Horizana", "Family First"], ["AHMED, Rahima Ibrahim", "No party listed"], ["RAHN, Maurita", "Animal Justice Party"], ["VILLAGONZALO, Walter", "One Nation Victoria"], ["RIFAI, A. Raheem", "The Greens"], ["UPPARLAPALLE, Venkat Ram", "Liberal"], ["SUDHAGANI, Sindhu", "The Republican"]]}, {"h": "Laverton: 15.0% born in India"}, "Laverton District is in the Western Metropolitan Region for the upper house. Candidates:", {"dl": [["NGUYEN, Lucy", "The Greens"], ["MENDELSOHN, Emma", "The West Party"], ["PAREDES, Rufo", "One Nation Victoria"], ["GARCIA, Jo", "Family First"], ["CONNOLLY, Sarah", "Australian Labor Party"], ["MANSOURI JAJAEE, Shohre", "Animal Justice Party"], ["CHITTEDI, Suchithra", "The Republican"], ["NOUNE, Ghada", "Liberal"], ["RUDD, Van Thanh", "Victorian Socialists"]]}, {"h": "Kalkallo: 13.9% born in India"}, "Kalkallo District is in the Northern Metropolitan Region for the upper house. Candidates:", {"dl": [["SPENCE, Ros", "Australian Labor Party"], ["DADISHO, Eddie", "Liberal"], ["DOBSON, Jeanette", "Family First"], ["LYNCH, Matthew", "Animal Justice Party"], ["STEANS, Troy", "One Nation Victoria"], ["TIWARI, Payal", "The Greens"], ["ISLAM, Rebeca", "No party listed"], ["MILLETT, Courtney", "Victorian Socialists"]]}, {"h": "Point Cook: 11.8% born in India"}, "Point Cook District is in the Western Metropolitan Region for the upper house. Candidates:", {"dl": [["LAINE, Taylor", "Victorian Socialists"], ["GRECH, Mark", "The West Party"], ["KELLY, Paul", "Labour DLP"], ["HILAKARI, Mathew", "Australian Labor Party"], ["ALLE, Kirti", "The Republican"], ["KRISHNA PANDI, Ponraj", "The Greens"], ["MEURE, Keith", "Family First"], ["REDDY, Raja", "Liberal"], ["REID, Cameron", "One Nation Victoria"]]}, {"h": "Cranbourne: 11.6% born in India"}, "Cranbourne District is in the South-Eastern Metropolitan Region for the upper house. Candidates:", {"dl": [["URQUIOLA, Liam", "Legalise Cannabis Victoria"], ["BAIRD, Craig", "Libertarian (formerly Liberal Democrats)"], ["MERCER, Annalise", "The Greens"], ["TRIPODI, Gino", "Liberal"], ["RICHARDS, Pauline", "Australian Labor Party"], ["YUNIS, Reem", "Victorian Socialists"], ["HIRST, Andrew", "One Nation Victoria"], ["FOREMAN, Shane", "Family First"]]}, {"h": "Williamstown: 11.5% born in India"}, "Williamstown District is in the Western Metropolitan Region for the upper house. Candidates:", {"dl": [["MARTIN, Oskar", "Victorian Socialists"], ["HOCKING, Ben", "The Greens"], ["O'REGAN, Bruce", "Family First"], ["LOUGHNAN, Catherine", "One Nation Victoria"], ["YARRA, Sagar Reddy", "The Republican"], ["GANNON, Gill", "The West Party"], ["HORNE, Melissa", "Australian Labor Party"], ["BRIFFA, Tony", "No party listed"], ["LINDEMANN, Paul", "Liberal"]]}, {"h": "Thomastown: 10.2% born in India"}, "Thomastown District is in the Northern Metropolitan Region for the upper house. Candidates:", {"dl": [["RANCIE, Rob", "Family First"], ["STOJCEVSKI, Belinda", "Liberal"], ["ANTHONY, Nadia", "One Nation Victoria"], ["REDDY, Priya", "Victorian Socialists"], ["HALFPENNY, Bronwyn", "Australian Labor Party"], ["TREWELLA, Gavin", "The Greens"]]}, {"h": "How to fill in your ballot papers"}, "You will get two ballot papers. On the small lower house ballot paper, number every box in the order of your choice.", "On the large upper house ballot paper, you can vote above the line for parties or groups, or below the line for individual candidates. Either way, number at least 1 to 5 in your order of choice. Use numbers only, not ticks or crosses.", "This is the first state election since group voting tickets were removed from upper house elections, under changes to the Electoral Act passed in August 2026, the VEC says.", "Not sure which district you live in? Use the VEC's online map to find your electorate.", {"note": "The Melbourne Indian does not endorse candidates or parties. Candidates are listed exactly as the VEC lists them, with the party shown on its nominations pages. Census figures are people born in India as a share of each district's population in 2021."}], "dek": "Here are all 61 candidates standing in Tarneit, Laverton, Kalkallo, Point Cook, Cranbourne, Williamstown and Thomastown, in ballot-paper order, and how to fill in your ballot papers.", "headline": "Victorian election: who is standing in the seven districts with the most India-born residents"}, "figure": {"en": "candidates across these seven districts", "value": "61"}, "image": {"addedAt": "2026-11-08T23:46:39Z", "addedBy": "claude", "alt": {"en": "The columns and front steps of Parliament House on Spring Street, Melbourne, with an Australian flag against a blue sky."}, "caption": {"en": "Parliament House, Melbourne. Voters elect all 88 lower house members on 28 November."}, "credit": "Donaldytong", "file": "images/victoria-parliament-house.jpg", "licence": "Public domain", "og": "og/victoria-parliament-house.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Victoria_Parliament_House_Melbourne.jpg", "srcset": "img/victoria-parliament-house-800.webp 800w, img/victoria-parliament-house-1600.webp 1600w", "url": "img/victoria-parliament-house-1600.webp"}, "priority": 8, "risk": "amber", "section": "civic", "slug": "victorian-election-2026-candidates-indian-communities", "sources": [{"checked": "2026-11-09", "title": "VEC: Tarneit District candidates", "url": "https://www.vec.vic.gov.au/electoral-boundaries/state-districts/tarneit-district/nominations"}, {"checked": "2026-11-09", "title": "VEC: Laverton District candidates", "url": "https://www.vec.vic.gov.au/electoral-boundaries/state-districts/laverton-district/nominations"}, {"checked": "2026-11-09", "title": "VEC: Kalkallo District candidates", "url": "https://www.vec.vic.gov.au/electoral-boundaries/state-districts/kalkallo-district/nominations"}, {"checked": "2026-11-09", "title": "VEC: Point Cook District candidates", "url": "https://www.vec.vic.gov.au/electoral-boundaries/state-districts/point-cook-district/nominations"}, {"checked": "2026-11-09", "title": "VEC: Cranbourne District candidates", "url": "https://www.vec.vic.gov.au/electoral-boundaries/state-districts/cranbourne-district/nominations"}, {"checked": "2026-11-09", "title": "VEC: Williamstown District candidates", "url": "https://www.vec.vic.gov.au/electoral-boundaries/state-districts/williamstown-district/nominations"}, {"checked": "2026-11-09", "title": "VEC: Thomastown District candidates", "url": "https://www.vec.vic.gov.au/electoral-boundaries/state-districts/thomastown-district/nominations"}, {"checked": "2026-11-09", "title": "Parliament of Victoria: Electorate data cards and data (ABS 2021 Census on 2022 boundaries)", "url": "https://www.parliament.vic.gov.au/teach-and-learn/resources/electorate-data-cards/"}, {"checked": "2026-11-09", "title": "VEC: How to fill out state ballot papers", "url": "https://www.vec.vic.gov.au/voting/learn-to-vote/how-to-fill-out-state-ballot-papers"}, {"checked": "2026-11-09", "title": "VEC: 2026 Electoral Act amendments", "url": "https://www.vec.vic.gov.au/about-us/legislation/electoral-act-amendments-2026"}, {"checked": "2026-11-09", "title": "VEC: 2026 state election", "url": "https://www.vec.vic.gov.au/voting/2026-state-election"}], "status": "published", "type": "guide", "updated": "2026-11-09T07:38:59Z"}, {"byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["Victorians go to the polls on Saturday 28 November for the 2026 state election. Voting centres will be open from 8am to 6pm, and you can vote at any voting centre in Victoria, according to the Victorian Electoral Commission (VEC).", "Voting is compulsory for everyone on the electoral roll. The roll closed at 8pm on Tuesday 3 November, so if you are not sure whether you are enrolled, check your details on the VEC website.", {"h": "Key dates"}, {"dl": [["Mon 9 Nov, 12 noon", "Candidate nominations close"], ["Tue 17 Nov, 10am–4pm", "Low sensory voting session"], ["Wed 18 Nov", "Early voting and telephone-assisted voting open"], ["Wed 25 Nov, 6pm", "Postal vote applications close"], ["Fri 27 Nov, 6pm", "Early voting closes"], ["Sat 28 Nov, 8am–6pm", "Election day"]]}, {"h": "Voting early"}, "Early voting runs from Wednesday 18 to Friday 27 November, 9am to 6pm each day except Sunday 22 November. You do not need a reason to vote early. The VEC says early voting locations will be published closer to the date.", {"h": "Voting by post or phone"}, "If you cannot get to a voting centre, you can apply for a postal vote until 6pm on Wednesday 25 November. Ballot packs are posted after nominations close and candidates are confirmed.", "Telephone-assisted voting is available for people who are blind, have low vision or have a motor impairment. Registration opens on Wednesday 18 November.", {"h": "Help in your language"}, "The VEC publishes voting information in other languages on its website, and early and election-day voting centres have how-to-vote information in other languages. You can also call the VEC on 131 832.", {"note": "The Melbourne Indian does not endorse candidates or parties. We will publish factual guides once nominations close on 9 November."}], "dek": "Early voting opens on 18 November and postal vote applications close on 25 November. Here is how to vote, and where to get help in your language.", "headline": "Victoria votes on 28 November: the dates you need to know"}, "featured": false, "figure": {"en": "November · election day", "hi": "नवंबर · मतदान का दिन", "pa": "ਨਵੰਬਰ · ਚੋਣਾਂ ਵਾਲਾ ਦਿਨ", "value": "28"}, "hi": {"body": ["विक्टोरिया के मतदाता 2026 के राज्य चुनाव के लिए शनिवार, 28 नवंबर को वोट डालेंगे। विक्टोरियन इलेक्टोरल कमीशन (VEC) के अनुसार मतदान केंद्र सुबह 8 बजे से शाम 6 बजे तक खुले रहेंगे, और आप विक्टोरिया के किसी भी मतदान केंद्र पर वोट दे सकते हैं।", "मतदाता सूची में दर्ज हर व्यक्ति के लिए मतदान अनिवार्य है। मतदाता सूची मंगलवार, 3 नवंबर को रात 8 बजे बंद हो चुकी है। अगर आपको पक्का नहीं पता कि आपका नाम दर्ज है, तो VEC की वेबसाइट पर अपनी जानकारी जाँच लें।", {"h": "मुख्य तारीख़ें"}, {"dl": [["सोम 9 नवंबर, दोपहर 12 बजे", "उम्मीदवारों के नामांकन बंद"], ["मंगल 17 नवंबर, सुबह 10 – शाम 4", "कम शोर-शराबे वाला (लो सेंसरी) मतदान सत्र"], ["बुध 18 नवंबर", "अग्रिम मतदान और टेलीफ़ोन सहायता से मतदान शुरू"], ["बुध 25 नवंबर, शाम 6 बजे", "डाक मत के आवेदन बंद"], ["शुक्र 27 नवंबर, शाम 6 बजे", "अग्रिम मतदान बंद"], ["शनि 28 नवंबर, सुबह 8 – शाम 6", "चुनाव का दिन"]]}, {"h": "पहले वोट देना"}, "अग्रिम मतदान बुधवार 18 नवंबर से शुक्रवार 27 नवंबर तक रोज़ सुबह 9 बजे से शाम 6 बजे तक होगा, केवल रविवार 22 नवंबर को छोड़कर। पहले वोट देने के लिए कोई कारण बताने की ज़रूरत नहीं है। VEC के अनुसार अग्रिम मतदान केंद्रों की जगहें तारीख़ के क़रीब बताई जाएँगी।", {"h": "डाक या फ़ोन से वोट"}, "अगर आप मतदान केंद्र तक नहीं जा सकते, तो बुधवार 25 नवंबर शाम 6 बजे तक डाक मत के लिए आवेदन कर सकते हैं। नामांकन बंद होने और उम्मीदवार तय होने के बाद मतपत्र डाक से भेजे जाते हैं।", "जो लोग देख नहीं सकते, कम देख पाते हैं या जिन्हें हाथ-पैर चलाने में कठिनाई है, वे टेलीफ़ोन की सहायता से वोट दे सकते हैं। इसका पंजीकरण बुधवार 18 नवंबर से शुरू होगा।", {"h": "अपनी भाषा में मदद"}, "VEC अपनी वेबसाइट पर दूसरी भाषाओं में मतदान की जानकारी देता है, और अग्रिम व चुनाव-दिवस के मतदान केंद्रों पर भी दूसरी भाषाओं में वोट डालने की जानकारी मिलती है। आप VEC को 131 832 पर फ़ोन भी कर सकते हैं।", {"note": "द मेलबर्न इंडियन किसी उम्मीदवार या दल का समर्थन नहीं करता। 9 नवंबर को नामांकन बंद होने के बाद हम तथ्यों पर आधारित गाइड प्रकाशित करेंगे।"}], "dek": "अग्रिम मतदान 18 नवंबर से शुरू होगा और डाक मत के आवेदन 25 नवंबर को बंद होंगे। जानिए वोट कैसे डालें और अपनी भाषा में मदद कहाँ मिलेगी।", "headline": "विक्टोरिया में 28 नवंबर को मतदान: ये तारीख़ें याद रखें"}, "image": {"addedAt": "2026-11-08T11:22:03Z", "addedBy": "claude", "alt": {"en": "The colonnaded sandstone front of Parliament House on Spring Street, Melbourne, with tram wires overhead and a tree on the right."}, "caption": {"en": "Parliament House on Spring Street, Melbourne, home of the Victorian Parliament that voters will elect on 28 November."}, "credit": "Kensarlance", "file": "images/parliament-house-spring-street.jpg", "licence": "Public domain", "og": "og/parliament-house-spring-street.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Parliament_House_Spring_Street_Melbourne.jpg", "srcset": "img/parliament-house-spring-street-800.webp 800w, img/parliament-house-spring-street-1600.webp 1600w", "url": "img/parliament-house-spring-street-1600.webp"}, "pa": {"body": ["ਵਿਕਟੋਰੀਆ ਦੇ ਵੋਟਰ 2026 ਦੀਆਂ ਸੂਬਾਈ ਚੋਣਾਂ ਲਈ ਸ਼ਨੀਵਾਰ, 28 ਨਵੰਬਰ ਨੂੰ ਵੋਟਾਂ ਪਾਉਣਗੇ। ਵਿਕਟੋਰੀਅਨ ਇਲੈਕਟੋਰਲ ਕਮਿਸ਼ਨ (VEC) ਮੁਤਾਬਕ ਵੋਟਿੰਗ ਕੇਂਦਰ ਸਵੇਰੇ 8 ਵਜੇ ਤੋਂ ਸ਼ਾਮ 6 ਵਜੇ ਤੱਕ ਖੁੱਲ੍ਹੇ ਰਹਿਣਗੇ, ਅਤੇ ਤੁਸੀਂ ਵਿਕਟੋਰੀਆ ਦੇ ਕਿਸੇ ਵੀ ਵੋਟਿੰਗ ਕੇਂਦਰ ਵਿੱਚ ਵੋਟ ਪਾ ਸਕਦੇ ਹੋ।", "ਵੋਟਰ ਸੂਚੀ ਵਿੱਚ ਦਰਜ ਹਰ ਵਿਅਕਤੀ ਲਈ ਵੋਟ ਪਾਉਣੀ ਲਾਜ਼ਮੀ ਹੈ। ਵੋਟਰ ਸੂਚੀ ਮੰਗਲਵਾਰ, 3 ਨਵੰਬਰ ਨੂੰ ਰਾਤ 8 ਵਜੇ ਬੰਦ ਹੋ ਚੁੱਕੀ ਹੈ। ਜੇ ਤੁਹਾਨੂੰ ਪੱਕਾ ਨਹੀਂ ਪਤਾ ਕਿ ਤੁਹਾਡਾ ਨਾਂ ਦਰਜ ਹੈ ਜਾਂ ਨਹੀਂ, ਤਾਂ VEC ਦੀ ਵੈੱਬਸਾਈਟ 'ਤੇ ਆਪਣੇ ਵੇਰਵੇ ਜਾਂਚ ਲਓ।", {"h": "ਮੁੱਖ ਤਰੀਕਾਂ"}, {"dl": [["ਸੋਮ 9 ਨਵੰਬਰ, ਦੁਪਹਿਰ 12 ਵਜੇ", "ਉਮੀਦਵਾਰਾਂ ਦੀਆਂ ਨਾਮਜ਼ਦਗੀਆਂ ਬੰਦ"], ["ਮੰਗਲ 17 ਨਵੰਬਰ, ਸਵੇਰੇ 10 – ਸ਼ਾਮ 4", "ਘੱਟ ਰੌਲੇ-ਰੱਪੇ ਵਾਲਾ (ਲੋ ਸੈਂਸਰੀ) ਵੋਟਿੰਗ ਸੈਸ਼ਨ"], ["ਬੁੱਧ 18 ਨਵੰਬਰ", "ਅਗਾਊਂ ਵੋਟਿੰਗ ਅਤੇ ਫ਼ੋਨ ਦੀ ਸਹਾਇਤਾ ਨਾਲ ਵੋਟਿੰਗ ਸ਼ੁਰੂ"], ["ਬੁੱਧ 25 ਨਵੰਬਰ, ਸ਼ਾਮ 6 ਵਜੇ", "ਡਾਕ ਵੋਟ ਦੀਆਂ ਅਰਜ਼ੀਆਂ ਬੰਦ"], ["ਸ਼ੁੱਕਰ 27 ਨਵੰਬਰ, ਸ਼ਾਮ 6 ਵਜੇ", "ਅਗਾਊਂ ਵੋਟਿੰਗ ਬੰਦ"], ["ਸ਼ਨੀ 28 ਨਵੰਬਰ, ਸਵੇਰੇ 8 – ਸ਼ਾਮ 6", "ਚੋਣਾਂ ਵਾਲਾ ਦਿਨ"]]}, {"h": "ਪਹਿਲਾਂ ਵੋਟ ਪਾਉਣੀ"}, "ਅਗਾਊਂ ਵੋਟਿੰਗ ਬੁੱਧਵਾਰ 18 ਨਵੰਬਰ ਤੋਂ ਸ਼ੁੱਕਰਵਾਰ 27 ਨਵੰਬਰ ਤੱਕ ਹਰ ਰੋਜ਼ ਸਵੇਰੇ 9 ਵਜੇ ਤੋਂ ਸ਼ਾਮ 6 ਵਜੇ ਤੱਕ ਹੋਵੇਗੀ, ਸਿਰਫ਼ ਐਤਵਾਰ 22 ਨਵੰਬਰ ਨੂੰ ਛੱਡ ਕੇ। ਪਹਿਲਾਂ ਵੋਟ ਪਾਉਣ ਲਈ ਕੋਈ ਕਾਰਨ ਦੱਸਣ ਦੀ ਲੋੜ ਨਹੀਂ। VEC ਮੁਤਾਬਕ ਅਗਾਊਂ ਵੋਟਿੰਗ ਕੇਂਦਰਾਂ ਦੀਆਂ ਥਾਵਾਂ ਤਰੀਕ ਦੇ ਨੇੜੇ ਦੱਸੀਆਂ ਜਾਣਗੀਆਂ।", {"h": "ਡਾਕ ਜਾਂ ਫ਼ੋਨ ਰਾਹੀਂ ਵੋਟ"}, "ਜੇ ਤੁਸੀਂ ਵੋਟਿੰਗ ਕੇਂਦਰ ਨਹੀਂ ਜਾ ਸਕਦੇ, ਤਾਂ ਬੁੱਧਵਾਰ 25 ਨਵੰਬਰ ਸ਼ਾਮ 6 ਵਜੇ ਤੱਕ ਡਾਕ ਵੋਟ ਲਈ ਅਰਜ਼ੀ ਦੇ ਸਕਦੇ ਹੋ। ਨਾਮਜ਼ਦਗੀਆਂ ਬੰਦ ਹੋਣ ਅਤੇ ਉਮੀਦਵਾਰ ਪੱਕੇ ਹੋਣ ਤੋਂ ਬਾਅਦ ਬੈਲਟ ਪੇਪਰ ਡਾਕ ਰਾਹੀਂ ਭੇਜੇ ਜਾਂਦੇ ਹਨ।", "ਜਿਹੜੇ ਲੋਕ ਦੇਖ ਨਹੀਂ ਸਕਦੇ, ਘੱਟ ਦੇਖਦੇ ਹਨ ਜਾਂ ਜਿਨ੍ਹਾਂ ਨੂੰ ਹੱਥਾਂ-ਪੈਰਾਂ ਦੀ ਹਿਲਜੁਲ ਵਿੱਚ ਦਿੱਕਤ ਹੈ, ਉਹ ਫ਼ੋਨ ਦੀ ਸਹਾਇਤਾ ਨਾਲ ਵੋਟ ਪਾ ਸਕਦੇ ਹਨ। ਇਸ ਲਈ ਰਜਿਸਟ੍ਰੇਸ਼ਨ ਬੁੱਧਵਾਰ 18 ਨਵੰਬਰ ਤੋਂ ਸ਼ੁਰੂ ਹੋਵੇਗੀ।", {"h": "ਆਪਣੀ ਬੋਲੀ ਵਿੱਚ ਮਦਦ"}, "VEC ਆਪਣੀ ਵੈੱਬਸਾਈਟ 'ਤੇ ਹੋਰ ਬੋਲੀਆਂ ਵਿੱਚ ਵੋਟਿੰਗ ਦੀ ਜਾਣਕਾਰੀ ਦਿੰਦਾ ਹੈ, ਅਤੇ ਅਗਾਊਂ ਅਤੇ ਚੋਣਾਂ ਵਾਲੇ ਦਿਨ ਦੇ ਵੋਟਿੰਗ ਕੇਂਦਰਾਂ ਵਿੱਚ ਵੀ ਹੋਰ ਬੋਲੀਆਂ ਵਿੱਚ ਵੋਟ ਪਾਉਣ ਦੀ ਜਾਣਕਾਰੀ ਮਿਲਦੀ ਹੈ। ਤੁਸੀਂ VEC ਨੂੰ 131 832 'ਤੇ ਫ਼ੋਨ ਵੀ ਕਰ ਸਕਦੇ ਹੋ।", {"note": "ਦ ਮੈਲਬਰਨ ਇੰਡੀਅਨ ਕਿਸੇ ਉਮੀਦਵਾਰ ਜਾਂ ਪਾਰਟੀ ਦੀ ਹਮਾਇਤ ਨਹੀਂ ਕਰਦਾ। 9 ਨਵੰਬਰ ਨੂੰ ਨਾਮਜ਼ਦਗੀਆਂ ਬੰਦ ਹੋਣ ਤੋਂ ਬਾਅਦ ਅਸੀਂ ਤੱਥਾਂ 'ਤੇ ਅਧਾਰਿਤ ਗਾਈਡ ਛਾਪਾਂਗੇ।"}], "dek": "ਅਗਾਊਂ ਵੋਟਿੰਗ 18 ਨਵੰਬਰ ਨੂੰ ਸ਼ੁਰੂ ਹੋਵੇਗੀ ਅਤੇ ਡਾਕ ਵੋਟ ਦੀਆਂ ਅਰਜ਼ੀਆਂ 25 ਨਵੰਬਰ ਨੂੰ ਬੰਦ ਹੋਣਗੀਆਂ। ਜਾਣੋ ਵੋਟ ਕਿਵੇਂ ਪਾਉਣੀ ਹੈ ਅਤੇ ਆਪਣੀ ਬੋਲੀ ਵਿੱਚ ਮਦਦ ਕਿੱਥੋਂ ਮਿਲੇਗੀ।", "headline": "ਵਿਕਟੋਰੀਆ ਵਿੱਚ 28 ਨਵੰਬਰ ਨੂੰ ਵੋਟਾਂ: ਇਹ ਤਰੀਕਾਂ ਯਾਦ ਰੱਖੋ"}, "priority": 7, "risk": "green", "section": "civic", "slug": "victorian-election-2026-key-dates", "sources": [{"checked": "2026-11-08", "title": "Victorian Electoral Commission: 2026 state election", "url": "https://www.vec.vic.gov.au/voting/2026-state-election"}, {"checked": "2026-11-08", "title": "Victorian Electoral Commission: Voting options", "url": "https://www.vec.vic.gov.au/voting/2026-state-election/voting-options"}], "status": "published", "translations": {"hi": "reviewed-by-claude", "pa": "reviewed-by-claude"}, "type": "guide", "updated": "2026-11-08T11:22:03Z"}, {"approvedAt": "2026-11-09T22:55:32.574Z", "approvedBy": "u_N2husJ7AcYn9nq725rcg0Q", "byline": "The Melbourne Indian newsroom", "corrections": [], "created": "2026-11-09T22:40:00Z", "date": "2026-11-10", "en": {"body": ["Victoria's prisons were running at 92 per cent of capacity at the start of November, the ABC reported on Monday, as both major parties campaign on tougher bail, sentencing and policing ahead of the state election on 28 November.", "According to the ABC, 4,624 people were serving sentences in Victorian prisons and 3,268 were on remand, meaning they were in custody waiting for a trial or a bail decision. By our arithmetic, that puts about four in ten prisoners on remand.", {"h": "What the parties say"}, {"dl": [["Labor", "A Labor spokesperson told the ABC the government had added more than 1,200 prison beds and recruited about 1,200 more prison officers, with $727 million set aside in the 2025-26 budget. Labor is also promising police station upgrades and a new rehabilitation program in youth detention."], ["Coalition", "Shadow police and corrections minister Brad Battin said a Coalition government would work with Corrections Victoria to manage prisoner numbers within the existing prisons. The Coalition is promising 1,500 more police on top of Labor's recruitment target."], ["Greens", "Greens leader Ellen Sandell said the major parties were in \"an arms race over who can lock up the most people\", and called for more spending on mental health, drug and alcohol treatment and youth programs."]]}, "The ABC said neither major party answered its questions about whether it had planned for extra prison beds and staff, or what that would cost.", {"h": "The experts"}, "Arie Freiberg, a former long-serving chair of the Sentencing Advisory Council, told the ABC that tougher policies would push more people into police cells and that health and addiction services were a better investment than prisons. Swinburne University law professor Mirko Bagaric argued the opposite: that sentencing had been too lenient and more prisons would be money well spent.", {"h": "The capacity question"}, "The new Western Plains prison near Lara, which the ABC says cost $1.19 billion, has 1,292 maximum-security beds but is currently operating with capacity for 1,094. Port Phillip Prison in Truganina closed in 2025. The ABC estimates a new prison would cost more than $1 billion.", {"note": "Figures in this story are as reported by the ABC. We have asked for the latest official data and will update this story."}], "dek": "With law and order at the centre of the 28 November election, experts say neither Labor nor the Coalition has said how many extra prison beds their policies will need, or what they will cost.", "headline": "Victoria's prisons are 92 per cent full, and both major parties are promising to lock up more people"}, "featured": false, "figure": {"en": "Victorian prison capacity in early November (ABC)", "value": "92%"}, "image": {"addedAt": "2026-11-09T23:10:00Z", "addedBy": "claude", "alt": {"en": "A multi-storey red-brick prison building on a city street corner, with tram wires overhead."}, "caption": {"en": "Melbourne Assessment Prison on Spencer Street, West Melbourne. File photo."}, "credit": "Canley", "file": "images/hm-melb-assessment-prison.jpg", "licence": "CC BY-SA 4.0", "og": "og/hm-melb-assessment-prison.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:HM_Melb_Assessment_Prison.jpg", "srcset": "img/hm-melb-assessment-prison-800.webp 800w, img/hm-melb-assessment-prison-1280.webp 1280w", "url": "img/hm-melb-assessment-prison-1280.webp"}, "priority": 7, "risk": "amber", "section": "civic", "slug": "victorian-prisons-92-per-cent-capacity-election", "sources": [{"checked": "2026-11-10", "title": "ABC News: Calls for next Victorian government to invest in prisons ahead of state election (9 Nov 2026)", "url": "https://www.abc.net.au/news/2026-11-09/calls-for-next-victorian-government-to-invest-in-prisons/107361304"}], "status": "published", "type": "news", "updated": "2026-11-09T23:10:00Z"}, {"byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["The Melbourne Indian is a new, independent news service for Melbourne's Indian communities, and for anyone who wants to know what is happening in them.", "We focus on life here: council and state decisions, local business, festivals and faith, and the practical information families need. News from India appears when it affects people in Melbourne.", "Every story is free to read. We publish in English, Hindi and Punjabi, and we translate stories where a language edition will be useful to readers.", {"h": "How we work"}, "We report from published records and official sources, and we link to them at the end of every story so you can check our work. We use AI tools to help research, draft and translate. Every story is checked against its sources and approved by an editor before it is published. Sensitive stories, including politics, crime, courts and allegations about people, get extra review.", "We do not invent quotes, interviews or photographs. When we get something wrong, we correct it and say so.", {"h": "How we are funded"}, "We are funded by advertising from local businesses. Advertising and sponsored content are always labelled, and they never decide what we report.", "We are just getting started. If you run a community organisation, temple, gurdwara or business and want us to know what you are doing, we would like to hear from you. Email our editors at news@themelbourneindian.com.au. For advertising, email ads@themelbourneindian.com.au."], "dek": "A free news service for Melbourne's Indian communities, in English, Hindi and Punjabi.", "headline": "Welcome to The Melbourne Indian"}, "figure": {"en": "languages, one newsroom", "hi": "भाषाएँ, एक न्यूज़रूम", "pa": "ਬੋਲੀਆਂ, ਇੱਕ ਨਿਊਜ਼ਰੂਮ", "value": "3"}, "hi": {"body": ["द मेलबर्न इंडियन एक नई, स्वतंत्र समाचार सेवा है, मेलबर्न के भारतीय समुदायों के लिए और उन सभी के लिए जो जानना चाहते हैं कि इन समुदायों में क्या हो रहा है।", "हमारा ध्यान यहाँ की ज़िंदगी पर है: काउंसिल और राज्य सरकार के फ़ैसले, स्थानीय व्यवसाय, त्योहार और आस्था, और परिवारों के काम की व्यावहारिक जानकारी। भारत की ख़बरें तब छपेंगी जब उनका असर मेलबर्न में रहने वालों पर पड़ता हो।", "हर ख़बर पढ़ने के लिए निःशुल्क है। हम अंग्रेज़ी, हिंदी और पंजाबी में प्रकाशित करते हैं, और जहाँ किसी भाषा में ख़बर पाठकों के काम आए, वहाँ उसका अनुवाद करते हैं।", {"h": "हम कैसे काम करते हैं"}, "हम प्रकाशित रिकॉर्ड और आधिकारिक स्रोतों से रिपोर्ट करते हैं, और हर ख़बर के अंत में उनके लिंक देते हैं ताकि आप ख़ुद जाँच सकें। शोध, लेखन और अनुवाद में हम AI टूल्स की मदद लेते हैं। हर ख़बर स्रोतों से मिलाई जाती है और प्रकाशन से पहले एक संपादक उसे मंज़ूरी देता है। राजनीति, अपराध, अदालत और लोगों पर लगे आरोपों जैसी संवेदनशील ख़बरों की अतिरिक्त जाँच होती है।", "हम कोई उद्धरण, साक्षात्कार या तस्वीर गढ़ते नहीं हैं। ग़लती होने पर हम उसे सुधारते हैं और यह साफ़ बताते हैं।", {"h": "हमारा ख़र्च कैसे चलता है"}, "हमारा ख़र्च स्थानीय व्यवसायों के विज्ञापनों से चलता है। विज्ञापन और प्रायोजित सामग्री पर हमेशा स्पष्ट लेबल होता है, और वे यह तय नहीं करते कि हम क्या रिपोर्ट करें।", "हम अभी शुरुआत कर रहे हैं। अगर आप कोई सामुदायिक संस्था, मंदिर, गुरुद्वारा या व्यवसाय चलाते हैं और चाहते हैं कि हमें आपके काम की जानकारी हो, तो हम आपसे सुनना चाहेंगे। हमारे संपादकों को news@themelbourneindian.com.au पर ईमेल करें। विज्ञापन के लिए ads@themelbourneindian.com.au पर ईमेल करें।"], "dek": "मेलबर्न के भारतीय समुदायों के लिए अंग्रेज़ी, हिंदी और पंजाबी में एक निःशुल्क समाचार सेवा।", "headline": "द मेलबर्न इंडियन में आपका स्वागत है"}, "image": {"addedAt": "2026-11-08T11:22:03Z", "addedBy": "claude", "alt": {"en": "Flinders Street Station's domed sandstone facade at a busy intersection with trams and pedestrians, and Eureka Tower rising behind it."}, "caption": {"en": "Flinders Street Station and Eureka Tower in central Melbourne, the city The Melbourne Indian covers."}, "credit": "Philip Mallis from Melbourne", "file": "images/flinders-street-station-eureka-tower.jpg", "licence": "CC BY-SA 2.0", "og": "og/flinders-street-station-eureka-tower.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Flinders_Street_Station_and_Eureka_Tower,_Melbourne_(51381676618).jpg", "srcset": "img/flinders-street-station-eureka-tower-800.webp 800w, img/flinders-street-station-eureka-tower-1600.webp 1600w", "url": "img/flinders-street-station-eureka-tower-1600.webp"}, "pa": {"body": ["ਦ ਮੈਲਬਰਨ ਇੰਡੀਅਨ ਇੱਕ ਨਵੀਂ, ਆਜ਼ਾਦ ਖ਼ਬਰ ਸੇਵਾ ਹੈ, ਮੈਲਬਰਨ ਦੇ ਭਾਰਤੀ ਭਾਈਚਾਰਿਆਂ ਲਈ ਅਤੇ ਉਨ੍ਹਾਂ ਸਾਰਿਆਂ ਲਈ ਜੋ ਜਾਣਨਾ ਚਾਹੁੰਦੇ ਹਨ ਕਿ ਇਨ੍ਹਾਂ ਭਾਈਚਾਰਿਆਂ ਵਿੱਚ ਕੀ ਹੋ ਰਿਹਾ ਹੈ।", "ਸਾਡਾ ਧਿਆਨ ਇੱਥੋਂ ਦੀ ਜ਼ਿੰਦਗੀ 'ਤੇ ਹੈ: ਕੌਂਸਲ ਅਤੇ ਸੂਬਾ ਸਰਕਾਰ ਦੇ ਫ਼ੈਸਲੇ, ਸਥਾਨਕ ਕਾਰੋਬਾਰ, ਤਿਉਹਾਰ ਅਤੇ ਆਸਥਾ, ਅਤੇ ਪਰਿਵਾਰਾਂ ਦੇ ਕੰਮ ਆਉਣ ਵਾਲੀ ਜਾਣਕਾਰੀ। ਭਾਰਤ ਦੀਆਂ ਖ਼ਬਰਾਂ ਉਦੋਂ ਛਪਣਗੀਆਂ ਜਦੋਂ ਉਨ੍ਹਾਂ ਦਾ ਅਸਰ ਮੈਲਬਰਨ ਵਿੱਚ ਰਹਿਣ ਵਾਲਿਆਂ 'ਤੇ ਪੈਂਦਾ ਹੋਵੇ।", "ਹਰ ਖ਼ਬਰ ਪੜ੍ਹਨ ਲਈ ਮੁਫ਼ਤ ਹੈ। ਅਸੀਂ ਅੰਗਰੇਜ਼ੀ, ਹਿੰਦੀ ਅਤੇ ਪੰਜਾਬੀ ਵਿੱਚ ਛਾਪਦੇ ਹਾਂ, ਅਤੇ ਜਿੱਥੇ ਕਿਸੇ ਬੋਲੀ ਵਿੱਚ ਖ਼ਬਰ ਪਾਠਕਾਂ ਦੇ ਕੰਮ ਆਵੇ, ਉੱਥੇ ਉਸਦਾ ਅਨੁਵਾਦ ਕਰਦੇ ਹਾਂ।", {"h": "ਅਸੀਂ ਕਿਵੇਂ ਕੰਮ ਕਰਦੇ ਹਾਂ"}, "ਅਸੀਂ ਛਪੇ ਹੋਏ ਰਿਕਾਰਡਾਂ ਅਤੇ ਸਰਕਾਰੀ ਸਰੋਤਾਂ ਤੋਂ ਰਿਪੋਰਟ ਕਰਦੇ ਹਾਂ, ਅਤੇ ਹਰ ਖ਼ਬਰ ਦੇ ਅਖ਼ੀਰ ਵਿੱਚ ਉਨ੍ਹਾਂ ਦੇ ਲਿੰਕ ਦਿੰਦੇ ਹਾਂ ਤਾਂ ਜੋ ਤੁਸੀਂ ਆਪ ਜਾਂਚ ਕਰ ਸਕੋ। ਖੋਜ, ਲਿਖਾਈ ਅਤੇ ਅਨੁਵਾਦ ਵਿੱਚ ਅਸੀਂ AI ਟੂਲਾਂ ਦੀ ਮਦਦ ਲੈਂਦੇ ਹਾਂ। ਹਰ ਖ਼ਬਰ ਸਰੋਤਾਂ ਨਾਲ ਮਿਲਾਈ ਜਾਂਦੀ ਹੈ ਅਤੇ ਛਪਣ ਤੋਂ ਪਹਿਲਾਂ ਕੋਈ ਸੰਪਾਦਕ ਉਸਨੂੰ ਮਨਜ਼ੂਰੀ ਦਿੰਦਾ ਹੈ। ਸਿਆਸਤ, ਜੁਰਮ, ਅਦਾਲਤਾਂ ਅਤੇ ਲੋਕਾਂ 'ਤੇ ਲੱਗੇ ਦੋਸ਼ਾਂ ਵਰਗੀਆਂ ਸੰਵੇਦਨਸ਼ੀਲ ਖ਼ਬਰਾਂ ਦੀ ਵਾਧੂ ਜਾਂਚ ਹੁੰਦੀ ਹੈ।", "ਅਸੀਂ ਕੋਈ ਹਵਾਲਾ, ਇੰਟਰਵਿਊ ਜਾਂ ਤਸਵੀਰ ਨਹੀਂ ਘੜਦੇ। ਗ਼ਲਤੀ ਹੋਣ 'ਤੇ ਅਸੀਂ ਉਸਨੂੰ ਸੁਧਾਰਦੇ ਹਾਂ ਅਤੇ ਸਾਫ਼ ਦੱਸਦੇ ਹਾਂ।", {"h": "ਸਾਡਾ ਖ਼ਰਚਾ ਕਿਵੇਂ ਚੱਲਦਾ ਹੈ"}, "ਸਾਡਾ ਖ਼ਰਚਾ ਸਥਾਨਕ ਕਾਰੋਬਾਰਾਂ ਦੇ ਇਸ਼ਤਿਹਾਰਾਂ ਨਾਲ ਚੱਲਦਾ ਹੈ। ਇਸ਼ਤਿਹਾਰਾਂ ਅਤੇ ਸਪਾਂਸਰ ਕੀਤੀ ਸਮੱਗਰੀ 'ਤੇ ਹਮੇਸ਼ਾ ਸਾਫ਼ ਲੇਬਲ ਹੁੰਦਾ ਹੈ, ਅਤੇ ਇਹ ਤੈਅ ਨਹੀਂ ਕਰਦੇ ਕਿ ਅਸੀਂ ਕੀ ਰਿਪੋਰਟ ਕਰੀਏ।", "ਅਸੀਂ ਹੁਣੇ ਸ਼ੁਰੂਆਤ ਕਰ ਰਹੇ ਹਾਂ। ਜੇ ਤੁਸੀਂ ਕੋਈ ਭਾਈਚਾਰਕ ਸੰਸਥਾ, ਮੰਦਰ, ਗੁਰਦੁਆਰਾ ਜਾਂ ਕਾਰੋਬਾਰ ਚਲਾਉਂਦੇ ਹੋ ਅਤੇ ਚਾਹੁੰਦੇ ਹੋ ਕਿ ਸਾਨੂੰ ਤੁਹਾਡੇ ਕੰਮ ਬਾਰੇ ਪਤਾ ਹੋਵੇ, ਤਾਂ ਅਸੀਂ ਤੁਹਾਡੇ ਤੋਂ ਸੁਣਨਾ ਚਾਹਾਂਗੇ। ਸਾਡੇ ਸੰਪਾਦਕਾਂ ਨੂੰ news@themelbourneindian.com.au 'ਤੇ ਈਮੇਲ ਕਰੋ। ਇਸ਼ਤਿਹਾਰਾਂ ਲਈ ads@themelbourneindian.com.au 'ਤੇ ਈਮੇਲ ਕਰੋ।"], "dek": "ਮੈਲਬਰਨ ਦੇ ਭਾਰਤੀ ਭਾਈਚਾਰਿਆਂ ਲਈ ਅੰਗਰੇਜ਼ੀ, ਹਿੰਦੀ ਅਤੇ ਪੰਜਾਬੀ ਵਿੱਚ ਇੱਕ ਮੁਫ਼ਤ ਖ਼ਬਰ ਸੇਵਾ।", "headline": "ਦ ਮੈਲਬਰਨ ਇੰਡੀਅਨ ਵਿੱਚ ਤੁਹਾਡਾ ਸੁਆਗਤ ਹੈ"}, "priority": 2, "risk": "green", "section": "community", "slug": "welcome", "sources": [], "status": "published", "translations": {"hi": "reviewed-by-claude", "pa": "reviewed-by-claude"}, "type": "notice", "updated": "2026-11-08T11:22:03Z"}, {"approvedAt": "2026-11-10T20:04:00Z", "approvedBy": "publisher", "byline": "The Melbourne Indian newsroom", "created": "2026-11-10T20:00:00Z", "date": "2026-11-11", "en": {"body": ["At 11am today, Melbourne will pause for a minute. The Victorian State Remembrance Service begins at 10.30am at the Shrine of Remembrance, and anyone can attend without booking. For most Australians, the minute's silence brings to mind the diggers of Gallipoli and the Western Front. Fewer know that the men beside them in the trenches included thousands of soldiers from what was then undivided India.", {"h": "Around 16,000 at Gallipoli"}, "Speaking at the Anzac Day dawn service in New Delhi this year, Australia's High Commissioner to India, Philip Green, put the number at around 16,000 troops from India who served at Gallipoli, with around 1,600 of them dying there. Sikh, Punjabi Muslim and Gurkha soldiers fought in battles such as Chunuk Bair and Hill 60, and Indian muleteers, stretcher-bearers and medical orderlies carried supplies under fire and tended the wounded.", "Mr Green cited the historian Peter Stanley, who has argued that the Indian contribution at Gallipoli was as great as that of the ANZACs themselves. Photographs held by the Australian War Memorial show Indian soldiers on the landing beach at Anzac Cove, Indian gunners beside an Australian rest camp, and Indian mule teams camped at the head of what the diggers called Mule Gully.", "The Australians noticed. In a letter home in 1915, Private Charlie Beherendt wrote that he had been \"fighting side by side with Kitchener's army, and the Sikhs and Gurkhas\", adding: \"The Indians fight like tigers and are a great unit to the Empire.\"", {"h": "The Indian Australians who enlisted anyway"}, "Australia's Defence Act of 1909 said that people \"not substantially of European origin or descent\" were not eligible to enlist. Even so, the Australian War Memorial has identified at least 12 Indian Australians who joined the Australian Imperial Force in the First World War.", "Two of them never came home. Nain Singh Sailani was born in Shimla and came to Western Australia in 1895, working as a labourer in Perth. He enlisted in February 1916, at the age of 43, and joined the 44th Battalion on the Western Front. He was killed on 1 June 1917 during a trench raid in Belgium and is buried at Strand Military Cemetery.", "Sarn Singh came from Jullundur in Punjab and farmed near Loxton in South Australia's Riverland. He enlisted in May 1916, at about 38, and joined the 43rd Battalion. He was killed on 10 June 1917 during the advance on Messines Ridge, when enemy artillery struck his position.", "A third, Desanda Singh of Kapurthala, a travelling salesman who settled near Ceduna, served with the 3rd Light Horse in Egypt in 1918 and came home. He was still working as a hawker in South Australia in 1946.", {"h": "Nearly 10,000 names, a century late"}, "In July this year, the Commonwealth War Graves Commission added 9,909 Indian Army servicemen of the First World War to its official casualty records, the largest single addition since the Second World War. Most had died in India, away from the fighting fronts, and rulings by the British Indian government at the time denied them war-graves status, so their names were never passed on.", "The names were recovered from the Punjab Registers, held at the Lahore Museum, which record the service of about 320,000 Punjabi recruits. The five-year project was run by the CWGC with the UK Punjab Heritage Association and the University of Greenwich. The men are now listed in an online book of remembrance, and families can search for them by name on the CWGC website.", "\"The recovery of every one of these 9,909 names helps restore missing chapters in family and world histories,\" the commission's director general, Claire Horton, said at the time.", {"h": "Today in Melbourne"}, "The Victorian State Remembrance Service starts at 10.30am at the Second World War Memorial Forecourt of the Shrine of Remembrance, on St Kilda Road. No booking is needed, though seating is limited, and the service is also streamed online. At 11am the Shrine's Ray of Light falls on the word \"Love\" on the Stone of Remembrance, marking the moment the Armistice was signed in 1918; the public can see the alignment again at midday. Veterans, war widows and widowers travel free on public transport today.", {"note": "The Gallipoli figures are the Australian High Commissioner's and are described as approximate. The Australian War Memorial says at least 12 Indian Australians enlisted; the true number may be higher, because some enlisted under anglicised names."}], "dek": "Around 16,000 soldiers from India served at Gallipoli in 1915, and at least 12 Indian Australians joined the AIF despite a law that said they couldn't. This year, nearly 10,000 more Indian soldiers of the First World War were finally added to the official records.", "headline": "At Gallipoli, the ANZACs weren't alone: the Indian soldiers Remembrance Day forgets"}, "featured": false, "figure": {"en": "soldiers from India served at Gallipoli", "value": "16,000"}, "image": {"addedAt": "2026-11-10T20:00:00Z", "addedBy": "claude", "alt": {"en": "Three Sikh soldiers in turbans crouch in a sandbagged trench at Gallipoli in 1915; one drinks from a tin cup."}, "caption": {"en": "Indian soldiers in a trench at Gallipoli, 1915. From an album compiled by Lieutenant Reginald Savory, 14th Sikh Regiment."}, "credit": "National Army Museum, London", "file": "images/indian-soldiers-in-trench-gallipoli-1915.jpg", "licence": "Public domain", "og": "og/indian-soldiers-in-trench-gallipoli-1915.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Indian_soldiers_in_trench,_Gallipoli,1915.jpg", "srcset": "img/indian-soldiers-in-trench-gallipoli-1915-800.webp 800w, img/indian-soldiers-in-trench-gallipoli-1915-960.webp 960w", "url": "img/indian-soldiers-in-trench-gallipoli-1915-960.webp"}, "priority": 4, "risk": "green", "section": "community", "slug": "remembrance-day-indian-soldiers-gallipoli", "sources": [{"checked": "2026-11-10", "title": "Australian War Memorial: Remembering Indian Anzacs in the first AIF (Meghan Adams, 2020)", "url": "https://www.awm.gov.au/articles/blog/remembering-sikhs"}, {"checked": "2026-11-10", "title": "Australian High Commission, New Delhi: High Commissioner's Anzac Day dawn service remarks (25 Apr 2026)", "url": "https://india.embassy.gov.au/ndli/HOMSpeech25042026.html"}, {"checked": "2026-11-10", "title": "University of Greenwich: Thousands of Indian First World War soldiers commemorated after historical omission (6 Jul 2026)", "url": "https://www.gre.ac.uk/articles/public-relations/thousands-of-indian-first-world-war-soldiers-commemorated-after-historical-omission"}, {"checked": "2026-11-10", "title": "CWGC: Indian (First World War District Registers) Book of Remembrance", "url": "https://www.cwgc.org/visit-us/find-cemeteries-memorials/cemetery-details/5002577/indian-first-world-war-district-registers-book-of-remembrance/"}, {"checked": "2026-11-10", "title": "Shrine of Remembrance: Remembrance Day 2026", "url": "https://www.shrine.org.au/remembrance-day-2026"}, {"checked": "2026-11-10", "title": "Australian War Memorial collection: Anzac Cove 1915 (C355871), Indian gunners (C02073), Indian mule team (C248927)", "url": "https://www.awm.gov.au/collection/C355871"}], "status": "published", "type": "feature", "updated": "2026-11-11T05:40:00Z"}, {"approvedAt": "2026-11-11T00:58:00Z", "approvedBy": "publisher", "byline": "The Melbourne Indian newsroom", "created": "2026-11-10T02:40:00Z", "date": "2026-11-11", "en": {"body": ["Opposition Leader Jess Wilson has confirmed the Coalition will put Labor, the Greens and the Socialists at the bottom of its how-to-vote cards for the 28 November state election, which means One Nation will be ranked above them where it is standing.", "\"We have made the decision that we will be putting Labor, the Greens, the Socialists at the bottom of the ticket,\" Ms Wilson said on Tuesday, according to the ABC. \"The only way to change the government is a number one next to Liberal and Nationals.\"", "She said the order would be decided case by case, electorate by electorate, after checking each candidate. The Coalition has not yet said which seats will see One Nation placed directly after its own candidate.", "The confirmation follows a report in The Australian on Monday that the Nationals had already resolved to preference One Nation ahead of Labor and that the Liberals were expected to follow.", {"h": "What the parties are saying"}, "Labor minister Anthony Carbines said Labor's position was \"very clear about putting One Nation at the bottom\", and accused the Coalition and One Nation of \"nudge-nudge wink-wink\" arrangements, the ABC reported. Premier Ben Carroll called the announcement a reversal of Ms Wilson's earlier position, The Australia Today reported.", "On Wednesday, federal Labor MP Julian Hill, the member for Bruce, called it a deal between the two parties: \"If it looks like a duck and quacks like a duck, it's a duck.\" Federal Liberal MP Aaron Violi, the member for Casey, said he was \"comfortable\" with the decision. \"The preference recommendations are not making judgement calls on every single comment, policy or portfolio,\" he said.", "One Nation welcomed the decision, The Australia Today reported. On the same day, the party dropped its candidate for Preston over social media posts praising Adolf Hitler.", {"h": "Labor's own preference fight"}, "Labor is facing criticism of its own. It will not direct preferences in the Liberal-held seat of Prahran, where it has previously preferenced the Greens, the ABC reported. Greens leader Ellen Sandell called the decision \"shocking\". \"This is Labor admitting that they have more in common with One Nation and the Liberals,\" she said.", {"h": "Why preferences matter"}, "Victoria uses full preferential voting in the lower house: you must number every box. Parties hand out how-to-vote cards suggesting an order, and many voters follow them, so where each party asks its supporters to put its rivals can decide close seats once first preferences are counted.", {"note": "Your vote is yours. How-to-vote cards are only suggestions: you can number the boxes in any order you choose, as long as every box is numbered."}], "dek": "The Opposition Leader says Labor, the Greens and the Socialists will go last on Coalition cards, decided seat by seat. Labor calls it a deal; the Greens are angry at Labor's own call in Prahran.", "headline": "Coalition will put Labor and the Greens below One Nation on how-to-vote cards, Jess Wilson confirms"}, "figure": {"en": "Victorian election day", "value": "28 Nov"}, "image": {"addedAt": "2026-11-11T01:05:00Z", "addedBy": "claude", "alt": {"en": "Illustration of a ballot paper with six boxes numbered in pencil, beside a yellow pencil."}, "caption": {"en": "Illustration: in Victoria's lower house you must number every box. How-to-vote cards only suggest an order."}, "credit": "The Melbourne Indian", "file": "images/coalition-one-nation-preferences-victorian-election.jpg", "licence": "Original illustration", "og": "og/coalition-one-nation-preferences-victorian-election.jpg", "srcset": "img/coalition-one-nation-preferences-victorian-election-800.webp 800w, img/coalition-one-nation-preferences-victorian-election-1600.webp 1600w", "url": "img/coalition-one-nation-preferences-victorian-election-1600.webp"}, "priority": 10, "risk": "amber", "section": "civic", "slug": "coalition-one-nation-preferences-victorian-election", "sources": [{"checked": "2026-11-11", "title": "ABC News: Victorian election live blog, 10 November 2026 (Wilson's comments 11:53am; Carbines 12:52pm and 1:01pm)", "url": "https://www.abc.net.au/news/2026-11-10/victoria-state-election-blog-politics/107357090"}, {"checked": "2026-11-11", "title": "ABC News: Victorian election live blog, 11 November 2026 (Hill, Violi, Sandell)", "url": "https://www.abc.net.au/news/2026-11-11/victoria-election-blog-november-11/107371790"}, {"checked": "2026-11-11", "title": "The Australia Today: Wilson confirms Coalition will preference One Nation ahead of Labor and Greens (11 Nov 2026)", "url": "https://www.theaustraliatoday.com.au/wilson-confirms-coalition-will-preference-one-nation-ahead-of-labor-and-greens/"}, {"checked": "2026-11-10", "title": "The Nightly: reports on The Australian's story about Coalition and One Nation preferences (9 Nov 2026)", "url": "https://thenightly.com.au/politics/australia/victorian-state-election-reports-one-nation-and-coalition-working-together-to-impact-carroll-labor-goverment-c-23137722"}], "status": "published", "type": "news", "updated": "2026-11-11T01:10:00Z"}, {"approvedAt": "2026-11-11T00:58:00Z", "approvedBy": "publisher", "byline": "The Melbourne Indian newsroom", "created": "2026-11-10T02:40:00Z", "date": "2026-11-11", "en": {"body": ["From Thursday 12 November, people must be outside Australia both when they apply for a Training visa (subclass 407) and when it is granted, according to the Department of Home Affairs.", "The 407 visa lets people come to Australia for workplace-based training or professional development with an approved sponsor.", {"h": "What changes"}, {"ul": ["An application made while you are in Australia on or after 12 November will be invalid, Home Affairs says, \"even if ImmiAccount allows you to submit an application\".", "A decision that an application is invalid cannot be reviewed on its merits.", "Home Affairs warns that lodging an invalid application may affect your visa status, and that if your visa has already expired you may not be eligible to apply for another.", "You will not get a Bridging visa linked to a 407 application lodged from outside Australia. You may travel to Australia on another valid visa while it is processed."]}, {"h": "Who is not affected"}, "Home Affairs says valid applications lodged before 12 November will be assessed under the rules in place when they were lodged, including the changes that started on 11 March 2026. Since March, applicants have had to wait until their sponsor is approved and their training nomination is approved before applying, unless the sponsor is a Commonwealth agency.", {"h": "What Home Affairs suggests"}, {"ul": ["Check when your current visa expires and leave Australia before it does.", "Make sure the sponsorship and nomination are approved before you apply.", "Check whether you can do any health examination before you leave.", "Do not book travel back to Australia based on an expected grant date."]}, "The department has not published a reason for the change.", {"note": "This is general information from the Department of Home Affairs, not migration advice. For advice on your situation, speak to a registered migration agent or lawyer."}], "dek": "Anyone in Melbourne hoping to move onto a subclass 407 Training visa will have to leave the country first, the Department of Home Affairs says.", "headline": "From Thursday, Training visas can only be applied for from outside Australia"}, "figure": {"en": "Training visas must be applied for from outside Australia", "value": "12 Nov"}, "image": {"addedAt": "2026-11-11T01:08:00Z", "addedBy": "claude", "alt": {"en": "Illustration of a passport beside a card reading 'Training visa, subclass 407' stamped 'Apply from outside Australia, from 12 Nov'."}, "caption": {"en": "Illustration. Australia does not issue visa labels; visas are recorded electronically."}, "credit": "The Melbourne Indian", "file": "images/training-visa-407-offshore-only-12-november.jpg", "licence": "Original illustration", "og": "og/training-visa-407-offshore-only-12-november.jpg", "srcset": "img/training-visa-407-offshore-only-12-november-800.webp 800w, img/training-visa-407-offshore-only-12-november-1600.webp 1600w", "url": "img/training-visa-407-offshore-only-12-november-1600.webp"}, "priority": 8, "risk": "green", "section": "education", "slug": "training-visa-407-offshore-only-12-november", "sources": [{"checked": "2026-11-11", "title": "Department of Home Affairs: Changes to Training visa application rules (subclass 407), last updated 30 Oct 2026", "url": "https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/changes-to-training-visa-407-application-rules"}], "status": "published", "type": "news", "updated": "2026-11-11T01:10:00Z"}, {"approvedAt": "2026-11-11T00:58:00Z", "approvedBy": "publisher", "byline": "The Melbourne Indian newsroom", "created": "2026-11-10T06:40:00Z", "date": "2026-11-10", "en": {"body": ["One Nation has disendorsed Franco Guardiani, its candidate for the Labor-held seat of Preston in Melbourne's north, after social media posts circulated on Tuesday in which he described Adolf Hitler as the \"GOAT\", shorthand for \"greatest of all time\".", "Victorian One Nation leader Warren Pickering said the party was appalled \"at a time when Jewish Australians are experiencing unprecedented persecution\", and that people holding such views \"do not have a place in One Nation\", the ABC reported. The party conceded its vetting process needed improvement.", "Mr Guardiani confirmed to the ABC that the accounts were his. \"The party does what it sees fit,\" he said, adding that he believed in free speech.", {"h": "Still on the ballot"}, "Nominations for the 28 November election closed on Monday, so Mr Guardiani will remain on the Preston ballot paper under the One Nation name, the ABC reported. One Nation volunteers are not expected to hand out how-to-vote cards at Preston polling places.", "Preston is held by Labor on a margin of 2.1 per cent.", "The disendorsement came on the same day Opposition Leader Jess Wilson confirmed the Coalition would put Labor, the Greens and the Socialists below One Nation on its how-to-vote cards.", {"note": "A full list of candidates for every district is on the VEC website. If you see hateful content aimed at a community, Victoria's anti-vilification laws explain how to report it."}], "dek": "Franco Guardiani confirmed the accounts were his. Nominations had already closed, so he will still appear under the One Nation name in the Labor-held seat.", "headline": "One Nation drops its Preston candidate over social media posts praising Hitler, but his name stays on the ballot"}, "figure": {"en": "days until Victorians vote, on 28 November", "value": "18"}, "image": {"addedAt": "2026-11-11T01:15:00Z", "addedBy": "claude", "alt": {"en": "The rebuilt Preston railway station, its facade covered in vertical panels of pink, green, yellow and orange, with 'PRESTON' above the entrance."}, "caption": {"en": "Preston station on the Mernda line, in the district of Preston in Melbourne's north."}, "credit": "Gracchus250", "file": "images/preston-station-melbourne-on-mernda-line-july-2023.jpg", "licence": "CC BY-SA 4.0", "og": "og/preston-station-melbourne-on-mernda-line-july-2023.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Preston_station,_Melbourne_on_Mernda_line_July_2023.jpg", "srcset": "img/preston-station-melbourne-on-mernda-line-july-2023-800.webp 800w, img/preston-station-melbourne-on-mernda-line-july-2023-1280.webp 1280w", "url": "img/preston-station-melbourne-on-mernda-line-july-2023-1280.webp"}, "priority": 7, "risk": "amber", "section": "civic", "slug": "one-nation-drops-preston-candidate-hitler-post", "sources": [{"checked": "2026-11-11", "title": "ABC News: Victorian election live blog, 10 November 2026 (1:27pm, 2:40pm, 3:27pm)", "url": "https://www.abc.net.au/news/2026-11-10/victoria-state-election-blog-politics/107357090"}, {"checked": "2026-11-10", "title": "Guardian Australia: One Nation dumps Victorian election candidate who praised Hitler (10 Nov 2026; original not readable from this run)", "url": "https://www.theguardian.com/australia-news/2026/nov/10/one-nation-dumps-franco-guardiani-praised-hitler-victoria-elections-ntwnfb"}, {"checked": "2026-11-10", "title": "Head Topics summary of Daily Mail report: One Nation drops Preston candidate Franco Guardiani (10 Nov 2026)", "url": "https://uk.headtopics.com/news/one-nation-drops-preston-candidate-franco-guardiani-over-89708335"}], "status": "published", "type": "news", "updated": "2026-11-11T01:10:00Z"}, {"approvedAt": "2026-11-11T05:20:00Z", "approvedBy": "publisher", "byline": "The Melbourne Indian newsroom", "created": "2026-11-11T04:30:00Z", "date": "2026-11-11", "en": {"body": ["A former CFMEU organiser has told Victoria's Big Build royal commission that underworld figure Mick Gatto gave him an expensive gold bracelet, and that Mr Gatto sometimes intervened with the union on behalf of employers.", "Paul Tzimas, who worked full-time as a union organiser, gave evidence on Wednesday, the third day of public hearings. AAP and NCA NewsWire both reported his evidence.", {"h": "The bracelet"}, "Mr Tzimas said he first refused the gift, then accepted it after Mr Gatto called it an \"olive branch\" and said he wanted nothing in return. He said he never wore it. \"He never called upon any favours,\" Mr Tzimas told the commission, according to NCA NewsWire.", "Asked by counsel assisting Chris Carr SC whether Mr Gatto would intervene with the union for employers, Mr Tzimas agreed.", {"h": "Bikie links"}, "Mr Carr put a list of names to the witness. Mr Tzimas identified 11 CFMEU organisers and health and safety representatives who, AAP reported, were affiliated with outlaw motorcycle gangs at the time or previously, and agreed the union had placed them on building sites.", "He also agreed the union pushed hard to get its way, which he said was \"to deliver outcomes for working people\". He admitted breaking the law several times as an organiser and said he had been fined.", {"h": "WorkSafe and the Sunbury stoppage"}, "The first fortnight of hearings is focused on a two-day stoppage at the Gap Road level crossing removal in Sunbury in June 2022, when union delegates occupied the site and work resumed only after their demands were agreed.", "WorkSafe inspector Quinton Drury told the commission the stoppage was given the lowest priority because priority is set by safety risk, not by disruption to projects. Inspectors arrived on 8 June 2022, after the dispute was resolved, and found only \"minor\" issues with piling holes, which were fixed during the inspection, AAP reported.", {"h": "Why it matters"}, "The royal commission is examining the integrity of the state's Big Build infrastructure program. Its hearings are running through the campaign for the 28 November state election, and its final report is due in August 2027. Witnesses are legally compelled to attend, and counsel assisting Chris Young KC has warned that threatening or intimidating a witness is a serious criminal offence.", {"note": "Evidence given to a royal commission has not been tested in court. No finding has been made against anyone named."}], "dek": "On the third day of hearings, a former organiser told the royal commission that the underworld figure sometimes stepped in for employers, and that WorkSafe gave the Sunbury site occupation its lowest priority.", "headline": "Big Build inquiry: ex-CFMEU organiser says Mick Gatto gave him a gold bracelet, and agrees 11 union officials had bikie links"}, "featured": true, "figure": {"en": "CFMEU organisers and safety reps the witness agreed were linked to outlaw motorcycle gangs", "value": "11"}, "image": {"addedAt": "2026-11-11T05:40:00Z", "addedBy": "claude", "alt": {"en": "Workers in high-visibility vests walk into a Metro Tunnel construction site on A'Beckett Street, behind blue Victorian Government hoardings and a white site shelter."}, "caption": {"en": "A Metro Tunnel construction site on A'Beckett Street, Melbourne, in 2020. The Metro Tunnel is part of the Big Build; this week's hearings focus on the Sunbury level crossing removal. The photo is illustrative."}, "credit": "Philip Mallis", "file": "images/metro-tunnel-construction-on-a-27beckett-street-melbourne.jpg", "licence": "CC BY-SA 2.0", "og": "og/metro-tunnel-construction-on-a-27beckett-street-melbourne.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Metro_Tunnel_construction_on_A%27Beckett_Street,_Melbourne.jpg", "srcset": "img/metro-tunnel-construction-on-a-27beckett-street-melbourne-800.webp 800w, img/metro-tunnel-construction-on-a-27beckett-street-melbourne-1600.webp 1600w", "url": "img/metro-tunnel-construction-on-a-27beckett-street-melbourne-1600.webp"}, "priority": 10, "risk": "amber", "section": "civic", "slug": "big-build-royal-commission-day-three-gatto-bracelet", "sources": [{"checked": "2026-11-11", "title": "AAP via the Maitland Mercury: Dozen bikie affiliates given key roles on CFMEU sites (11 Nov 2026, 2:12pm)", "url": "https://www.maitlandmercury.com.au/story/9389816/dozen-bikie-affiliates-given-key-roles-on-cfmeu-sites/"}, {"checked": "2026-11-11", "title": "NCA NewsWire via Yahoo News Australia: Underworld figure's gold bracelet gifts (11 Nov 2026)", "url": "https://au.news.yahoo.com/underworld-figure-gold-bracelet-gifts-025507660.html"}], "status": "published", "type": "news", "updated": "2026-11-11T05:40:00Z"}, {"approvedAt": "2026-11-11T05:20:00Z", "approvedBy": "publisher", "byline": "The Melbourne Indian newsroom", "created": "2026-11-10T04:30:00Z", "date": "2026-11-10", "en": {"body": ["Cricket Australia (CA) will not open a new investigation into the 2018 Cape Town ball-tampering scandal, its chief executive Todd Greenberg said on Tuesday, after former Test opener Usman Khawaja wrote that the whole team knew about it.", "Speaking on radio station SEN, Greenberg said there were \"specific details in his book that contradict the versions that have been provided by others\", according to ABC News and Reuters.", "\"We don't see any compelling reason to open the investigation or revisit this again,\" he said. He added that CA was comfortable with the outcome of the original investigation, which found that only captain Steve Smith, vice-captain David Warner and batter Cameron Bancroft knew of the plan.", {"h": "What Khawaja says"}, "In his autobiography, Sabr, Khawaja writes that discussion of tampering with the ball was not limited to a few players, and that sandpaper had been used before the Cape Town Test. He was not interviewed in the 2018 inquiry, the ABC reported. He also wrote that ball-tampering was common in the Sheffield Shield and named Victoria as the state best at it.", "Responding to critics on social media on Tuesday, Khawaja said he had no commercial motive for the book, Reuters reported.", {"h": "Other responses"}, {"ul": ["Warner, one of the three players banned in 2018, said on Instagram on Monday that Khawaja's account was \"100 per cent accurate\" and described the original investigation as rushed and botched.", "Bancroft declined to comment on Monday, Reuters reported. Former CA chief executive James Sutherland also declined to comment.", "Pat Cummins, Josh Hazlewood, Mitchell Starc and Nathan Lyon denied knowledge of the plan in a joint statement in 2021."]}, "Smith, Warner and Bancroft were banned or penalised by CA days after the incident in Cape Town in March 2018.", {"note": "Earlier: Khawaja's book reopens Cape Town ball-tampering row, and Warner says his account is accurate."}], "dek": "Chief executive Todd Greenberg says parts of Usman Khawaja's book contradict other accounts, and he sees no reason to revisit the 2018 Cape Town scandal.", "headline": "Cricket Australia won't reopen ball-tampering inquiry despite Khawaja's claims"}, "figure": {"en": "Cape Town investigation will not be reopened", "value": "2018"}, "image": {"addedAt": "2026-11-11T05:40:00Z", "addedBy": "claude", "alt": {"en": "Newlands cricket ground in Cape Town, with Table Mountain behind the stands and floodlights."}, "caption": {"en": "Newlands in Cape Town, where the 2018 ball-tampering scandal happened. Photo taken in 2026."}, "credit": "EGilham", "file": "images/newlands-cricket-ground.jpg", "licence": "CC BY-SA 4.0", "og": "og/newlands-cricket-ground.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Newlands_Cricket_Ground.jpg", "srcset": "img/newlands-cricket-ground-800.webp 800w, img/newlands-cricket-ground-1600.webp 1600w", "url": "img/newlands-cricket-ground-1600.webp"}, "priority": 6, "risk": "amber", "section": "sport", "slug": "cricket-australia-no-new-sandpapergate-inquiry", "sources": [{"checked": "2026-11-10", "title": "ABC News: Cricket Australia chief Todd Greenberg says there will be no new Sandpapergate investigation (10 Nov 2026)", "url": "https://www.abc.net.au/news/2026-11-10/cricket-australia-no-sandpapergate-investigation/107367290"}, {"checked": "2026-11-10", "title": "Reuters via CNA (reprinted by Press News Agency): Cricket Australia CEO says will not open another investigation into 'Sandpapergate' (10 Nov 2026)", "url": "https://pressnewsagency.org/cricket-australia-ceo-says-will-not-open-another-investigation-into-sandpapergate/"}, {"checked": "2026-11-10", "title": "Yahoo News Australia: Khawaja hits back at book critics", "url": "https://au.news.yahoo.com/dont-money-khawaja-hits-back-022118496.html"}], "status": "published", "type": "news", "updated": "2026-11-11T05:20:00Z"}, {"approvedAt": "2026-11-11T05:20:00Z", "approvedBy": "publisher", "byline": "The Melbourne Indian newsroom", "created": "2026-11-11T04:30:00Z", "date": "2026-11-11", "en": {"body": ["David Jones will close 19 of its 38 stores, including three in Melbourne, after receivers took control of the 188-year-old department store chain.", "Receivers FTI Consulting announced the closures on Wednesday. \"The receivers have made the difficult decision to proceed with an urgent restructure of the business,\" they said, according to AAP. FTI said the steps were \"unavoidable if David Jones is to continue as a viable business\", The Nightly reported.", {"h": "The Melbourne stores"}, "The Victorian stores closing are Glen Waverley, Highpoint (in Maribyrnong) and Malvern Central, according to SmartCompany and The Nightly.", "The other closures are seven stores in New South Wales, three in Western Australia (including the Hay Street Mall store in central Perth), two each in Queensland and South Australia, one in the ACT and the chain's only New Zealand store, in Auckland.", {"h": "When"}, "The stores will keep trading for now and no final closure date has been set. \"We anticipate they will cease trading by the end of the year,\" FTI said, according to The Nightly. Staff at affected stores are being consulted, and flagship stores in capital-city CBDs have largely been spared.", "David Jones employs about 6,000 people. The receivers have not said how many jobs will go.", {"h": "How it got here"}, "FTI was appointed receiver last week by lender Hilco Capital, after McGrathNicol was appointed voluntary administrator, SmartCompany reported. The business had reportedly not paid rent to Westfield owner Scentre Group since September. Expressions of interest from potential buyers are due by the end of this week.", "Charles Lloyd Jones, a member of the founding family who left the business in 1993, told AAP: \"If you don't have a unique offer, then it's a race to the bottom with price.\"", {"note": "If you work at an affected store, the Fair Work Ombudsman (13 13 94) can explain your rights in a closure or insolvency. This is general information, not legal advice."}], "dek": "Receivers say an urgent restructure is needed. Most closing stores are in the suburbs; city flagships largely survive.", "headline": "David Jones to close 19 stores, including Highpoint, Glen Waverley and Malvern Central"}, "figure": {"en": "David Jones stores to close, three of them in Melbourne", "value": "19"}, "image": {"addedAt": "2026-11-11T05:40:00Z", "addedBy": "claude", "alt": {"en": "The ornate cream facade of a David Jones department store, with black and red banners hanging from flagpoles."}, "caption": {"en": "A David Jones store in 2011. The receivers say capital-city flagship stores have largely been spared."}, "credit": "Rexness", "file": "images/david-jones-6077747084.jpg", "licence": "CC BY-SA 2.0", "og": "og/david-jones-6077747084.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:David_Jones_(6077747084).jpg", "srcset": "img/david-jones-6077747084-800.webp 800w, img/david-jones-6077747084-1600.webp 1600w", "url": "img/david-jones-6077747084-1600.webp"}, "priority": 10, "risk": "amber", "section": "business", "slug": "david-jones-19-stores-closing-victoria", "sources": [{"checked": "2026-11-11", "title": "AAP via the Muswellbrook Chronicle: David Jones receivers to slash half of chain's stores (11 Nov 2026, 2:53pm)", "url": "https://www.muswellbrookchronicle.com.au/story/9389442/david-jones-receivers-to-slash-half-of-chains-stores/"}, {"checked": "2026-11-11", "title": "SmartCompany: David Jones to close 19 stores (11 Nov 2026)", "url": "https://www.smartcompany.com.au/retail/david-jones-to-close-19-stores/"}, {"checked": "2026-11-11", "title": "The Nightly: David Jones to shutter 19 stores nationally (11 Nov 2026, updated 3:14pm)", "url": "https://thenightly.com.au/business/david-jones-to-shutter-19-stores-nationally-with-thousands-of-jobs-expected-to-be-axed-c-23147189"}], "status": "published", "type": "news", "updated": "2026-11-11T05:40:00Z"}, {"approvedAt": "2026-11-11T05:20:00Z", "approvedBy": "publisher", "byline": "The Melbourne Indian newsroom", "created": "2026-11-11T02:40:00Z", "date": "2026-11-11", "en": {"body": ["Eleven Australian soldiers killed in the First World War, and commemorated for more than a century as unknown, have been formally identified, the federal government announced for Remembrance Day.", "Five of the men were from Victoria: Sergeant Charles Henry Nicholls of Ballarat, Lieutenant Howard Victor Morey of Lilydale, Second Lieutenant James Albert McMichael of Melbourne, Corporal Harry Maitland Whiteoak of Preston and Lance Corporal Alexander Joseph Jack of Brunswick, according to the list reported by ABC News and NCA NewsWire.", "The identifications drew on historical research, archaeological work and DNA analysis. The Army's Unrecovered War Casualties team, the Office of Australian War Graves and the Commonwealth War Graves Commission did the work, with help from French authorities, independent researchers and the soldiers' descendants.", {"h": "Killed together at Bullecourt"}, "Four of the men served with the 2nd Australian Field Ambulance, the unit that included Corporal Whiteoak and Lance Corporal Jack. NCA NewsWire reported that all four were killed on 5 May 1917, during the Second Battle of Bullecourt in France, when an artillery shell hit a regimental aid post set up in a railway cutting. The Army team recovered them during an excavation at Riencourt-lès-Cagnicourt in April 2025.", {"h": "The 11 soldiers"}, {"ul": ["Private Roy Hawkins, 3rd Battalion, of Armidale, NSW", "Sergeant Charles Henry Nicholls, 46th Battalion, of Ballarat, Vic", "Lieutenant Howard Victor Morey, 58th Battalion, of Lilydale, Vic", "Lieutenant John Maher Lyons MC, MM, MSM, 17th Battalion, of Randwick, NSW", "Lieutenant Andrew Anderson, 7th Australian Machine Gun Company, of Bundaberg, Qld", "Second Lieutenant James Albert McMichael, 37th Battalion, of Melbourne, Vic", "Private Thomas Easton, 30th Battalion, of Adamstown, NSW", "Corporal Harry Maitland Whiteoak, 2nd Australian Field Ambulance, of Preston, Vic", "Private George Laban Lupson, 2nd Australian Field Ambulance, of Fremantle, WA", "Private James Campbell, 2nd Australian Field Ambulance, of Queenstown, Tas", "Lance Corporal Alexander Joseph Jack, 2nd Australian Field Ambulance, of Brunswick, Vic"]}, "Lieutenant Anderson was killed near Ypres in Belgium on 20 September 1917, aged 23. ABC News reported that his comrades buried him by the roadside under a wooden cross, and that an unknown soldier recovered from almost the same spot in 1919, whose grave record noted \"Anderson on shirt\", was reburied at Hooge Crater Cemetery. His headstone there can now carry his name.", "Deputy Prime Minister and Defence Minister Richard Marles, whose great-uncle was Lieutenant Anderson, said the identification was \"deeply personal\" for his family, ABC News reported. Veterans' Affairs Minister Matt Keogh said the work would \"provide long-awaited answers for families\" after generations of uncertainty.", {"note": "Indian soldiers also fought beside the Anzacs at Gallipoli. Our Remembrance Day feature on them is in the Community section."}], "dek": "Men from Preston, Brunswick, Melbourne, Lilydale and Ballarat are among the Diggers identified through research, archaeology and DNA, announced on Remembrance Day.", "headline": "Eleven First World War soldiers buried as 'unknown' are named, five of them from Victoria"}, "figure": {"en": "Australian soldiers of the First World War named after more than a century", "value": "11"}, "image": {"addedAt": "2026-11-11T05:40:00Z", "addedBy": "claude", "alt": {"en": "A stone memorial at Bullecourt, France, with plaques, poppy wreaths and small Australian flags at its base."}, "caption": {"en": "The Australian memorial at Bullecourt, France, where four of the newly identified soldiers were killed in May 1917."}, "credit": "Liondartois", "file": "images/bullecourt-australian-monument.jpg", "licence": "CC BY-SA 3.0", "og": "og/bullecourt-australian-monument.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Bullecourt_australian_monument.jpg", "srcset": "img/bullecourt-australian-monument-800.webp 800w, img/bullecourt-australian-monument-1600.webp 1600w", "url": "img/bullecourt-australian-monument-1600.webp"}, "priority": 7, "risk": "green", "section": "community", "slug": "eleven-wwi-soldiers-identified-five-victorians", "sources": [{"checked": "2026-11-11", "title": "ABC News: Eleven unknown Australian soldiers killed in WWI formally identified (10 Nov 2026)", "url": "https://www.abc.net.au/news/2026-11-10/eleven-australian-soldiers-killed-wwi-formally-idenified/107370258"}, {"checked": "2026-11-11", "title": "NCA NewsWire via Yahoo News Australia: 11 fallen WW1 Diggers finally named (10-11 Nov 2026)", "url": "https://au.news.yahoo.com/11-fallen-ww1-diggers-finally-203902860.html"}, {"checked": "2026-11-11", "title": "Minister for Defence: Eleven Australian soldiers identified more than a century after the First World War (11 Nov 2026) — not opened, check", "url": "https://www.minister.defence.gov.au/media-releases/2026-11-11/eleven-australian-soldiers-identified-more-than-century-after-first-world-war"}, {"checked": "2026-11-11", "title": "ABC News: Federal politics live blog, 11 Nov 2026 (Marles, 7:15am)", "url": "https://www.abc.net.au/news/2026-11-11/federal-politics-live-blog-nov-11/107371364"}], "status": "published", "type": "news", "updated": "2026-11-11T05:20:00Z"}, {"approvedAt": "2026-11-11T05:20:00Z", "approvedBy": "publisher", "byline": "The Melbourne Indian newsroom", "created": "2026-11-11T04:30:00Z", "date": "2026-11-11", "en": {"body": ["Police divers are searching rivers in Gippsland as the hunt for a missing 17-year-old enters its fifth day.", "William, who also goes by Will, was last seen at about 4pm on Friday 6 November near Stoney Creek Road, close to Walhalla East, Victoria Police said. He was camping with another teenager and walked a short distance to another part of the camp to collect equipment. When he did not return, the other teen searched but found no sign of him.", "He was wearing a pair of shorts and work boots, police said. ABC News reported he left his phone, food and water behind.", {"h": "The search"}, "The search is being run from a command post at Cowwarr and has widened to a larger area of dense bush, with a police helicopter, off-road motorbikes, Search and Rescue officers and SES crews, ABC News reported. About 40 to 50 people are searching on foot.", "\"There's nothing that we're not doing to try to find William, and we're still very hopeful that today might be the day,\" Acting Inspector Jason Benbow told the ABC.", {"h": "How you can help"}, {"ul": ["If you see William, call Triple Zero (000).", "If you have information, call Crime Stoppers on 1800 333 000 or Sale police station on (03) 5142 2200."]}], "dek": "William, who goes by Will, was last seen on Friday afternoon while camping near Walhalla East. Police say they are still hopeful.", "headline": "Police divers join search for missing 17-year-old in Gippsland bush, now in its fifth day"}, "figure": {"en": "since William was last seen near Walhalla East", "value": "5 days"}, "image": {"addedAt": "2026-11-11T05:40:00Z", "addedBy": "claude", "alt": {"en": "The red-roofed general store and cafe in Walhalla, surrounded by trees."}, "caption": {"en": "Walhalla, in the Gippsland ranges. William was last seen near Walhalla East."}, "credit": "Stevage", "file": "images/walhalla-general-store-stevage.jpg", "licence": "CC BY-SA 4.0", "og": "og/walhalla-general-store-stevage.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Walhalla_general_store_Stevage.jpg", "srcset": "img/walhalla-general-store-stevage-800.webp 800w, img/walhalla-general-store-stevage-1600.webp 1600w", "url": "img/walhalla-general-store-stevage-1600.webp"}, "priority": 6, "risk": "amber", "section": "community", "slug": "missing-teen-william-gippsland-search", "sources": [{"checked": "2026-11-11", "title": "Victoria Police: Police continue to search for missing teen William (8 Nov 2026)", "url": "https://www.police.vic.gov.au/police-continue-search-missing-teen-william"}, {"checked": "2026-11-11", "title": "ABC News: Police divers to search rivers as hunt for missing boy enters fifth day (11 Nov 2026, 10:09am)", "url": "https://www.abc.net.au/news/2026-11-11/major-search-for-missing-boy-william-enters-fifth-day/107371578"}], "status": "published", "type": "news", "updated": "2026-11-11T05:20:00Z"}, {"approvedAt": "2026-11-11T05:20:00Z", "approvedBy": "publisher", "byline": "The Melbourne Indian newsroom", "created": "2026-11-11T02:40:00Z", "date": "2026-11-11", "en": {"body": ["Qantas will cut 850 corporate jobs under a deal with the global consulting firm Accenture, and most of the work will be delivered from India, the airline told staff by email on Tuesday, AAP reported.", "The first phase covers finance, procurement, human resources and marketing. Some roles will stay in Australia. ABC News reported that the changes will be phased in, with the first expected from mid-2027.", "Chief executive Vanessa Hudson said the overhaul was about \"modernising the technology behind our business and becoming more efficient\", pointing to unwieldy back-office processes and the effect of artificial intelligence. \"This is hard news for some,\" she said, but \"standing still is not an option\", according to AAP.", {"h": "Unions and the government"}, "The Australian Services Union says Qantas is using AI as a reason to move Australian jobs offshore. Angus McFarland, the union's NSW and ACT secretary, told AAP the decision \"should be chilling to not just those workers but all Australians\". The union says the Sydney head office will be hit hardest. Assistant national secretary Scott Cowen called for rules to protect local jobs as AI spreads, and for transition support for affected workers.", "Acting Prime Minister Richard Marles told ABC News Breakfast the decision was \"disappointing\" and that \"it's really important that Australian jobs are a focus here\". He said Qantas should work with unions so that as many staff as possible are redeployed.", {"h": "Part of a wider trend"}, "AAP reported that Woolworths, Coles, Canva, NAB and ANZ have also announced or flagged moving corporate or back-office work to India, the Philippines or elsewhere in Asia.", "Qantas reported a 2025-26 net profit of about $1.3 billion in August, down almost 20 per cent, after high jet fuel costs, and has warned fares could rise again in 2027.", {"note": "If your job is affected, your union or the Fair Work Ombudsman (13 13 94) can explain redundancy and consultation rights. This is general information, not legal advice."}], "dek": "Finance, procurement, HR and marketing staff are first in line. Qantas blames clunky systems and AI; unions call it offshoring, and the Acting Prime Minister says it is disappointing.", "headline": "Qantas to cut 850 corporate jobs, with most of the work moving to Accenture in India"}, "figure": {"en": "Qantas corporate roles to go under its deal with Accenture", "value": "850"}, "image": {"addedAt": "2026-11-11T05:40:00Z", "addedBy": "claude", "alt": {"en": "A Qantas Boeing 737 with a red tail and kangaroo logo coming in to land against a blue sky."}, "caption": {"en": "A Qantas Boeing 737 arriving at Melbourne Airport."}, "credit": "Mitchul Hope", "file": "images/qantas-vh-vye-boeing-737-838-melbourne-international-airport-mel-ymml-5240085808.jpg", "licence": "CC BY-SA 2.0", "og": "og/qantas-vh-vye-boeing-737-838-melbourne-international-airport-mel-ymml-5240085808.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Qantas_VH-VYE_Boeing_737-838_Melbourne_International_Airport_(MEL_YMML)_(52400858085).jpg", "srcset": "img/qantas-vh-vye-boeing-737-838-melbourne-international-airport-mel-ymml-5240085808-800.webp 800w, img/qantas-vh-vye-boeing-737-838-melbourne-international-airport-mel-ymml-5240085808-1600.webp 1600w", "url": "img/qantas-vh-vye-boeing-737-838-melbourne-international-airport-mel-ymml-5240085808-1600.webp"}, "priority": 8, "risk": "amber", "section": "business", "slug": "qantas-850-corporate-jobs-accenture-india", "sources": [{"checked": "2026-11-11", "title": "AAP via Yahoo Finance Australia: Worker fears as Qantas blames AI impact for job cuts (10 Nov 2026)", "url": "https://au.finance.yahoo.com/news/qantas-slash-hundreds-jobs-send-002344777.html"}, {"checked": "2026-11-11", "title": "ABC News: Qantas lay-offs show tourism industry grappling with influence of AI (11 Nov 2026)", "url": "https://www.abc.net.au/news/2026-11-11/qantas-layoffs-tourism-ai/107368252"}, {"checked": "2026-11-11", "title": "ABC News: Federal politics live blog, 11 Nov 2026 (Marles, 7:17am)", "url": "https://www.abc.net.au/news/2026-11-11/federal-politics-live-blog-nov-11/107371364"}], "status": "published", "type": "news", "updated": "2026-11-11T05:20:00Z"}, {"approvedAt": "2026-11-11T05:20:00Z", "approvedBy": "publisher", "byline": "The Melbourne Indian newsroom", "created": "2026-11-11T02:40:00Z", "date": "2026-11-11", "en": {"body": ["Victoria's 2026-27 skilled visa nomination program is now open for registrations of interest (ROIs) for the Skilled Nominated visa (subclass 190), the Victorian Government's Live in Melbourne website says.", "The regional visa, the Skilled Work Regional (Provisional) visa (subclass 491), \"is not currently open, and Registrations of Interest for subclass 491 nomination are not being accepted\", according to the same website.", {"h": "How it works"}, {"ul": ["First, lodge or update an Expression of Interest (EOI) in the Australian Government's SkillSelect system.", "Then submit an ROI for Victorian nomination through the Live in Melbourne portal.", "Victoria invites some people to apply for nomination. An invitation is not a visa, and you must still meet all the Home Affairs visa requirements."]}, {"h": "What migration lawyers are reporting"}, "Migration law firms that track the program say Victoria has 900 nomination places for the 190 visa in 2026-27, and that
