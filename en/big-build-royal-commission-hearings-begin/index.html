s injury. He appeared at Melbourne Magistrates' Court by video link on Monday and is due back in court on 26 April.", "Mr Feng, 47, was a father of two from Shaanxi province in China who had lived in Australia for about nine years, the ABC reported. He was stabbed on Frederick Way at about 8pm on 6 November. A 34-year-old rider was seriously injured and taken to hospital.", {"note": "This case is before the courts. The Melbourne Indian will not publish anything that could affect a fair trial."}, {"h": "Support for the family"}, "The GoFundMe appeal was set up by the Melbourne Chinatown Business Association. Flowers have been left near the State Library.", "Delivery platform HungryPanda said it was helping Mr Feng's family with visas, funeral arrangements, finances and insurance. The Transport Workers Union has questioned what the company does to manage risks for riders.", {"h": "What police and the city say"}, "Lord Mayor Nick Reece said police would be \"flooding the zone\" in the central city until the end of the year, and that crime there had fallen 5.9 per cent over 12 months.", "Assistant Commissioner Jo Stafford said Operation Harmony had doubled police resources in the CBD, but that police \"can't solve this problem alone\".", {"h": "If you ride for a living"}, {"ul": ["In an emergency, call Triple Zero (000).", "To report information to police, call Crime Stoppers on 1800 333 000.", "Most delivery apps have an in-app safety or emergency button; check where yours is before your next shift.", "The Transport Workers Union represents delivery riders and can advise on safety and insurance."]}], "dek": "Melbourne has rallied behind the father of two killed near Queen Victoria Market. A 51-year-old man appeared in court on Monday, and police say they are flooding the CBD with officers.", "headline": "$450,000 raised for family of delivery rider Feng Jianming as man faces murder charge"}, "figure": {"en": "raised for Mr Feng's family", "value": "$450k+"}, "image": {"addedAt": "2026-11-09T19:58:00Z", "addedBy": "claude", "alt": {"en": "The cream-coloured heritage facade of the Queen Victoria Market under a clear blue sky, with tram wires overhead."}, "caption": {"en": "The Queen Victoria Market building in Melbourne's CBD. Photo taken in 2017."}, "credit": "Crisco 1492", "file": "images/queen-victoria-market-melbourne-2017-10-29-01.jpg", "licence": "CC BY-SA 4.0", "og": "og/queen-victoria-market-melbourne-2017-10-29-01.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Queen_Victoria_Market,_Melbourne,_2017-10-29_01.jpg", "srcset": "img/queen-victoria-market-melbourne-2017-10-29-01-800.webp 800w, img/queen-victoria-market-melbourne-2017-10-29-01-1280.webp 1280w", "url": "img/queen-victoria-market-melbourne-2017-10-29-01-1280.webp"}, "priority": 8, "risk": "red", "section": "community", "slug": "delivery-rider-killed-queen-victoria-market", "sources": [{"checked": "2026-11-09", "title": "ABC News: Man charged with murder over fatal stabbing of Feng Jianming (9 Nov 2026)", "url": "https://www.abc.net.au/news/2026-11-09/man-charged-murder-feng-jianming-fatal-stabbing/107362070"}, {"checked": "2026-11-09", "title": "Northern Daily Leader (AAP): Man charged over fatal stabbing of delivery driver (9 Nov 2026)", "url": "https://www.northerndailyleader.com.au/story/9387853/man-charged-over-fatal-stabbing-of-delivery-driver/"}], "status": "published", "type": "news", "updated": "2026-11-09T20:06:00Z"}, {"byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["Diwali falls on Sunday 8 November this year, the date set by the lunar calendar. For many Hindu, Sikh and Jain families in Melbourne, the day brings prayers, lamps, sweets and visits to family and friends.", "Public celebrations started early. Melbourne Diwali, a free festival run by the not-for-profit SarasCare, was scheduled for Saturday 31 October at Marvel Stadium Square in Docklands, from 2pm to 10pm.", "On Saturday 7 November the Immigration Museum on Flinders Street held a day of free Diwali activities, including henna, rangoli and traditional games. In ticketed Indian embroidery workshops, visitors added their own work to a shared 10-metre textile artwork.", "Many Hindu temples and Sikh gurdwaras across Melbourne hold special prayers and services around Diwali. For Sikhs, the day is also Bandi Chhor Divas, which marks the release of Guru Hargobind Sahib Ji from imprisonment. Check with your local temple or gurdwara for times.", {"h": "Coming up: Gurpurab"}, "The next major date for many in the community is the Gurpurab of Guru Nanak Dev Ji later this month. Published calendars list it on 24 or 25 November, depending on the calendar and time zone used, so confirm the dates of nagar kirtans and services with your gurdwara."], "dek": "Diwali falls on Sunday 8 November this year. Celebrations across the city began a week earlier.", "headline": "Diwali 2026: Melbourne marks the festival of lights"}, "figure": {"en": "November · Diwali", "hi": "नवंबर · दिवाली", "pa": "ਨਵੰਬਰ · ਦੀਵਾਲੀ", "value": "8"}, "hi": {"body": ["चंद्र पंचांग के अनुसार इस साल दिवाली रविवार, 8 नवंबर को है। मेलबर्न में बहुत से हिंदू, सिख और जैन परिवारों के लिए यह दिन पूजा, दीयों, मिठाइयों और अपनों से मिलने-जुलने का दिन है।", "सार्वजनिक उत्सव पहले ही शुरू हो गए थे। गैर-लाभकारी संस्था SarasCare द्वारा आयोजित निःशुल्क 'मेलबर्न दिवाली' उत्सव शनिवार, 31 अक्टूबर को डॉकलैंड्स के मार्वल स्टेडियम स्क्वेयर में दोपहर 2 बजे से रात 10 बजे तक होना तय था।", "शनिवार, 7 नवंबर को फ़्लिंडर्स स्ट्रीट स्थित इमिग्रेशन म्यूज़ियम में दिवाली की निःशुल्क गतिविधियाँ हुईं, जिनमें मेहंदी, रंगोली और पारंपरिक खेल शामिल थे। टिकट वाली भारतीय कढ़ाई कार्यशालाओं में लोगों ने 10 मीटर लंबी साझा कपड़ा-कलाकृति में अपना योगदान जोड़ा।", "दिवाली के आसपास मेलबर्न के कई हिंदू मंदिरों और सिख गुरुद्वारों में विशेष पूजा और दीवान होते हैं। सिखों के लिए यह दिन बंदी छोड़ दिवस भी है, जो गुरु हरगोबिंद साहिब जी की क़ैद से रिहाई की याद में मनाया जाता है। समय जानने के लिए अपने नज़दीकी मंदिर या गुरुद्वारे से संपर्क करें।", {"h": "आगे: गुरपुरब"}, "समुदाय में बहुतों के लिए अगली बड़ी तारीख़ इसी महीने गुरु नानक देव जी का प्रकाश पर्व (गुरपुरब) है। अलग-अलग कैलेंडर और समय-क्षेत्र के हिसाब से प्रकाशित पंचांगों में इसकी तारीख़ 24 या 25 नवंबर दी गई है, इसलिए नगर कीर्तन और दीवानों की तारीख़ अपने गुरुद्वारे से पक्की कर लें।"], "dek": "इस साल दिवाली रविवार, 8 नवंबर को है। शहर में उत्सव एक हफ़्ता पहले ही शुरू हो गए थे।", "headline": "दिवाली 2026: रोशनी के त्योहार के रंग में मेलबर्न"}, "image": {"addedAt": "2026-11-08T11:22:03Z", "addedBy": "claude", "alt": {"en": "Small lit clay oil lamps arranged around a larger central lamp on marigold petals and a white rangoli pattern on a stone floor."}, "caption": {"en": "Diyas, the traditional oil lamps lit for Diwali, arranged in a rangoli."}, "credit": "siddarth varanasi", "file": "images/diya-set-in-a-rangoli.jpg", "licence": "CC BY 2.0", "og": "og/diya-set-in-a-rangoli.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Diya_set_in_a_rangoli.jpg", "srcset": "img/diya-set-in-a-rangoli-800.webp 800w, img/diya-set-in-a-rangoli-1600.webp 1600w", "url": "img/diya-set-in-a-rangoli-1600.webp"}, "pa": {"body": ["ਚੰਦਰ ਕੈਲੰਡਰ ਮੁਤਾਬਕ ਇਸ ਸਾਲ ਦੀਵਾਲੀ ਐਤਵਾਰ, 8 ਨਵੰਬਰ ਨੂੰ ਹੈ। ਮੈਲਬਰਨ ਦੇ ਬਹੁਤ ਸਾਰੇ ਹਿੰਦੂ, ਸਿੱਖ ਅਤੇ ਜੈਨ ਪਰਿਵਾਰਾਂ ਲਈ ਇਹ ਦਿਨ ਅਰਦਾਸ-ਪੂਜਾ, ਦੀਵਿਆਂ, ਮਠਿਆਈਆਂ ਅਤੇ ਆਪਣਿਆਂ ਨੂੰ ਮਿਲਣ ਦਾ ਦਿਨ ਹੈ।", "ਜਨਤਕ ਜਸ਼ਨ ਪਹਿਲਾਂ ਹੀ ਸ਼ੁਰੂ ਹੋ ਗਏ ਸਨ। ਗੈਰ-ਮੁਨਾਫ਼ਾ ਸੰਸਥਾ SarasCare ਵੱਲੋਂ ਕਰਵਾਇਆ ਜਾਂਦਾ ਮੁਫ਼ਤ 'ਮੈਲਬਰਨ ਦੀਵਾਲੀ' ਮੇਲਾ ਸ਼ਨੀਵਾਰ, 31 ਅਕਤੂਬਰ ਨੂੰ ਡੌਕਲੈਂਡਜ਼ ਦੇ ਮਾਰਵਲ ਸਟੇਡੀਅਮ ਸਕੁਏਅਰ ਵਿੱਚ ਦੁਪਹਿਰ 2 ਵਜੇ ਤੋਂ ਰਾਤ 10 ਵਜੇ ਤੱਕ ਹੋਣਾ ਤੈਅ ਸੀ।", "ਸ਼ਨੀਵਾਰ, 7 ਨਵੰਬਰ ਨੂੰ ਫ਼ਲਿੰਡਰਜ਼ ਸਟ੍ਰੀਟ ਸਥਿਤ ਇਮੀਗ੍ਰੇਸ਼ਨ ਮਿਊਜ਼ੀਅਮ ਵਿੱਚ ਦੀਵਾਲੀ ਦੀਆਂ ਮੁਫ਼ਤ ਗਤੀਵਿਧੀਆਂ ਹੋਈਆਂ, ਜਿਨ੍ਹਾਂ ਵਿੱਚ ਮਹਿੰਦੀ, ਰੰਗੋਲੀ ਅਤੇ ਰਵਾਇਤੀ ਖੇਡਾਂ ਸ਼ਾਮਲ ਸਨ। ਟਿਕਟ ਵਾਲੀਆਂ ਭਾਰਤੀ ਕਢਾਈ ਵਰਕਸ਼ਾਪਾਂ ਵਿੱਚ ਲੋਕਾਂ ਨੇ 10 ਮੀਟਰ ਲੰਮੀ ਸਾਂਝੀ ਕੱਪੜਾ-ਕਲਾਕ੍ਰਿਤੀ ਵਿੱਚ ਆਪਣਾ ਹਿੱਸਾ ਪਾਇਆ।", "ਦੀਵਾਲੀ ਦੇ ਆਸ-ਪਾਸ ਮੈਲਬਰਨ ਦੇ ਕਈ ਹਿੰਦੂ ਮੰਦਰਾਂ ਅਤੇ ਗੁਰਦੁਆਰਿਆਂ ਵਿੱਚ ਖ਼ਾਸ ਪੂਜਾ ਅਤੇ ਦੀਵਾਨ ਸਜਦੇ ਹਨ। ਸਿੱਖਾਂ ਲਈ ਇਹ ਦਿਨ ਬੰਦੀ ਛੋੜ ਦਿਵਸ ਵੀ ਹੈ, ਜੋ ਗੁਰੂ ਹਰਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਦੀ ਕੈਦ ਤੋਂ ਰਿਹਾਈ ਦੀ ਯਾਦ ਵਿੱਚ ਮਨਾਇਆ ਜਾਂਦਾ ਹੈ। ਸਮੇਂ ਲਈ ਆਪਣੇ ਨੇੜਲੇ ਮੰਦਰ ਜਾਂ ਗੁਰਦੁਆਰੇ ਨਾਲ ਸੰਪਰਕ ਕਰੋ।", {"h": "ਅੱਗੇ: ਗੁਰਪੁਰਬ"}, "ਭਾਈਚਾਰੇ ਵਿੱਚ ਬਹੁਤਿਆਂ ਲਈ ਅਗਲੀ ਵੱਡੀ ਤਰੀਕ ਇਸੇ ਮਹੀਨੇ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦਾ ਪ੍ਰਕਾਸ਼ ਪੁਰਬ ਹੈ। ਵੱਖ-ਵੱਖ ਕੈਲੰਡਰਾਂ ਅਤੇ ਸਮਾਂ-ਖੇਤਰਾਂ ਮੁਤਾਬਕ ਛਪੀਆਂ ਜੰਤਰੀਆਂ ਵਿੱਚ ਇਸਦੀ ਤਰੀਕ 24 ਜਾਂ 25 ਨਵੰਬਰ ਦਿੱਤੀ ਗਈ ਹੈ, ਇਸ ਲਈ ਨਗਰ ਕੀਰਤਨ ਅਤੇ ਦੀਵਾਨਾਂ ਦੀ ਤਰੀਕ ਆਪਣੇ ਗੁਰਦੁਆਰੇ ਤੋਂ ਪੱਕੀ ਕਰ ਲਓ।"], "dek": "ਇਸ ਸਾਲ ਦੀਵਾਲੀ ਐਤਵਾਰ, 8 ਨਵੰਬਰ ਨੂੰ ਹੈ। ਸ਼ਹਿਰ ਵਿੱਚ ਜਸ਼ਨ ਇੱਕ ਹਫ਼ਤਾ ਪਹਿਲਾਂ ਹੀ ਸ਼ੁਰੂ ਹੋ ਗਏ ਸਨ।", "headline": "ਦੀਵਾਲੀ 2026: ਰੌਸ਼ਨੀਆਂ ਦੇ ਤਿਉਹਾਰ ਦੇ ਰੰਗ ਵਿੱਚ ਮੈਲਬਰਨ"}, "priority": 6, "risk": "green", "section": "culture", "slug": "diwali-2026-melbourne", "sources": [{"checked": "2026-11-08", "title": "Time Out Melbourne: Diwali in Melbourne 2026 (4 November 2026)", "url": "https://www.timeout.com/melbourne/news/from-festive-feasts-to-dance-parties-5-ways-to-celebrate-diwali-in-melbourne-110426"}, {"checked": "2026-11-08", "title": "Melbourne Diwali 2026: visitor guide (SarasCare)", "url": "https://www.melbournediwali.com.au/event-info"}, {"checked": "2026-11-08", "title": "City of Melbourne What's On: Diwali at the Immigration Museum", "url": "https://whatson.melbourne.vic.gov.au/things-to-do/diwali-at-the-immigration-museum"}], "status": "published", "translations": {"hi": "reviewed-by-claude", "pa": "reviewed-by-claude"}, "type": "news", "updated": "2026-11-08T11:22:03Z"}, {"approvedAt": "2026-11-08T20:02:36Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["When Prime Minister Anthony Albanese hosted Indian Prime Minister Narendra Modi for the third Australia–India Annual Summit in Melbourne in July, the two leaders reaffirmed their commitment to a Comprehensive Economic Cooperation Agreement (CECA). Modi said the two countries had decided to \"work at a fast pace\" on the CECA and on a bilateral investment treaty.", "India's Commerce Minister Piyush Goyal and Australia's Trade Minister Don Farrell discussed speeding up the negotiations when they met on the sidelines of the G20 trade ministers' meeting in Milwaukee on 30 September and 1 October, according to a post by Goyal. No timetable for concluding the agreement has been announced, The Indian Sun reported.", {"h": "What is already in place"}, "The interim Economic Cooperation and Trade Agreement (ECTA) has been in force since 29 December 2022. From 1 January 2026, eligible Indian goods gained duty-free access across all Australian tariff lines, subject to rules of origin.", "India was Australia's sixth-largest trading partner in 2025, with two-way trade in goods and services worth A$50.2 billion, according to the Department of Foreign Affairs and Trade.", {"h": "What the Melbourne summit agreed"}, {"ul": ["A Joint Declaration on Defence and Security Cooperation, and a new partnership on cyber, critical technologies and supply chains.", "An arrangement enabling long-term Australian uranium exports to India, for peaceful purposes only and under international (IAEA) safeguards.", "Approval for Melbourne's Victoria University to operate a campus in Gurugram, and a letter of intent for a Flinders University campus in Bengaluru.", "$10 million for the Centre for Australia-India Relations' Maitri grants, which support business and people-to-people links.", "A temporary space tracking terminal on the Cocos (Keeling) Islands to support India's Gaganyaan human spaceflight program."]}, "\"Our partnership has never been stronger,\" Albanese said after the talks. Modi said the relationship was \"not just a partnership for the present; it is also a partnership for the future.\"", {"h": "What it means for Melbourne businesses"}, "A fuller agreement could widen market access for services and investment. Any final agreement would still need to pass through Australia's treaty processes, including tabling in Parliament, law firm Clayton Utz noted in July."], "dek": "Leaders agreed in Melbourne in July to move faster on a comprehensive economic agreement. Trade ministers met again in October, but no date has been set to finish the deal.", "headline": "After the Melbourne summit, where does the India–Australia trade deal stand?"}, "figure": {"en": "two-way trade, 2025", "value": "A$50.2bn"}, "image": {"addedAt": "2026-11-08T11:22:03Z", "addedBy": "claude", "alt": {"en": "Red-and-white container cranes beside two container ships stacked with shipping containers at the Port of Melbourne under a cloudy sky."}, "caption": {"en": "The container terminal at the Port of Melbourne, one of the gateways for Australia's trade with India."}, "credit": "Bernard Spragg. NZ from Christchurch, New Zealand", "file": "images/port-of-melbourne-container-terminal.jpg", "licence": "CC0", "og": "og/port-of-melbourne-container-terminal.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Container_terminal._Port_of_Melbourne._(21891290959).jpg", "srcset": "img/port-of-melbourne-container-terminal-800.webp 800w, img/port-of-melbourne-container-terminal-1600.webp 1600w", "url": "img/port-of-melbourne-container-terminal-1600.webp"}, "priority": 6, "risk": "amber", "section": "india", "slug": "india-australia-trade-after-melbourne-summit", "sources": [{"checked": "2026-11-08", "title": "Prime Minister of Australia: Third Australia–India Annual Summit joint statement (9 July 2026)", "url": "https://www.pm.gov.au/media/australia-india-joint-statement"}, {"checked": "2026-11-08", "title": "Prime Minister of Australia: Joint media statement, Melbourne (9 July 2026)", "url": "https://www.pm.gov.au/media/joint-media-statement-melbourne"}, {"checked": "2026-11-08", "title": "The Indian Sun: India, Australia push to accelerate comprehensive trade deal (4 October 2026)", "url": "https://www.theindiansun.com.au/2026/10/04/india-australia-push-to-accelerate-comprehensive-trade-deal/"}, {"checked": "2026-11-08", "title": "Clayton Utz: The Australia–India Annual Summit, from ECTA to CECA (16 July 2026)", "url": "https://www.claytonutz.com/insights/2026/july/the-australia-india-annual-summit-from-ecta-to-ceca-and-what-it-means-for-business"}, {"checked": "2026-11-09", "title": "Department of Foreign Affairs and Trade: India country brief", "url": "https://www.dfat.gov.au/geo/india/india-country-brief"}], "status": "published", "type": "analysis", "updated": "2026-11-08T20:02:36Z"}, {"approvedAt": "2026-11-08T20:02:36Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["India has overtaken England as the most common overseas country of birth for people living in Australia, according to Australian Bureau of Statistics figures released on 29 April 2026.", "About 971,000 India-born people were living in Australia at 30 June 2025, with the England-born population also at about 971,000. India narrowly overtook England during 2025, the first time it has held the top position.", "The India-born population also recorded the largest increase of any birthplace group since 2015, rising by 522,000. The Italy-born and England-born populations recorded the largest decreases over the same period.", "Overall, 8.8 million people living in Australia, or 32 per cent of the population, were born overseas.", {"h": "Recognised at the Melbourne summit"}, "The milestone was noted in July, when Prime Minister Anthony Albanese and Indian Prime Minister Narendra Modi met in Melbourne. Their joint statement said the Indian community in Australia was \"now Australia's largest overseas-born group\".", {"note": "The ABS release did not include a state-by-state breakdown. We will report Victorian figures when they are published."}], "dek": "About 971,000 people living in Australia were born in India, narrowly ahead of England, according to the Australian Bureau of Statistics.", "headline": "India is now Australia's largest overseas-born community"}, "figure": {"en": "India-born people in Australia", "hi": "ऑस्ट्रेलिया में भारत में जन्मे लोग", "pa": "ਆਸਟ੍ਰੇਲੀਆ ਵਿੱਚ ਭਾਰਤ 'ਚ ਜੰਮੇ ਲੋਕ", "value": "971,000"}, "image": {"addedAt": "2026-11-08T20:13:38Z", "addedBy": "claude", "alt": {"en": "The ornate cream entrance towers of Shri Shiva Vishnu Temple in Carrum Downs, with visitors, some in saris, walking in front under a blue sky."}, "caption": {"en": "Shri Shiva Vishnu Temple in Carrum Downs, in Melbourne's south-east."}, "credit": "கோபி", "file": "images/shri-shiva-vishnu-temple-carrum-downs.jpg", "licence": "CC0", "og": "og/shri-shiva-vishnu-temple-carrum-downs.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Shiva_vishnu_koyil.jpg", "srcset": "img/shri-shiva-vishnu-temple-carrum-downs-800.webp 800w, img/shri-shiva-vishnu-temple-carrum-downs-1600.webp 1600w", "url": "img/shri-shiva-vishnu-temple-carrum-downs-1600.webp"}, "priority": 7, "risk": "green", "section": "community", "slug": "india-largest-overseas-born-group", "sources": [{"checked": "2026-11-08", "title": "Australian Bureau of Statistics: 8 things of interest about Australia's overseas-born population (29 April 2026)", "url": "https://www.abs.gov.au/media-centre/media-releases/8-things-interest-about-australias-overseas-born-population"}, {"checked": "2026-11-08", "title": "Australian Bureau of Statistics: Australia's population by country of birth, June 2025", "url": "https://www.abs.gov.au/statistics/people/population/australias-population-country-birth/latest-release"}, {"checked": "2026-11-08", "title": "Prime Minister of Australia: Third Australia–India Annual Summit joint statement (9 July 2026)", "url": "https://www.pm.gov.au/media/australia-india-joint-statement"}], "status": "published", "type": "news", "updated": "2026-11-08T20:13:38Z"}, {"approvedAt": "2026-11-08T12:32:11Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["Indian passport, visa and other consular applications in Australia are now handled through six VFS Global centres, in Adelaide, Brisbane, Canberra, Melbourne, Perth and Sydney, VFS Global said in July.", "The Melbourne centre is on the ground floor of 324 St Kilda Road, Melbourne. Applicants book an appointment online through VFS Global's India–Australia portal. Applications are taken Monday to Friday, 8.30am to 4pm, except on public holidays and holidays declared by the Indian mission.", {"h": "The cost"}, "A VFS Global service charge of $115 per application applies from 23 July 2026, in addition to the Government of India fee, SBS Hindi reported, citing an announcement by the High Commission of India.", {"h": "Why services stopped in July"}, "New passport and visa applications in Australia were suspended from 1 July while a dispute over the tender for India's outsourced consular services went through the Indian courts, Bloomberg reported. The High Commission of India in Canberra announced the restart on 23 July.", "In May, SBS Hindi reported that India's Consul General in Melbourne, Anish Rajan, had announced a move from the Swanston Street office to a larger centre on St Kilda Road, with extra counters to shorten booking waits.", {"h": "Before you book"}, {"ul": ["Book only through the official VFS Global website for Indian services in Australia.", "Check the current document checklist for your service before your appointment.", "Allow extra time, as appointment availability can change, particularly around holidays."]}, {"note": "Fees and procedures can change. Check the High Commission of India and VFS Global websites before you apply."}], "dek": "Indian consular applications in Victoria now go through a VFS Global centre on St Kilda Road, with a $115 service charge per application on top of government fees.", "headline": "Indian passport, visa and OCI services in Melbourne: what changed in 2026"}, "figure": {"en": "VFS service charge per application", "hi": "प्रति आवेदन VFS सेवा शुल्क", "pa": "ਪ੍ਰਤੀ ਅਰਜ਼ੀ VFS ਸੇਵਾ ਫ਼ੀਸ", "value": "$115"}, "image": {"addedAt": "2026-11-08T11:22:03Z", "addedBy": "claude", "alt": {"en": "A long yellow tram covered in advertising travelling along St Kilda Road, with trees behind and a grass median in front."}, "caption": {"en": "A tram on St Kilda Road, where the VFS Global centre for Indian consular services in Melbourne is located."}, "credit": "Ymblanter", "file": "images/tram-3510-st-kilda-road.jpg", "licence": "CC BY-SA 4.0", "og": "og/tram-3510-st-kilda-road.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Melbourne_Tram_3510_on_St_Kilda_Road.jpg", "srcset": "img/tram-3510-st-kilda-road-800.webp 800w, img/tram-3510-st-kilda-road-1600.webp 1600w", "url": "img/tram-3510-st-kilda-road-1600.webp"}, "priority": 7, "risk": "green", "section": "community", "slug": "indian-consular-services-melbourne", "sources": [{"checked": "2026-11-08", "title": "VFS Global media release: India consular services launch in Australia (24 July 2026)", "url": "https://www.vfsglobal.com/en/PDF/media-releases/2026/Media-release_India-consular-services-launch-in-Australia_Jul-2026.pdf"}, {"checked": "2026-11-08", "title": "Business Standard / Bloomberg: India restarts visa, passport services in Australia after 23-day halt (23 July 2026)", "url": "https://www.business-standard.com/immigration/india-restarts-visa-passport-services-in-australia-after-23-day-halt-126072300777_1.html"}, {"checked": "2026-11-08", "title": "SBS Hindi: Indian passport and consular services get costlier as VFS fee rises to $115 (23 July 2026)", "url": "https://www.sbs.com.au/language/hindi/en/podcast-episode/indian-passport-and-consular-services-in-australia-get-costlier-as-vfs-fee-soars-to-115/ov3ml4nfr"}, {"checked": "2026-11-08", "title": "SBS Hindi: New, larger VFS centre for Victoria (19 May 2026)", "url": "https://www.sbs.com.au/language/hindi/en/podcast-episode/major-upgrade-for-victorias-growing-indian-diaspora-as-a-new-larger-vfs-centre-to-open-soon/ezqtcs9xd"}, {"checked": "2026-11-08", "title": "High Commission of India, Canberra: Modes of payment and fee schedule (VFS charges are extra)", "url": "https://hcicanberra.gov.in/page/modes-of-payment-and-fee-schedule"}], "status": "published", "type": "guide", "updated": "2026-11-08T12:32:11Z"}, {"approvedAt": "2026-11-08T20:02:36Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["The federal government has set the 2027 National Planning Level for new international student commencements at 295,000, unchanged from 2026, Study Australia announced in July.", "The government says the planning level is not a cap on student numbers. Student visa applications are processed as a priority until a student's chosen provider reaches 80 per cent of its allocation. Applications after that point are still accepted but processed more slowly.", "No active provider will receive a lower allocation in 2027 than in 2026, and TAFE students remain exempt from the planning level, The PIE News reported.", {"h": "Visa costs"}, "The student visa (subclass 500) application fee starts at A$2,500, according to the Department of Home Affairs. A lower fee applies to some applicants, including those enrolling in standalone English language (ELICOS) or non-award courses.", {"h": "What ministers said"}, "Education Minister Jason Clare said, as reported by The PIE News: \"International education is an incredibly important export industry for Australia, but we need to manage it sustainably.\"", {"h": "Melbourne's education links with India"}, "Melbourne's Victoria University received approval in July to open a campus in Gurugram, near Delhi. The university said the campus would teach through its block model, with students studying one subject at a time in four-week blocks, and that it was scheduled to open in August 2026.", {"note": "This is general information, not migration advice. For advice about your circumstances, speak to a registered migration agent or check the Department of Home Affairs website."}], "dek": "The federal government has kept the planning level for new international students at 295,000 for 2027, unchanged from this year.", "headline": "International student numbers for 2027: what Indian students in Melbourne need to know"}, "figure": {"en": "new international students planned for 2027", "value": "295,000"}, "image": {"addedAt": "2026-11-08T11:22:03Z", "addedBy": "claude", "alt": {"en": "Victoria University buildings at the Footscray Park campus, seen across a wide green lawn with parked cars below."}, "caption": {"en": "Victoria University's Footscray Park campus; the university has approval to open a campus in Gurugram, India."}, "credit": "Melburnian", "file": "images/victoria-university-footscray-park.jpg", "licence": "CC BY 2.5", "og": "og/victoria-university-footscray-park.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Victoria_University_Footscray_Park.jpg", "srcset": "img/victoria-university-footscray-park-800.webp 800w, img/victoria-university-footscray-park-1600.webp 1600w", "url": "img/victoria-university-footscray-park-1600.webp"}, "priority": 7, "risk": "amber", "section": "education", "slug": "international-students-2027-settings", "sources": [{"checked": "2026-11-08", "title": "Study Australia: Australia confirms international education settings for 2027 (15 July 2026)", "url": "https://www.studyaustralia.gov.au/en/tools-and-resources/news/australia-confirms-international-education-settings-for-2027"}, {"checked": "2026-11-08", "title": "The PIE News: Australia maintains 2027 international student planning level at 295,000 (3 July 2026)", "url": "https://thepienews.com/australia-maintains-2027-international-student-planning-level-at-295000/"}, {"checked": "2026-11-08", "title": "Victoria University: Victoria University gains approval for India campus (9 July 2026)", "url": "https://www.vu.edu.au/about-vu/news-events/news/victoria-university-gains-approval-for-india-campus"}, {"checked": "2026-11-09", "title": "Department of Home Affairs: Subclass 500 Student visa", "url": "https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/student-500"}], "status": "published", "type": "explainer", "updated": "2026-11-08T20:02:36Z"}, {"approvedAt": "2026-11-09T22:54:23.191Z", "approvedBy": "u_N2husJ7AcYn9nq725rcg0Q", "byline": "The Melbourne Indian newsroom", "corrections": [], "created": "2026-11-09T22:40:00Z", "date": "2026-11-10", "en": {"body": ["Former Test opener Usman Khawaja has reopened one of Australian cricket's most painful episodes, writing in his new book, Sabr, that players and staff on the 2018 tour of South Africa knew about the ball-tampering plan that led to bans for three players.", "David Warner, one of the three, backed Khawaja in a video on Instagram on Monday, calling his account \"100 per cent accurate\", the ABC reported. Warner also criticised Cricket Australia's 2018 investigation, saying Khawaja had not been interviewed and the process had been rushed.", "Cricket Australia has consistently denied that all players and staff knew about the plan, according to the ABC. It is not yet known whether it will take any further action. Steve Smith and Cameron Bancroft, the other two players banned in 2018, had not commented publicly at the time of writing.", {"h": "The claims about Victoria"}, "Khawaja also writes about the Sheffield Shield. As reported by the ABC, he says Victorian teams of the 2000s and 2010s were probably the best at altering the ball, because the MCG pitch was flat and reverse swing and spin were the way to win there. He writes that he never tampered with a ball himself but knew what was going on and regarded himself as complicit.", "Victoria and Australia fast bowler Scott Boland, speaking in Melbourne on Monday, said he had not seen anything untoward and that reverse swing had largely gone out of the game since 2018.", {"h": "Why it matters this summer"}, "The row lands weeks before Australia's home Tests against New Zealand, and ahead of the tour of India from January. Khawaja's book is released on Tuesday 10 November.", {"note": "The claims in this story are Usman Khawaja's, from his book as reported by the ABC. They have not been tested, and others named in the wider debate dispute them."}], "dek": "Usman Khawaja writes that the whole touring party knew about the 2018 plan and that Victoria were the Shield's best at the 'dark arts'. Scott Boland says he has seen nothing untoward.", "headline": "Khawaja's book reopens Cape Town ball-tampering row, and Warner says his account is accurate"}, "featured": false, "figure": {"en": "years since the Cape Town ball-tampering scandal", "value": "8"}, "image": {"addedAt": "2026-11-09T23:10:00Z", "addedBy": "claude", "alt": {"en": "A shiny red Kookaburra cricket ball with a white stitched seam, resting on grass."}, "caption": {"en": "A red Kookaburra ball of the kind used in Test and Sheffield Shield cricket. The photo is illustrative."}, "credit": "SpesBona", "file": "images/kookaburra-red-test-cricket-ball-02.jpg", "licence": "CC BY-SA 4.0", "og": "og/kookaburra-red-test-cricket-ball-02.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Kookaburra_red_test_cricket_ball_02.jpg", "srcset": "img/kookaburra-red-test-cricket-ball-02-800.webp 800w, img/kookaburra-red-test-cricket-ball-02-1280.webp 1280w", "url": "img/kookaburra-red-test-cricket-ball-02-1280.webp"}, "priority": 7, "risk": "amber", "section": "sport", "slug": "khawaja-book-ball-tampering-claims-victoria", "sources": [{"checked": "2026-11-10", "title": "ABC News: Scott Boland rejects Usman Khawaja's claim Victoria was best at ball tampering in Sheffield Shield (9 Nov 2026)", "url": "https://www.abc.net.au/news/2026-11-09/usman-khawaja-says-victoria-best-at-ball-tampering/107362336"}, {"checked": "2026-11-10", "title": "ABC News: David Warner backs Usman Khawaja's ball-tampering claims, slams 'botched' Cricket Australia investigation (9 Nov 2026)", "url": "https://www.abc.net.au/news/2026-11-09/cricket-warner-backs-khawaja-ball-tampering-claims-slams-probe/107365778"}], "status": "published", "type": "news", "updated": "2026-11-09T23:10:00Z"}, {"approvedAt": "2026-11-09T20:06:00Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "created": "2026-11-09T12:30:00Z", "date": "2026-11-10", "en": {"body": ["Marnus Labuschagne will not be considered for Australia's four-Test series against New Zealand this summer, chair of selectors George Bailey said on Monday.", "\"This gives him a little bit of space and clears up a bit of conjecture,\" Bailey said. Asked whether Labuschagne could return for the tours of India and England, he said: \"Still possible, absolutely.\"", "The squad for the first Test, which starts in Perth on 9 December, will be named after round four of the Sheffield Shield. Labuschagne will captain Queensland in the Shield.", {"h": "The numbers"}, {"dl": [["South Africa tour", "21.83 average from six innings"], ["Last Test century", "December 2022"], ["Innings since", "49, the longest drought for an Australian top-four batter (AAP)"], ["First 30 Tests", "average 60.82"], ["Last 38 Tests", "average 28.43"]]}, "Australia lost the final Test in Cape Town by 176 runs after being bowled out for 111.", "\"He's always been an incredible performer at first-class level,\" Bailey said. Not everyone agrees with the call: former Test opener Simon Katich told SEN the selectors had \"got this horribly wrong\".", {"h": "Why it matters for India fans"}, "India host Australia in a Border-Gavaskar series from 21 January, which leaves Labuschagne a Shield season to earn his place back. Before that, New Zealand play the Boxing Day Test at the MCG.", "See our Border-Gavaskar Trophy 2027 schedule and our guide to the cricket summer in Melbourne for dates and tickets."], "dek": "Australia's selectors say the 49-innings century drought calls for 'a little bit of space'. A return for the India tour in January is 'still possible, absolutely'.", "headline": "Labuschagne left out for New Zealand Tests, but selectors keep the door open for India"}, "figure": {"en": "Test innings without a century", "value": "49"}, "image": {"addedAt": "2026-11-09T19:58:00Z", "addedBy": "claude", "alt": {"en": "The bronze-clad oval exterior of Perth Stadium beneath a blue sky with wispy clouds."}, "caption": {"en": "Perth Stadium, which hosts the first Test against New Zealand from 9 December."}, "credit": "Samuel Wiki", "file": "images/perth-stadium-december-2017-01.jpg", "licence": "CC0 (public domain)", "og": "og/perth-stadium-december-2017-01.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Perth_Stadium,_December_2017_01.jpg", "srcset": "img/perth-stadium-december-2017-01-800.webp 800w, img/perth-stadium-december-2017-01-1280.webp 1280w", "url": "img/perth-stadium-december-2017-01-1280.webp"}, "priority": 7, "risk": "green", "section": "sport", "slug": "labuschagne-dropped-new-zealand-tests", "sources": [{"checked": "2026-11-09", "title": "ABC News: Marnus Labuschagne axed from Australian Test squad (9 Nov 2026)", "url": "https://www.abc.net.au/news/2026-11-09/cricket-marnus-labuschagne-axed-from-australian-test-squad/107363356"}, {"checked": "2026-11-09", "title": "Canberra Times (AAP): Labuschagne will go, but can he return to Test team? (9 Nov 2026)", "url": "https://www.canberratimes.com.au/story/9383553/labuschagne-will-go-but-can-he-return-to-test-team/"}], "status": "published", "type": "news", "updated": "2026-11-09T20:06:00Z"}, {"approvedAt": "2026-11-08T20:02:36Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["The City of Melbourne's 2026–27 budget includes more than $1.2 million to keep developing a Little India precinct in Docklands. The council's aim is a recognisable cultural destination alongside Chinatown and Koreatown, built through infrastructure, events and creative projects.", "The funding was first flagged in the council's draft budget in March. Councillor Philip Le Liu said at the time, Melbourning reported: \"As Australia's most multicultural city, we're taking big steps to make Little India a reality.\"", {"h": "What happens next"}, "In its response to budget consultation, the council said it would focus on \"testing future ideas for Little India\". It has committed to engaging extensively with Docklands residents and Indian communities, and to running trial experiences so people can try ideas and help shape future plans.", "More than 550 people contributed to the council's wider budget consultation, which ran from 31 March to 28 April.", "No opening date has been announced. Lord Mayor Nick Reece discussed the project with SBS Hindi in May, and SBS reported that he had invited Indian Prime Minister Narendra Modi to an official opening.", {"h": "Residents' concerns"}, "Local newspaper Docklands News reported that the council's consultation summary found a minority of submissions supported a Little India in Docklands, while most urged caution about a single-theme precinct. Concerns included top-down delivery and money being diverted from the suburb's other needs, with many residents pointing to greening, shade, wind protection and better public spaces.", "The council has kept the $1.2 million commitment but is taking a staged approach that starts with trial activations, the paper reported. Council officers have said no exact location has been chosen, and the council has committed to finalising a Docklands public realm improvements plan.", "At a budget hearing on 12 May, Federation of Indian Associations of Victoria president Vasan Srinivasan called the funding a \"positive and historic beginning\", but said a world-class precinct would need between $5 million and $10 million, Docklands News reported.", {"h": "The backlash"}, "The proposal has also drawn what The Australia Today described in April as \"negative and, at times, racist commentary\". Mr Srinivasan launched a petition in support of the precinct, the outlet reported.", "Victoria's strengthened anti-vilification laws, which added new civil protections from 15 April 2026, apply to public conduct online as well as offline.", {"note": "We will report consultation dates for Little India as soon as the council announces them."}], "dek": "The City of Melbourne has set aside more than $1.2 million to develop a Little India precinct in Docklands, but no site has been chosen and many local residents have urged caution.", "headline": "Little India in Docklands: where Melbourne's precinct plan stands"}, "figure": {"en": "for Little India in Docklands", "value": "$1.2m"}, "image": {"addedAt": "2026-11-08T11:22:03Z", "addedBy": "claude", "alt": {"en": "Panoramic view across the still water of Victoria Harbour in Docklands towards the stadium, apartment towers and Melbourne's city skyline."}, "caption": {"en": "Docklands, where the City of Melbourne is developing a Little India precinct, seen from Waterfront City in 2006."}, "credit": "jjron", "file": "images/docklands-from-waterfront-city.jpg", "licence": "CC BY-SA 3.0", "og": "og/docklands-from-waterfront-city.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Melbourne_from_Waterfront_City,_Docklands_Pano,_20.07.06.jpg", "srcset": "img/docklands-from-waterfront-city-800.webp 800w, img/docklands-from-waterfront-city-1600.webp 1600w", "url": "img/docklands-from-waterfront-city-1600.webp"}, "priority": 6, "risk": "amber", "section": "community", "slug": "little-india-docklands", "sources": [{"checked": "2026-11-08", "title": "Melbourning: City of Melbourne's draft budget includes plans to light up Melbourne and expand cultural precincts (31 March 2026)", "url": "https://www.melbourning.com.au/2026/03/31/city-of-melbournes-draft-budget-includes-plans-to-light-up-melbourne-and-expand-cultural-precincts/"}, {"checked": "2026-11-08", "title": "Participate Melbourne: Budget 2026–27, what we heard", "url": "https://participate.melbourne.vic.gov.au/budget-2026-27/what-we-heard"}, {"checked": "2026-11-08", "title": "SBS Hindi: Melbourne's Little India project accelerates (1 May 2026)", "url": "https://www.sbs.com.au/language/hindi/en/podcast-episode/melbournes-little-india-project-accelerates-lord-mayor-invites-pm-modi-for-the-official-opening/a0ly5uiuy"}, {"checked": "2026-11-08", "title": "The Australia Today: Premier Carroll reaches out to Indian Victorians (8 September 2026)", "url": "https://www.theaustraliatoday.com.au/we-respect-you-premier-carroll-reaches-out-to-indian-victorians-amid-rising-anti-indian-rhetoric/"}, {"checked": "2026-11-08", "title": "Victorian Government: New protections against vilification", "url": "https://www.vic.gov.au/new-protections-against-vilification"}, {"checked": "2026-11-09", "title": "Docklands News: Little India precinct debate puts Docklands' future in sharper focus", "url": "https://www.docklandsnews.com.au/little-india-precinct-debate-puts-docklands-future-in-sharper-focus"}, {"checked": "2026-11-09", "title": "The Australia Today: Community urged to stand united against racist backlash as Melbourne unveils $1.2m Little India precinct plan (24 April 2026)", "url": "https://www.theaustraliatoday.com.au/?p=117404"}], "status": "published", "type": "explainer", "updated": "2026-11-08T20:02:36Z"}, {"approvedAt": "2026-11-09T22:55:11.204Z", "approvedBy": "u_N2husJ7AcYn9nq725rcg0Q", "byline": "The Melbourne Indian newsroom", "corrections": [], "created": "2026-11-09T22:40:00Z", "date": "2026-11-10", "en": {"body": ["Applications are open for the 2026-27 round of the Australian Government's Maitri Grants and Maitri Fellowships, which fund projects that bring Australians and Indians together.", "\"Today, I am pleased to announce that applications are now open for the 2026-27 Maitri Grants and Fellowships programs,\" Foreign Minister Penny Wong said in a statement carried by the ANI news agency.", {"h": "What is on offer"}, {"dl": [["Maitri Grants", "Funding for projects that build exchange and collaboration between Australian and Indian business, cultural, education, research and sporting communities."], ["Maitri Fellowships", "Funding for Australian organisations to host an Australian or Indian fellow researching geostrategic or geoeconomic policy questions."], ["Priority areas", "Clean energy, education, advanced technology, agribusiness and tourism."]]}, "The programs are run by the Centre for Australia-India Relations, part of the Department of Foreign Affairs and Trade. According to ANI, they have supported more than 110 projects since 2023.", {"h": "How to apply"}, "Funding amounts, eligibility rules and the closing date are set out in the official guidelines from the Centre for Australia-India Relations. Check those before you start an application.", {"note": "We will add the closing date and application link to this story once we have confirmed them from the official guidelines."}], "dek": "Community groups, businesses, universities and sporting bodies with an India link can apply for funding for exchanges and joint projects.", "headline": "Australia-India Maitri grants and fellowships open for 2026-27"}, "featured": false, "figure": {"en": "projects funded by the Maitri programs since 2023", "value": "110+"}, "image": {"addedAt": "2026-11-09T23:10:00Z", "addedBy": "claude", "alt": {"en": "A white building with arched colonnades and the Indian flag flying, behind a sign reading 'The High Commission of India'."}, "caption": {"en": "The High Commission of India in Canberra. File photo."}, "credit": "Nomisztif", "file": "images/high-commission-of-india-in-canberra.jpg", "licence": "CC BY-SA 4.0", "og": "og/high-commission-of-india-in-canberra.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:High_Commission_of_India_in_Canberra.jpg", "srcset": "img/high-commission-of-india-in-canberra-800.webp 800w, img/high-commission-of-india-in-canberra-1280.webp 1280w", "url": "img/high-commission-of-india-in-canberra-1280.webp"}, "priority": 5, "risk": "amber", "section": "india", "slug": "maitri-grants-fellowships-2026-27-open", "sources": [{"checked": "2026-11-10", "title": "Devdiscourse (ANI): Australia opens applications for 2026-27 Maitri Grants and Fellowships to deepen ties with India (6 Nov 2026)", "url": "https://www.devdiscourse.com/article/international/4002531-australia-opens-applications-for-2026-27-maitri-grants-and-fellowships-to-deepen-ties-with-india"}, {"checked": "2026-11-10", "title": "The Indian Sun: Australia opens new Maitri grants to strengthen ties with India (8 Nov 2026)", "url": "https://www.theindiansun.com.au/2026/11/08/australia-opens-new-maitri-grants-to-strengthen-ties-with-india/"}, {"checked": "2026-11-10", "title": "Australian High Commission, New Delhi: Centre for Australia-India Relations", "url": "https://india.embassy.gov.au/ndli/CentreforAustraliaIndiaRelations.html"}], "status": "published", "type": "news", "updated": "2026-11-09T23:10:00Z"}, {"byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["Community associations, temples, gurdwaras, cultural groups and trader associations can apply for Victorian Government funding, but most rounds open once a year and close within a few weeks. All three of the main 2026 programs below have now closed.", {"h": "Multicultural Festivals and Events Program 2026–27"}, "Grants ranged from $5,000 for smaller community events to $50,000 for events of any size, with a further $1 million set aside for events in rural and regional Victoria. Events had to be free, inclusive, accessible and culturally safe. Applications closed on 17 April 2026.", {"h": "Multicultural Capacity Building Program"}, "This $5 million program had three streams offering up to $10,000, $100,000 or $400,000 for skills, partnerships and leadership, and for day-to-day costs such as IT systems and business planning. Organisations from new and emerging communities, and from rural and regional areas, were a priority. Applications closed on 19 February 2026.", {"h": "Multicultural Business Skills Fund"}, "This fund offered $5,000 grants to not-for-profit business associations, such as trader groups and chambers of commerce, to run advice, training or mentoring for multicultural small business owners and their staff. Each project needed at least 10 participants. Applications closed at 4pm on 28 September 2026, and funded projects must be finished by 26 February 2027.", {"h": "Getting ready for the next round"}, {"ul": ["Make sure your organisation has a current ABN and is registered with the right regulator. The business skills fund required both.", "Keep a short description of your organisation, its members and its past events ready to adapt.", "Watch the Victorian Government's multicultural grants pages from early in the year. In 2026 the capacity building and festivals rounds were announced in January and March."]}, {"note": "Programs for 2027 have not been announced. Rules and amounts may change."}], "dek": "Three Victorian Government funding rounds for multicultural groups and businesses have closed. Here is what they offered, so your organisation can plan ahead.", "headline": "Missed this year's multicultural grants? What ran in 2026, and how to be ready next time"}, "figure": {"en": "smallest grant on offer in 2026", "hi": "2026 में सबसे छोटा अनुदान", "pa": "2026 ਵਿੱਚ ਸਭ ਤੋਂ ਛੋਟੀ ਗ੍ਰਾਂਟ", "value": "$5k"}, "hi": {"body": ["सामुदायिक संघ, मंदिर, गुरुद्वारे, सांस्कृतिक समूह और व्यापारी संघ विक्टोरियाई सरकार से फ़ंडिंग के लिए आवेदन कर सकते हैं, लेकिन ज़्यादातर दौर साल में एक बार खुलते हैं और कुछ ही हफ़्तों में बंद हो जाते हैं। नीचे दिए गए 2026 के तीनों मुख्य कार्यक्रम अब बंद हो चुके हैं।", {"h": "बहुसांस्कृतिक उत्सव और कार्यक्रम योजना 2026–27"}, "छोटे सामुदायिक कार्यक्रमों के लिए $5,000 से लेकर किसी भी आकार के कार्यक्रम के लिए $50,000 तक के अनुदान थे, और ग्रामीण व क्षेत्रीय विक्टोरिया के कार्यक्रमों के लिए अलग से $1 मिलियन रखे गए। कार्यक्रमों का निःशुल्क, सबके लिए खुला, सुलभ और सांस्कृतिक रूप से सुरक्षित होना ज़रूरी था। आवेदन 17 अप्रैल 2026 को बंद हुए।", {"h": "बहुसांस्कृतिक क्षमता निर्माण कार्यक्रम"}, "$5 मिलियन के इस कार्यक्रम में तीन श्रेणियाँ थीं, जिनमें कौशल, साझेदारी और नेतृत्व के लिए, और आईटी सिस्टम व व्यावसायिक योजना जैसे रोज़मर्रा के ख़र्चों के लिए $10,000, $100,000 या $400,000 तक मिल सकते थे। नए और उभरते समुदायों तथा ग्रामीण व क्षेत्रीय इलाक़ों के संगठनों को प्राथमिकता दी गई। आवेदन 19 फ़रवरी 2026 को बंद हुए।", {"h": "बहुसांस्कृतिक व्यवसाय कौशल कोष"}, "इस कोष में गैर-लाभकारी व्यापार संघों, जैसे ट्रेडर समूहों और चैंबर ऑफ़ कॉमर्स, को $5,000 के अनुदान दिए गए, ताकि वे बहुसांस्कृतिक छोटे व्यवसायों के मालिकों और कर्मचारियों के लिए सलाह, प्रशिक्षण या मार्गदर्शन दे सकें। हर परियोजना में कम से कम 10 प्रतिभागी ज़रूरी थे। आवेदन 28 सितंबर 2026 को शाम 4 बजे बंद हुए, और स्वीकृत परियोजनाएँ 26 फ़रवरी 2027 तक पूरी करनी होंगी।", {"h": "अगले दौर की तैयारी"}, {"ul": ["सुनिश्चित करें कि आपके संगठन के पास वैध ABN हो और वह सही नियामक संस्था के पास पंजीकृत हो। व्यवसाय कौशल कोष के लिए दोनों ज़रूरी थे।", "अपने संगठन, उसके सदस्यों और पिछले कार्यक्रमों का छोटा विवरण तैयार रखें, जिसे ज़रूरत के हिसाब से बदला जा सके।", "साल की शुरुआत से ही विक्टोरियाई सरकार के बहुसांस्कृतिक अनुदान पृष्ठों पर नज़र रखें। 2026 में क्षमता निर्माण और उत्सव वाले दौर जनवरी और मार्च में घोषित हुए थे।"]}, {"note": "2027 के कार्यक्रमों की घोषणा अभी नहीं हुई है। नियम और राशि बदल सकती हैं।"}], "dek": "बहुसांस्कृतिक संगठनों और व्यवसायों के लिए विक्टोरियाई सरकार के तीन फ़ंडिंग दौर बंद हो चुके हैं। जानिए उनमें क्या था, ताकि आपका संगठन पहले से योजना बना सके।", "headline": "इस साल के बहुसांस्कृतिक अनुदान छूट गए? 2026 में क्या मिला और अगली बार कैसे तैयार रहें"}, "image": {"addedAt": "2026-11-08T11:22:03Z", "addedBy": "claude", "alt": {"en": "The paved plaza and terraced steps of Federation Square in Melbourne, with gum trees, flags and angular buildings under a blue sky."}, "caption": {"en": "Federation Square in central Melbourne; the Victorian Government's multicultural programs fund free community festivals and events."}, "credit": "DXR", "file": "images/fed-square-north-view.jpg", "licence": "CC BY-SA 4.0", "og": "og/fed-square-north-view.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Fed_Square,_Melbourne,_north_view_20230219_1.jpg", "srcset": "img/fed-square-north-view-800.webp 800w, img/fed-square-north-view-1600.webp 1600w", "url": "img/fed-square-north-view-1600.webp"}, "pa": {"body": ["ਭਾਈਚਾਰਕ ਸਭਾਵਾਂ, ਮੰਦਰ, ਗੁਰਦੁਆਰੇ, ਸੱਭਿਆਚਾਰਕ ਗਰੁੱਪ ਅਤੇ ਵਪਾਰੀ ਸੰਘ ਵਿਕਟੋਰੀਆ ਸਰਕਾਰ ਤੋਂ ਫ਼ੰਡਿੰਗ ਲਈ ਅਰਜ਼ੀ ਦੇ ਸਕਦੇ ਹਨ, ਪਰ ਬਹੁਤੇ ਗੇੜ ਸਾਲ ਵਿੱਚ ਇੱਕ ਵਾਰ ਖੁੱਲ੍ਹਦੇ ਹਨ ਅਤੇ ਕੁਝ ਹਫ਼ਤਿਆਂ ਵਿੱਚ ਬੰਦ ਹੋ ਜਾਂਦੇ ਹਨ। ਹੇਠਾਂ ਦਿੱਤੇ 2026 ਦੇ ਤਿੰਨੇ ਮੁੱਖ ਪ੍ਰੋਗਰਾਮ ਹੁਣ ਬੰਦ ਹੋ ਚੁੱਕੇ ਹਨ।", {"h": "ਬਹੁ-ਸੱਭਿਆਚਾਰਕ ਤਿਉਹਾਰ ਅਤੇ ਸਮਾਗਮ ਪ੍ਰੋਗਰਾਮ 2026–27"}, "ਛੋਟੇ ਭਾਈਚਾਰਕ ਸਮਾਗਮਾਂ ਲਈ $5,000 ਤੋਂ ਲੈ ਕੇ ਕਿਸੇ ਵੀ ਆਕਾਰ ਦੇ ਸਮਾਗਮ ਲਈ $50,000 ਤੱਕ ਦੀਆਂ ਗ੍ਰਾਂਟਾਂ ਸਨ, ਅਤੇ ਪੇਂਡੂ ਤੇ ਖੇਤਰੀ ਵਿਕਟੋਰੀਆ ਦੇ ਸਮਾਗਮਾਂ ਲਈ ਵੱਖਰੇ ਤੌਰ 'ਤੇ $1 ਮਿਲੀਅਨ ਰੱਖੇ ਗਏ। ਸਮਾਗਮਾਂ ਦਾ ਮੁਫ਼ਤ, ਸਾਰਿਆਂ ਲਈ ਖੁੱਲ੍ਹਾ, ਪਹੁੰਚਯੋਗ ਅਤੇ ਸੱਭਿਆਚਾਰਕ ਤੌਰ 'ਤੇ ਸੁਰੱਖਿਅਤ ਹੋਣਾ ਜ਼ਰੂਰੀ ਸੀ। ਅਰਜ਼ੀਆਂ 17 ਅਪ੍ਰੈਲ 2026 ਨੂੰ ਬੰਦ ਹੋਈਆਂ।", {"h": "ਬਹੁ-ਸੱਭਿਆਚਾਰਕ ਸਮਰੱਥਾ ਨਿਰਮਾਣ ਪ੍ਰੋਗਰਾਮ"}, "$5 ਮਿਲੀਅਨ ਦੇ ਇਸ ਪ੍ਰੋਗਰਾਮ ਵਿੱਚ ਤਿੰਨ ਸ਼੍ਰੇਣੀਆਂ ਸਨ, ਜਿਨ੍ਹਾਂ ਵਿੱਚ ਹੁਨਰ, ਭਾਈਵਾਲੀਆਂ ਅਤੇ ਲੀਡਰਸ਼ਿਪ ਲਈ, ਅਤੇ ਆਈਟੀ ਸਿਸਟਮ ਤੇ ਕਾਰੋਬਾਰੀ ਯੋਜਨਾਬੰਦੀ ਵਰਗੇ ਰੋਜ਼ਾਨਾ ਖ਼ਰਚਿਆਂ ਲਈ $10,000, $100,000 ਜਾਂ $400,000 ਤੱਕ ਮਿਲ ਸਕਦੇ ਸਨ। ਨਵੇਂ ਅਤੇ ਉੱਭਰ ਰਹੇ ਭਾਈਚਾਰਿਆਂ ਅਤੇ ਪੇਂਡੂ ਤੇ ਖੇਤਰੀ ਇਲਾਕਿਆਂ ਦੀਆਂ ਸੰਸਥਾਵਾਂ ਨੂੰ ਪਹਿਲ ਦਿੱਤੀ ਗਈ। ਅਰਜ਼ੀਆਂ 19 ਫ਼ਰਵਰੀ 2026 ਨੂੰ ਬੰਦ ਹੋਈਆਂ।", {"h": "ਬਹੁ-ਸੱਭਿਆਚਾਰਕ ਕਾਰੋਬਾਰੀ ਹੁਨਰ ਫ਼ੰਡ"}, "ਇਸ ਫ਼ੰਡ ਵਿੱਚ ਗੈਰ-ਮੁਨਾਫ਼ਾ ਵਪਾਰਕ ਸੰਘਾਂ, ਜਿਵੇਂ ਵਪਾਰੀ ਗਰੁੱਪਾਂ ਅਤੇ ਚੈਂਬਰ ਆਫ਼ ਕਾਮਰਸ, ਨੂੰ $5,000 ਦੀਆਂ ਗ੍ਰਾਂਟਾਂ ਦਿੱਤੀਆਂ ਗਈਆਂ, ਤਾਂ ਜੋ ਉਹ ਬਹੁ-ਸੱਭਿਆਚਾਰਕ ਛੋਟੇ ਕਾਰੋਬਾਰਾਂ ਦੇ ਮਾਲਕਾਂ ਅਤੇ ਮੁਲਾਜ਼ਮਾਂ ਲਈ ਸਲਾਹ, ਸਿਖਲਾਈ ਜਾਂ ਰਹਿਨੁਮਾਈ ਦੇ ਸਕਣ। ਹਰ ਪ੍ਰੋਜੈਕਟ ਵਿੱਚ ਘੱਟੋ-ਘੱਟ 10 ਭਾਗੀਦਾਰ ਜ਼ਰੂਰੀ ਸਨ। ਅਰਜ਼ੀਆਂ 28 ਸਤੰਬਰ 2026 ਨੂੰ ਸ਼ਾਮ 4 ਵਜੇ ਬੰਦ ਹੋਈਆਂ, ਅਤੇ ਮਨਜ਼ੂਰ ਪ੍ਰੋਜੈਕਟ 26 ਫ਼ਰਵਰੀ 2027 ਤੱਕ ਪੂਰੇ ਕਰਨੇ ਹੋਣਗੇ।", {"h": "ਅਗਲੇ ਗੇੜ ਦੀ ਤਿਆਰੀ"}, {"ul": ["ਯਕੀਨੀ ਬਣਾਓ ਕਿ ਤੁਹਾਡੀ ਸੰਸਥਾ ਕੋਲ ਚਾਲੂ ABN ਹੋਵੇ ਅਤੇ ਉਹ ਸਹੀ ਰੈਗੂਲੇਟਰ ਕੋਲ ਰਜਿਸਟਰਡ ਹੋਵੇ। ਕਾਰੋਬਾਰੀ ਹੁਨਰ ਫ਼ੰਡ ਲਈ ਦੋਵੇਂ ਜ਼ਰੂਰੀ ਸਨ।", "ਆਪਣੀ ਸੰਸਥਾ, ਇਸਦੇ ਮੈਂਬਰਾਂ ਅਤੇ ਪਿਛਲੇ ਸਮਾਗਮਾਂ ਦਾ ਛੋਟਾ ਵੇਰਵਾ ਤਿਆਰ ਰੱਖੋ, ਜਿਸਨੂੰ ਲੋੜ ਮੁਤਾਬਕ ਬਦਲਿਆ ਜਾ ਸਕੇ।", "ਸਾਲ ਦੇ ਸ਼ੁਰੂ ਤੋਂ ਹੀ ਵਿਕਟੋਰੀਆ ਸਰਕਾਰ ਦੇ ਬਹੁ-ਸੱਭਿਆਚਾਰਕ ਗ੍ਰਾਂਟਾਂ ਵਾਲੇ ਪੰਨਿਆਂ 'ਤੇ ਨਜ਼ਰ ਰੱਖੋ। 2026 ਵਿੱਚ ਸਮਰੱਥਾ ਨਿਰਮਾਣ ਅਤੇ ਤਿਉਹਾਰਾਂ ਵਾਲੇ ਗੇੜਾਂ ਦਾ ਐਲਾਨ ਜਨਵਰੀ ਅਤੇ ਮਾਰਚ ਵਿੱਚ ਹੋਇਆ ਸੀ।"]}, {"note": "2027 ਦੇ ਪ੍ਰੋਗਰਾਮਾਂ ਦਾ ਐਲਾਨ ਅਜੇ ਨਹੀਂ ਹੋਇਆ। ਨਿਯਮ ਅਤੇ ਰਕਮਾਂ ਬਦਲ ਸਕਦੀਆਂ ਹਨ।"}], "dek": "ਬਹੁ-ਸੱਭਿਆਚਾਰਕ ਸੰਸਥਾਵਾਂ ਅਤੇ ਕਾਰੋਬਾਰਾਂ ਲਈ ਵਿਕਟੋਰੀਆ ਸਰਕਾਰ ਦੇ ਤਿੰਨ ਫ਼ੰਡਿੰਗ ਗੇੜ ਬੰਦ ਹੋ ਚੁੱਕੇ ਹਨ। ਜਾਣੋ ਉਨ੍ਹਾਂ ਵਿੱਚ ਕੀ ਸੀ, ਤਾਂ ਜੋ ਤੁਹਾਡੀ ਸੰਸਥਾ ਪਹਿਲਾਂ ਤੋਂ ਯੋਜਨਾ ਬਣਾ ਸਕੇ।", "headline": "ਇਸ ਸਾਲ ਦੀਆਂ ਬਹੁ-ਸੱਭਿਆਚਾਰਕ ਗ੍ਰਾਂਟਾਂ ਖੁੰਝ ਗਈਆਂ? 2026 ਵਿੱਚ ਕੀ ਮਿਲਿਆ ਅਤੇ ਅਗਲੀ ਵਾਰ ਕਿਵੇਂ ਤਿਆਰ ਰਹੀਏ"}, "priority": 5, "risk": "green", "section": "business", "slug": "multicultural-grants-2026", "sources": [{"checked": "2026-11-08", "title": "Premier of Victoria: Keeping Victoria's multicultural celebrations affordable (19 March 2026)", "url": "https://www.premier.vic.gov.au/keeping-victorias-multicultural-celebrations-affordable"}, {"checked": "2026-11-08", "title": "Premier of Victoria: New funding for grassroots multicultural groups (15 January 2026)", "url": "https://www.premier.vic.gov.au/new-funding-grassroots-multicultural-groups"}, {"checked": "2026-11-08", "title": "Business Victoria: Multicultural Business Skills Fund grant program", "url": "https://business.vic.gov.au/grants-and-programs/multicultural-business-skills-fund-grant-program"}], "status": "published", "translations": {"hi": "reviewed-by-claude", "pa": "reviewed-by-claude"}, "type": "explainer", "updated": "2026-11-08T11:22:03Z"}, {"approvedAt": "2026-11-09T20:15:00Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "created": "2026-11-09T12:20:00Z", "date": "2026-11-10", "en": {"body": ["One of Australia's biggest data centre companies has put the brakes on its growth after a fight with residents in Melbourne's inner west left its flagship West Footscray site short of power.", "NEXTDC said on Monday it would pause all projects that do not have a customer contract, Reuters reported. Chief executive Craig Scroggie told a UBS investor conference the company \"certainly didn't expect to be in the position we're in today\", and linked the problem to public unease about artificial intelligence and data centres, which he described as an issue of \"social license\".", "\"That work can't restart until we clearly communicate that we've solved this problem,\" he said, adding that winning community support for the Melbourne site is now the top priority.", {"h": "What went wrong in West Footscray"}, "NEXTDC's M3 data centre sits about 10 kilometres west of the CBD and is planned to grow to 225 megawatts. To get more power, it needs electricity distributor Jemena to upgrade the local 66,000-volt network.", "In September, Jemena stopped installing 15-metre power poles in neighbouring Yarraville after residents protested, with some leaving cars and bins out to block work crews, the ABC reported. Jemena cited community and stakeholder opposition, safety concerns and limited site access, and the local council has not given consent as road authority while consultation continues, according to NEXTDC. Jemena does not expect to resume before February 2027.", "Residents have long raised concerns about diesel fumes and noise from the site, which they say is just 15 metres from homes. \"NextDC M3 doesn't have social licence for the existing building, they certainly don't have it for an expansion,\" said Sean Brown, a founding member of residents' group Citizens of Tottenham. The group's president, Jacqui Glover, said the delay was \"a reminder that the people living beside these developments cannot simply be pushed aside.\"", {"h": "The money"}, {"dl": [["Revenue forecast", "Cut to A$475–500 million for 2026-27, from A$615–640 million"], ["Earnings forecast", "Cut to A$245–265 million, from A$385–410 million"], ["Share price", "Down about 42 per cent after the October warning, since recovered"], ["Building budget", "A$4.5–5 billion this financial year, down from A$5.25–5.75 billion"], ["New shareholders", "Rivals Goodman Group and Digital Realty bought a 9.9 per cent stake for about A$715 million"]]}, "Goodman and Digital Realty said they had no current plans to make a takeover offer but reserved the right to do so. NEXTDC says construction is continuing inside the existing West Footscray buildings and the affected capacity is still under contract to an unnamed customer.", {"h": "Where the election comes in"}, "NEXTDC has applied to the Victorian Government to expand the site. The company says a decision on that permit is now expected in 2027 because of caretaker rules ahead of the 28 November state election. Victoria has also announced rules to keep new data centres at least 150 metres from homes and schools, the ABC reported.", "NEXTDC is due to report the outcome of a review of its building plans at its annual general meeting on 20 November."], "dek": "NEXTDC has paused every project without a signed customer after residents in Melbourne's west stopped the power upgrade its West Footscray site needs. Its chief executive says the company has to win back trust first.", "headline": "Melbourne data centre expansion halted as power delays and community opposition bite"}, "featured": false, "figure": {"en": "revenue wiped from NEXTDC's forecast", "value": "$140m"}, "image": {"addedAt": "2026-11-09T20:15:00Z", "addedBy": "claude", "alt": {"en": "Large high-voltage transformers and steel gantries at an electricity terminal station, seen through a wire fence across a grassy field."}, "caption": {"en": "Transformers at Keilor Terminal Station, which steps power down to 66,000 volts for Melbourne's northern and western suburbs. NEXTDC's West Footscray site is waiting on an upgrade to the same kind of 66kV network. File photo."}, "credit": "Allalone89", "file": "images/melbourne-terminal-station.jpg", "licence": "Public domain", "og": "og/melbourne-terminal-station.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Melbourne_Terminal_Station.JPG", "srcset": "img/melbourne-terminal-station-800.webp 800w, img/melbourne-terminal-station-1280.webp 1280w", "url": "img/melbourne-terminal-station-1280.webp"}, "priority": 7, "risk": "amber", "section": "business", "slug": "nextdc-west-footscray-data-centre-expansion-halted", "sources": [{"checked": "2026-11-09", "title": "Reuters via The Star: NextDC pauses uncontracted projects after Australian data centre woes (9 Nov 2026)", "url": "https://www.thestar.com.my/tech/tech-news/2026/11/09/nextdc-pauses-uncontracted-projects-after-australian-data-centre-woes"}, {"checked": "2026-11-09", "title": "Reuters via Investing.com: same report", "url": "https://www.investing.com/news/stock-market-news/nextdc-pauses-uncontracted-projects-after-australian-data-centre-woes-5010826"}, {"checked": "2026-11-09", "title": "NEXTDC ASX release: M3 power delay and revised FY27 guidance (21 Oct 2026)", "url": "https://announcements.asx.com.au/asxpdf/20261021/pdf/075kx2sf3k54h5.pdf"}, {"checked": "2026-11-09", "title": "ABC News: NextDC value on ASX smashed by delays to West Footscray data centre (21 Oct 2026)", "url": "https://www.abc.net.au/news/2026-10-21/west-footscray-data-centre-delays-nextdc-value-asx-vic/107291744"}], "status": "published", "type": "news", "updated": "2026-11-09T20:15:00Z"}, {"approvedAt": "2026-11-09T04:02:29Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "created": "2026-11-09T04:02:29Z", "date": "2026-11-09", "en": {"body": ["Community cricket clubs can now apply for grants from a new $900,000 fund for facility upgrades that cut energy costs and make grounds more resilient to heat, storms and drought.", "The Origin Community Cricket Fund is run by Cricket Australia in partnership with Origin Energy and covers the 2026-27 and 2027-28 seasons, according to Cricket Australia's Play Cricket website. Applications opened on Monday 9 November, The Indian Sun reported, and close on 26 February 2027.", {"h": "Who can apply"}, "Cricket clubs, associations, schools, councils and organisations that manage cricket facilities can apply. That includes the many community clubs in Melbourne's west, north and south-east.", {"h": "What it pays for"}, "Grants start at $10,000, The Indian Sun reported. Projects can include:", {"ul": ["Solar panels and battery storage", "Energy-efficient lighting", "Hot water systems", "Electric vehicle chargers", "Water tanks, irrigation and drainage", "Shade for players and spectators"]}, "Cricket Australia says projects are guided by its national community cricket infrastructure strategy, with a focus on climate resilience and cleaner energy.", {"h": "How to apply"}, "Read the fund's 2026-27 guidelines, fill in the application form and submit it through Cricket Australia's online grants portal. All three are linked from the fund's page on play.cricket.com.au.", {"note": "Running a club that has applied or won a grant? Tell us about it at news@themelbourneindian.com.au."}], "dek": "Clubs, associations, schools and councils can seek grants for solar panels, batteries and other facility upgrades. Applications close on 26 February 2027.", "headline": "Cricket clubs can apply for a share of a new $900,000 fund to cut energy costs"}, "figure": {"en": "for community cricket facilities", "value": "$900k"}, "image": {"addedAt": "2026-11-09T06:13:29Z", "addedBy": "claude", "alt": {"en": "Cricketers in whites playing a match on a green suburban ground, with a clubhouse and palm trees in the background."}, "caption": {"en": "A district cricket match at Albert Cricket Ground in Melbourne, photographed in 2014."}, "credit": "Aspirex", "file": "images/albert-cricket-ground.jpg", "licence": "CC BY-SA 3.0", "og": "og/albert-cricket-ground.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Albert_Cricket_Ground.jpg", "srcset": "img/albert-cricket-ground-800.webp 800w, img/albert-cricket-ground-1600.webp 1600w", "url": "img/albert-cricket-ground-1600.webp"}, "priority": 5, "risk": "green", "section": "sport", "slug": "origin-community-cricket-fund-clubs", "sources": [{"checked": "2026-11-09", "title": "Play Cricket (Cricket Australia): Origin Community Cricket Fund", "url": "https://play.cricket.com.au/community/resources/facilities-infrastructure/occf"}, {"checked": "2026-11-09", "title": "The Indian Sun: Cricket clubs offered share of $900,000 fund to cut energy costs (9 Nov 2026)", "url": "https://www.theindiansun.com.au/2026/11/09/cricket-clubs-offered-share-of-900000-fund-to-cut-energy-costs/"}], "status": "published", "type": "news", "updated": "2026-11-09T06:13:29Z"}, {"approvedAt": "2026-11-09T01:33:53Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "created": "2026-11-09T01:33:53Z", "date": "2026-11-09", "en": {"body": ["A Hindu temple in Melbourne's west was left without power on the eve of Diwali after its electricity was cut for the second time in eight days, according to MPs from both major parties. The incidents were first reported by The Indian Sun and South Asia Times.", "Evan Mulholland, the Opposition's spokesman for multicultural and multifaith affairs, said power to the SMVS Swaminarayan temple in Mount Cottrell, next to Tarneit, was cut on Saturday 31 October, and the community paid thousands of dollars to have it reconnected. He said vandals returned on Saturday 7 November, the night before Diwali, and cut the power again at the main electrical board. The temple could not restore it in time for its celebrations, he said.", "\"No faith community in Victoria should have to live like this,\" Mr Mulholland said in a statement on Sunday, The Indian Sun reported.", {"note": "The details of the power cuts come from MPs' statements. The Melbourne Indian has not been able to confirm them with Victoria Police, which had not commented publicly at the time of publication. No one has been charged and the motive is not known."}, {"h": "Both parties respond"}, "Tarneit's Labor MP, Dylan Wight, visited the temple on Sunday. He told The Indian Sun he was \"deeply disappointed and concerned by the latest act of vandalism\", and that no community should have to keep repairing damage to its place of worship.", "Mr Wight also told the paper that Labor would provide $200,000 for security upgrades at the temple if it is re-elected on 28 November, with the work to be decided with temple management. How the money would be paid and when work could start have not been announced.", "The Liberal candidate for Tarneit, Venkat Ram Upparlapalle, visited the temple last week and called for a thorough police investigation, stronger security and accountability. \"A temple should be a place of peace, prayer and belonging,\" he wrote on social media.", "Earlier this month Premier Ben Carroll announced an $11 million Temple and Gurdwara Safety Fund, for security and other upgrades at Hindu temples and Sikh gurdwaras, at the Sri Durga Temple in Deanside. South Asia Times reported that the Deanside temple would receive $1 million. The Melbourne Indian could not find a Coalition funding commitment for the SMVS temple at the time of publication.", {"h": "Not the first time"}, "Mr Mulholland said the temple had faced theft, break-ins, a firebombing, a vehicle being driven into the building and repeated interference with its power over more than a decade, sometimes before major festivals, The Indian Sun reported.", "After a break-in before Holi in March 2025, temple trustee Biren Joshi told The Australia Today it was the eighth incident in eight years, and that no arrests had been made for any of them. The temple has received government money for security before: The Indian Sun reported that funding for fencing, gates and CCTV was set aside for it under the federal Safer Communities Fund in 2020.", {"h": "If you have information"}, "Anyone with information can contact Crime Stoppers on 1800 333 000 or at crimestoppersvic.com.au, and can stay anonymous. In an emergency, call triple zero (000)."], "dek": "The SMVS Swaminarayan temple near Tarneit lost power twice in eight days, according to MPs from both major parties. Labor has pledged $200,000 for its security if re-elected.", "headline": "Vandals cut power to a temple in Melbourne's west on the eve of Diwali, MPs say"}, "figure": {"en": "power cuts in eight days, MPs say", "value": "2"}, "image": {"addedAt": "2026-11-09T19:58:00Z", "addedBy": "claude", "alt": {"en": "Lit clay oil lamps on a brass plate beside a small decorated lamp box, glowing in the dark."}, "caption": {"en": "Clay diyas lit for Diwali. The photo is illustrative and was not taken at the temple."}, "credit": "humdingor", "file": "images/diwali-diyas-lamps.jpg", "licence": "CC BY-SA 2.0", "og": "og/diwali-diyas-lamps.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Diwali_Diyas_Lamps.jpg", "srcset": "img/diwali-diyas-lamps-800.webp 800w, img/diwali-diyas-lamps-1280.webp 1280w", "url": "img/diwali-diyas-lamps-1280.webp"}, "priority": 8, "risk": "amber", "section": "community", "slug": "smvs-temple-power-cut-diwali-eve", "sources": [{"checked": "2026-11-09", "title": "The Indian Sun: Temple vandalism before Diwali adds to concerns over anti-Indian hostility in Australia (8 Nov 2026)", "url": "https://www.theindiansun.com.au/2026/11/09/temple-vandalism-before-diwali-adds-to-concerns-over-anti-indian-hostility-in-australia/"}, {"checked": "2026-11-09", "title": "The Indian Sun: Labor pledges $200,000 for security at Tarneit Hindu temple (9 Nov 2026)", "url": "https://www.theindiansun.com.au/2026/11/09/labor-pledges-200000-for-security-at-tarneit-hindu-temple-following-repeated-vandalism/"}, {"checked": "2026-11-09", "title": "South Asia Times: Labor, Libs slam vandalism at SMVS temple in Tarneit (9 Nov 2026)", "url": "https://www.southasiatimes.com.au/community/labor-opposition-condemn-smvs-temple-vandalism/"}, {"checked": "2026-11-09", "title": "South Asia Times: Victoria announces $11 million Temple and Gurdwara Safety Fund (1 Nov 2026)", "url": "https://www.southasiatimes.com.au/australia/victoria-11-million-temple-gurdwara-safety-fund-ben-carroll-2026/"}, {"checked": "2026-11-09", "title": "The Australia Today: Hindu temple targeted again in Melbourne (16 Mar 2025)", "url": "https://www.theaustraliatoday.com.au/hindu-temple-targeted-again-in-melbourne-community-calls-for-justice-and-increased-security/"}], "status": "published", "type": "news", "updated": "2026-11-09T19:58:00Z"}, {"approvedAt": "2026-11-09T20:06:00Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "created": "2026-11-09T12:25:00Z", "date": "2026-11-10", "en": {"body": ["Students hoping to come to Australia could have to move a large share of their course costs into an Australian bank account in their own name, and keep it there for up to three months, before they are even allowed to lodge a visa application, under options the federal government is now considering.", "The Department of Home Affairs has released a consultation paper on changing the student visa's financial requirements and the Genuine Student test. No decision has been made, and the department says feedback will inform whether the reforms go ahead at all.", "For Indian families, one part matters most. The paper floats an interim measure aimed at applicants from \"Evidence Level 3\" countries, the highest-scrutiny tier. India has been in that tier since 8 January this year, according to India's Minister of State for External Affairs, Kirti Vardhan Singh.", {"h": "The four options on the table"}, {"dl": [["Option 1: managed 50%", "Half of all tuition and living costs for the whole course, in an Australian account for at least one month before lodging, released on a set schedule"], ["Option 2: flexible 50%", "Half of all course costs, held in an Australian account for at least three months, with no set release schedule"], ["Option 3: first year in full", "All tuition and living costs for the first 12 months, held in an Australian account for at least three months"], ["Option 4: recognised education finance", "Costs covered through recognised lenders, personal funds or both; moving money to an Australian account preferred where practical"]]}, {"h": "What could change sooner for Indian applicants"}, "While the longer-term rules are worked out, the paper proposes that every primary applicant from an Evidence Level 3 country would have to provide financial evidence when they lodge, whatever their university or college. The required amounts would stay the same at first, but deposits would need at least six months of transaction history.", "Under the interim measure, money could generally come only from the applicant, a spouse, parents or another approved supporter. Unsecured personal loans, and loans that have not yet been paid out, would generally not be accepted.", {"h": "How big could the numbers get?"}, "The current living-cost requirement is A$29,710 a year. As an illustration only: for a two-year master's degree with tuition of A$45,000 a year, half of the full course costs (Options 1 and 2) would be about A$74,700, and the first year in full (Option 3) about A$74,700 as well. Actual figures would depend on the course, the fee and the option chosen.", {"h": "Why the government says it's doing this"}, "Assistant Minister for International Education Julian Hill has said the past year saw \"unprecedented\" numbers of student visa refusals, and that he wants \"the grant rates to improve and greater certainty for everyone\". He has also said \"the Government will not compromise on integrity\". New overseas student commencements at public universities are projected to be down about 18 per cent on last year.", "Not everyone is convinced. Immigration lawyer Marsha Bassily asked: \"Would you send thousands of dollars overseas before knowing whether you would even be granted a visa?\" Ravi Lochan Singh of education agency Global Reach warned that refused students could lose money to exchange-rate movements and transfer fees. The Association of Australian Education Representatives in India has said the two 50 per cent options are \"impractical and should not be pursued\".", {"h": "How to have your say"}, {"ul": ["Submissions close at 12pm AEDT on Monday 23 November 2026.", "Anyone can make one, including students, parents and community groups.", "Email student.visa.consultation@homeaffairs.gov.au with the subject line \"Student Visa Consultation – [your sector or organisation]\".", "Say who you are, what group you represent (if any), and answer the questions in the consultation paper that matter to you."]}, {"note": "These are proposals only. Nothing has changed yet for students applying now. If you are about to apply, follow the current rules on the Home Affairs website and check with your university or a registered migration agent."}], "dek": "Home Affairs is weighing a shake-up of student visa money rules, with a tougher interim check aimed at countries including India. Families have until 23 November to have their say.", "headline": "Indian students could have to park tens of thousands of dollars in an Australian bank before they can apply for a visa"}, "figure": {"en": "last day to have your say", "value": "23 Nov"}, "image": {"addedAt": "2026-11-09T19:58:00Z", "addedBy": "claude", "alt": {"en": "A paved courtyard with benches and gardens in front of a white multi-storey university building."}, "caption": {"en": "Monash University's Clayton campus in Melbourne's south-east. The photo is illustrative."}, "credit": "Michael_Rowe", "file": "images/monash-university-clayton-campus-5.jpg", "licence": "CC BY-SA 3.0", "og": "og/monash-university-clayton-campus-5.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Monash_University,_Clayton_campus_-_5.jpg", "srcset": "img/monash-university-clayton-campus-5-800.webp 800w, img/monash-university-clayton-campus-5-1280.webp 1280w", "url": "img/monash-university-clayton-campus-5-1280.webp"}, "priority": 9, "risk": "amber", "section": "education", "slug": "student-visa-bank-account-proposal-indian-students", "sources": [{"checked": "2026-11-09", "title": "Department of Home Affairs: Consultation on proposed reforms to the Genuine Student requirement and financial capacity framework", "url": "https://www.homeaffairs.gov.au/help-and-support/how-to-engage-us/consultations/consultation-on-proposed-reforms-to-the-genuine-student-requirement-and-financial-capacity-framework"}, {"checked": "2026-11-09", "title": "Department of Home Affairs: Consultation paper (PDF)", "url": "https://www.homeaffairs.gov.au/how-to-engage-us-subsite/files/strengthening-genuine-student-requirement-financial-capacity-framework-consultation-paper.pdf"}, {"checked": "2026-11-09", "title": "Times Higher Education: Mixed reaction to Australia's financial capacity proposals (4 Nov 2026)", "url": "https://www.timeshighereducation.com/node/745850"}, {"checked": "2026-11-09", "title": "ICEF Monitor: Australian government opens consultation on Genuine Student test and financial requirements (5 Nov 2026)", "url": "https://monitor.icef.com/2026/11/amidst-high-visa-refusal-rates-and-falling-commencements-australian-government-opens-consultation-on-reforms-to-genuine-student-test-and-financial-requirements/"}, {"checked": "2026-11-09", "title": "Business Standard: Australia puts Indian students under highest visa risk tier (3 Apr 2026)", "url": "https://www.business-standard.com/immigration/australia-puts-indian-students-under-highest-visa-risk-tier-impact-decoded-126040300333_1.html"}], "status": "published", "type": "news", "updated": "2026-11-09T20:06:00Z"}, {"approvedAt": "2026-11-08T20:06:27Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["The Department of Home Affairs changed the rules for Student visa (subclass 500) and Student Guardian visa (subclass 590) applications on 2 October 2026. The changes affect where people can apply from and whether family members can be included.", "If you already hold a Student visa, the department says the changes do not affect your current visa. Applications lodged before 2 October, including those that listed family members, are assessed under the old rules.", {"h": "Applying from inside Australia"}, "According to the department's factsheet, most temporary visa holders in Australia can no longer lodge a Student or Student Guardian visa application while in Australia. This includes current Student visa holders applying for another Student visa, unless an exemption applies.", "Current Student Guardian visa holders can still lodge a further Student Guardian visa application in Australia, the factsheet says.", "If the new rules stop you applying onshore, you must be outside Australia both when you lodge the application and when the visa is granted.", {"h": "Exemptions for further study in Australia"}, {"ul": ["You need up to 12 more months to finish your course with the same education provider", "You are moving to a higher Australian Qualifications Framework (AQF) level after completing your main course", "You are applying for a PhD", "You are sponsored by the Department of Foreign Affairs and Trade or Defence", "You are applying for primary or secondary school study", "Your education provider has defaulted and you cannot continue your course", "Some moves between school, non-AQF and AQF courses (the factsheet lists these)"]}, {"h": "Partners and children"}, "New Student visa applicants can no longer include a partner or dependent children in their application unless an exemption applies. Exemptions include PhD students, students sponsored by DFAT or Defence, students on a foreign government scholarship, and eligible students from Pacific or ASEAN countries.", "Current Student visa holders can no longer add family members after their visa is granted. The department says there are no exemptions to this rule. Family members already included on a current Student visa may be included in the next application if it is made in Australia.", "The primary applicant and all family members in an application must be in the same location when it is lodged.", {"note": "This is general information, not migration advice. The Department of Home Affairs lists the affected visa types on its Subclass 500 Student visa page. For advice about your situation, speak to a registered migration agent or lawyer."}], "dek": "Since 2 October, most temporary visa holders in Australia can no longer lodge a Student visa application onshore, and new applicants generally cannot include a partner or children. Here is what the Department of Home Affairs says has changed.", "headline": "New student visa rules: who can still apply from inside Australia"}, "figure": {"en": "new onshore Student visa rules began", "value": "2 Oct"}, "image": {"addedAt": "2026-11-08T20:13:38Z", "addedBy": "claude", "alt": {"en": "Modern timber-and-glass student buildings around a paved courtyard at the University of Melbourne under a blue sky."}, "caption": {"en": "The student precinct at the University of Melbourne."}, "credit": "ColonelLight", "file": "images/university-of-melbourne-student-precinct.jpg", "licence": "CC BY-SA 4.0", "og": "og/university-of-melbourne-student-precinct.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:University_of_Melbourne_Student_Precinct.jpg", "srcset": "img/university-of-melbourne-student-precinct-800.webp 800w, img/university-of-melbourne-student-precinct-1280.webp 1280w", "url": "img/university-of-melbourne-student-precinct-1280.webp"}, "priority": 7, "risk": "amber", "section": "education", "slug": "student-visa-onshore-rules-october-2026", "sources": [{"checked": "2026-11-08", "title": "Department of Home Affairs: Changes to Student visa application rules (factsheet)", "url": "https://immi.homeaffairs.gov.au/Visa-subsite/files/changes-to-student-visa-applications-factsheet.pdf"}, {"checked": "2026-11-08", "title": "Kindra Migration Lawyers: Student visa rules changed today (2 October 2026), secondary, used for background only", "url": "https://kindramigration.com.au/insights/student-visa-rules-changed-today-what-students-and-families-need-to-know/"}], "status": "published", "type": "explainer", "updated": "2026-11-08T20:13:38Z"}, {"approvedAt": "2026-11-09T22:54:38.311Z", "approvedBy": "u_N2husJ7AcYn9nq725rcg0Q", "byline": "The Melbourne Indian newsroom", "corrections": [], "created": "2026-11-09T22:40:00Z", "date": "2026-11-10", "en": {"body": ["Victoria Police is investigating two incidents in which power cables were cut at the SMVS Swaminarayan temple in Melbourne's west in the days before Diwali, and is asking anyone with information or dashcam footage to come forward.", "In a statement quoted by The Indian Sun on Monday, police said the incidents happened on 31 October and 6 November, and that the second also involved damage to a meter box. Police put the total damage at up to $8,000. The Hindu Council of Australia has said the second incident happened in the early hours of 7 November.", "\"It is yet to be determined if the offending were racially or religiously motivated,\" Victoria Police said, according to The Indian Sun. No one had been charged at the time of writing.", {"h": "What happens next"}, "The temple's community and the Hindu Council have called for stronger security. Labor's member for Tarneit, Dylan Wight, has promised $200,000 for security at the temple if Labor is re-elected on 28 November. The Liberal candidate for Tarneit, Venkat Ram Upparlapalle, visited the temple and called for a thorough investigation, The Indian Sun reported.", {"h": "If you saw something"}, {"ul": ["Call Crime Stoppers on 1800 333 000", "Or report online at crimestoppersvic.com.au", "You can stay anonymous"]}, "Read our earlier report on the power cuts and the community's response."], "dek": "Victoria Police says it has not yet determined whether the two incidents at the Swaminarayan temple before Diwali were racially or religiously motivated.", "headline": "Police investigating temple power cuts in Melbourne's west, appeal for dashcam
