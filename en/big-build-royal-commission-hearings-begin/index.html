 ROIs from previous program years have expired, so earlier applicants must lodge a new one. They report an ROI fee of $60 plus GST for applicants in Australia, and a nomination application fee of $180 plus GST, payable only if invited. They also say ROIs are ranked using a Victorian points test that looks at priority industries, earning potential and specialist skills.", "The Department of Home Affairs has not yet published the 2026-27 state allocations on its website, which still shows last year's figures. In 2025-26, Victoria could nominate up to 2,700 people for the 190 visa and 700 for the 491.", {"note": "This is general information, not migration advice. Check the official Live in Melbourne pages before you apply, and use only a registered migration agent or lawyer for advice about your situation."}], "dek": "If you hoped for Victorian state nomination this year, you need a fresh registration of interest. Here is what is confirmed, and what to check.", "headline": "Victoria's skilled visa nomination is open again for the 190 visa, but not yet for the regional 491"}, "figure": {"en": "Victoria is taking registrations of interest for this visa; 491 is not yet open", "value": "190"}, "image": {"addedAt": "2026-11-11T05:40:00Z", "addedBy": "claude", "alt": {"en": "Illustration of a Victorian registration of interest form beside two cards: '190, Skilled Nominated visa', marked open, and '491, Skilled Work Regional visa', marked not yet."}, "caption": {"en": "Illustration. Check the Live in Melbourne website for the current status of each visa."}, "credit": "The Melbourne Indian", "file": "images/victoria-skilled-visa-190-nomination-2026-27-open.jpg", "licence": "Original illustration", "og": "og/victoria-skilled-visa-190-nomination-2026-27-open.jpg", "srcset": "img/victoria-skilled-visa-190-nomination-2026-27-open-800.webp 800w, img/victoria-skilled-visa-190-nomination-2026-27-open-1600.webp 1600w", "url": "img/victoria-skilled-visa-190-nomination-2026-27-open-1600 "date": "2026-11-11", "en": {"body": ["Victoria's election is still more than two weeks away, but one count is already in. Ramayana: Part One was the most-watched film in Australia on its opening weekend, taking about $2.72 million from Thursday 5 November to Sunday 8 November, Variety Australia reported.", "Trade publication B&T reported the film sold about 117,000 tickets over the weekend. Japan's Godzilla Minus Zero came second with $1.31 million for the weekend, according to Variety Australia ($1.6 million and about 55,000 tickets once IMAX preview screenings are included, B&T reported).", {"h": "A first for Australian cinemas"}, "B&T reported it was the first time two foreign-language films finished first and second across a weekend at the Australian box office. The pair also held the top two spots on opening day.", "\"Two films in two different languages outsold every English-language release in the country,\" said Guy Burbidge, managing director of cinema advertising company Val Morgan Cinema. \"This weekend shows how much Australia's culturally and linguistically diverse audiences are shaping cinema.\"", {"h": "The count so far"}, {"dl": [["Australian opening weekend", "About $2.72 million (No. 1)"], ["Tickets sold", "About 117,000"], ["Runner-up", "Godzilla Minus Zero, $1.31 million"], ["Bollywood record", "Second-biggest Bollywood opening in Australia, behind Dhurandhar: The Revenge (B&T)"]]}, "The film opened in Australia on 5 November, a day before most other markets and three days before its Diwali release in India. A second part is planned for Diwali 2027.", {"note": "The other election: early voting for Victoria's state election opens on Wednesday 18 November, and election day is Saturday 28 November."}], "dek": "Victorians vote on 28 November, but cinemagoers have already declared a winner: the Hindi epic topped the national box office, with Godzilla second, the first time two non-English films have led an Australian weekend.", "headline": "Ramayana 003c/tr>\n\u003ctr>\u003ctd>Sponsored article\u003c/td>\u003ctd>A profile of your business, written with you and clearly labelled as sponsored\u003c/td>\u003ctd class=\"num\">$299 / article\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cp class=\"small\">Prices exclude GST where applicable.\u003c/p>\n\u003ch2>With every founding package\u003c/h2>\n\u003cul>\n\u003cli>We design your ad for you, free.\u003c/li>\n\u003cli>You pay nothing until your ad is live.\u003c/li>\n\u003cli>Every month, a report with your real readership figures.\u003c/li>\n\u003cli>Your founding rate stays locked for your first 12 months.\u003c/li>\n\u003c/ul>\n\u003cp>\u003ca class=\"btn\" href=\"/media-kit.pdf\" target=\"_blank\" rel=\"noopener\">Download our media kit (PDF)\u003c/a>\u003c/p>\n\u003ch2>Our rules for advertisers\u003c/h2>\n\u003cul>\n\u003cli>Advertising never influences what we report.\u003c/li>\n\u003cli>Every ad and sponsored article is clearly labelled.\u003c/li>\n\u003cli>Ads for financial, migration, health and legal services are checked before they run.\u003c/li>\n\u003cli>We decline claims we cannot verify, and we may decline any ad.\u003c/li>\n\u003c/ul>\n\u003ch2>Get in touch\u003c/h2>\n\u003cp>Email \u003ca href=\"mailto:ads@themelbourneindian.com.au\">ads@themelbourneindian.com.au\u003c/a> with your business name and what you would like to promote.\u003c/p>", "privacy": "\u003cp class=\"dek\">What we collect, why we collect it, and what you can ask us to do with it.\u003c/p>\n\u003ch2>Who we are\u003c/h2>\n\u003cp>The Melbourne Indian is an independent news publication in Melbourne. Questions about privacy go to \u003ca href=\"mailto:news@themelbourneindian.com.au\">news@themelbourneindian.com.au\u003c/a>.\u003c/p>\n\u003ch2>What we collect\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>When you email us or use a form on our website\u003c/strong> with a news tip, a correction, an advertising enquiry, a directory listing or a newsletter sign-up: your name if you give it, your email address and what you send us.\u003c/li>\n\u003cli>\u003cstrong>Directory listings:\u003c/strong> the business details you ask us to publish. Once published, listing details are public.\u003c/li>\n\u003cli>\u003cstrong>Advertisers:\u003c/strong> the contact and billing details we need to run and invoice your booking.\u003c/li>\n\u003c/ul>\n\u003cp>We do not run advertising trackers on this website, and we do not sell personal information.\u003c/p>\n\u003ch2>Visitor statistics\u003c/h2>\n\u003cp>We count visits to the website with Umami (umami.is), a privacy-focused statistics service, so we know which stories people read and where our readers come from. It does not use cookies and does not identify you. It records the page you viewed, the website or link that sent you, your device and browser type, and your approximate location (city or region). It also counts some actions, such as signing up to the newsletter or sharing a story, without recording what you typed. We see these only as totals.\u003c/p>\n\u003ch2>What the website keeps on your device\u003c/h2>\n\u003cp>If you install our app or visit often, your browser keeps copies of pages and photos so they load quickly and work offline. It also remembers if you closed the \"Get the app\" or newsletter message, or already signed up, so we don't show it again. This stays on your device, and you can clear it in your browser settings.\u003c/p>\n\u003ch2>Services we use\u003c/h2>\n\u003cp>The website is hosted on GitHub Pages and loads fonts from Google Fonts, so those services receive standard technical information, such as your IP address, when you visit. Our email runs on Microsoft 365. Forms on the website are delivered to our inbox by FormSubmit (formsubmit.co), which passes on what you type and does not use it for anything else. Visitor statistics are counted by Umami, as described above. Our newsroom uses software, including AI tools, to organise and check information. We only put personal details into these tools when we need to, for example to reply to you.\u003c/p>\n\u003ch2>Sources and tips\u003c/h2>\n\u003cp>We will not publish your name or identify you as a source without your permission.\u003c/p>\n\u003ch2>How long we keep it\u003c/h2>\n\u003cp>We keep emails and records only for as long as we need them for the reason you sent them, or for as long as the law requires, for example for invoices.\u003c/p>\n\u003ch2>Your choices\u003c/h2>\n\u003cp>You can ask to see, correct or delete the personal information we hold about you, or to stop receiving anything we send, by emailing \u003ca href=\"mailto:news@themelbourneindian.com.au\">news@themelbourneindian.com.au\u003c/a>. We will reply within 30 days.\u003c/p>\n\u003cp>If you are unhappy with how we have handled your information, please tell us first. You can also contact the Office of the Australian Information Commissioner at \u003ca href=\"https://www.oaic.gov.au\" target=\"_blank\" rel=\"noopener\">oaic.gov.au\u003c/a>.\u003c/p>\n\u003cp class=\"small muted\">Last updated 10 November 2026.\u003c/p>", "standards": "\u003cp class=\"dek\">How we decide what to publish, how we check it, and how we fix mistakes.\u003c/p>\n\u003ch2>What we cover\u003c/h2>\n\u003cp>We cover news that matters to people of Indian heritage living in Melbourne: local and state government, business, festivals and faith, education, health services and community life. News from India appears when it affects readers here.\u003c/p>\n\u003ch2>Sources\u003c/h2>\n\u003cp>We report from published records, official announcements, organisers' own listings and documents we can link to. Every story ends with its sources and the date we checked them. When sources disagree, we say so or we hold the story.\u003c/p>\n\u003ch2>How a story gets published\u003c/h2>\n\u003cp>We sort every story into one of three levels before it goes anywhere.\u003c/p>\n\u003cdl class=\"tiers\">\n\u003cdt>\u003cspan class=\"tier tier-green\">Routine\u003c/span>\u003c/dt>\u003cdd>Official dates, public event details, program facts and notices taken directly from an official or organiser's source. These are checked against that source before publication.\u003c/dd>\n\u003cdt>\u003cspan class=\"tier tier-amber\">Review\u003c/span>\u003c/dt>\u003cdd>Election promises, policy debates, business disputes and anything a reasonable person could contest. A person approves these before publication.\u003c/dd>\n\u003cdt>\u003cspan class=\"tier tier-red\">Sensitive\u003c/span>\u003c/dt>\u003cdd>Crime, courts, allegations about people, public safety, health, migration or legal advice, and anything involving children. These get careful human editorial review, and legal advice where needed.\u003c/dd>\n\u003c/dl>\n\u003cp>When we are unsure which level applies, we treat the story as the higher one.\u003c/p>\n\u003ch2>AI tools\u003c/h2>\n\u003cp>We use AI tools to help find sources, draft stories and translate them into Hindi and Punjabi. We do not use AI to invent quotes, people, interviews or images of real events. Translations are checked against the English original, and we welcome corrections from readers fluent in each language.\u003c/p>\n\u003ch2>Politics\u003c/h2>\n\u003cp>We do not endorse candidates or parties. In election coverage we give the same treatment to every candidate and stick to what they have said and done.\u003c/p>\n\u003ch2>Advertising\u003c/h2>\n\u003cp>Advertisers do not influence our reporting. Advertising and sponsored content are always clearly labelled as such.\u003c/p>\n\u003ch2>Corrections\u003c/h2>\n\u003cp>When we get something wrong, we fix it and add a note at the end of the story saying what changed and when. To report an error, email \u003ca href=\"mailto:news@themelbourneindian.com.au\">news@themelbourneindian.com.au\u003c/a>.\u003c/p>\n"}, "scores": [{"comp": "WBBL", "line": "Sydney Thunder 111/2 (15 ov) v Perth Scorchers", "sport": "cricket", "start": "2026-11-11T08:10:00Z", "status": "l async function submitForm(form) {
  const kind = form.dataset.form; const f = FORMS[kind]; const out = form.querySelector('.out');

  if (missing.length) { out.innerHTML = `<p class="status err">Please fill in: ${esc(missing.join(', '))}.</p>`; return; }

const DESK_NAV = [['overview', 'Overview'], ['stories', 'Stories'], ['preview', 'Front page preview'], ['dates', 'Key dates'], ['images', 'Image register'], ['enquiries', 'Advertiser enquiries'], ['ads', 'Ad bookings'], ['directory', 'Directory'], ['newsletter', 'Newsletter'], ['tips', 'Reader tips'], ['automation', 'Automation & costs'], ['audit', 'Audit log']];
const COLLS = ['articles', 'dates', 'enquiries', 'subscribers', 'submissions', 'tips', 'ads', 'directory', 'issues', 'audit', 'runs'];
function startDesk() {
  if (S.deskStarted || !S.db || !S.isEditor) return; S.deskStarted = true;
  const pending = new Set(COLLS);
  const timer = setTimeout(() => { if (!S.deskLoaded) { S.deskErr = 'The newsroom database is taking longer than usual to respond.'; render(); } }, 10000);
  for (const c of COLLS) {
    let q = S.db.collection(c);
    if (c === 'audit') q = q.orderBy('at', 'desc').limit(150);
    q.onSnapshot(snap => {
      S.desk[c] = snap.docs.map(d => ({ ...d.data(), _id: d.id }));
      if (c === 'articles') S.desk.articles.forEach(a => { a.slug = a.slug || a._id; });
      pending.delete(c);
      if (!pending.size) { S.deskLoaded = true; clearTimeout(timer); S.deskErr = null; }
      if (S.deskLoaded) scheduleRender();
    }, err => { S.deskErr = 'Could not load ' + c + ': ' + (err && err.code || 'error'); clearTimeout(timer); scheduleRender(); });
  }
}

function blocksToText(blocks) {
  return (blocks || []).map(b => typeof b === 'string' ? b : b.h ? '## ' + b.h : b.note ? '> ' + b.note : b.ul ? b.ul.map(x => '- ' + x).join('\n') : b.dl ? b.dl.map(([k, v]) => '| ' + k + ' | ' + v).join('\n') : '').join('\n\n');
}
function textToBlocks(txt) {
  const out = [];
  for (const chunk of String(txt || '').replace(/\r/g, '').split(/\n\s*\n/)) {
    const c = chunk.trim(); if (!c) continue;
    const lines = c.split('\n').map(s => s.trim()).filter(Boolean);
    if (c.startsWith('## ')) out.push({ h: c.slice(3).trim() });
    else if (c.startsWith('> ')) out.push({ note: lines.map(s => s.replace(/^>\s?/, '')).join(' ') });
    else if (lines.every(s => s.startsWith('- '))) out.push({ ul: lines.map(s => s.slice(2).trim()) });
    else if (lines.every(s => s.startsWith('|'))) out.push({ dl: lines.map(s => s.replace(/^\|\s*/, '').split('|').map(x => x.trim())).map(([k, v]) => [k || '', v || '']) });
    else out.push(lines.join(' '));
  }
  return out;
}

function approvalIssues(a) {
  const p = [];
  if (!a.en?.headline) p.push('English headline is missing.');
  if (!a.en?.dek) p.push('English standfirst is missing.');
  if (!(a.en?.body || []).length) p.push('English body is empty.');
  if (a.type !== 'notice' && !(a.sources || []).length) p.push('Add at least one source.');
  for (const x of ['hi', 'pa']) if (has(a, x) && (a.translations || {})[x] !== 'reviewed') p.push(`${LANG_FULL[x]} translation has not been marked as reviewed.`);
  if (a.image?.url && (!a.image.credit || !a.image.licence || !a.image.alt?.en)) p.push('Image needs a credit, licence and alt text.');
  if (a.risk === 'red' && !a.red_reviewed) p.push('Red-risk story: confirm the editorial/legal review.');
  return p;
}
function readArticleForm(form, a) {

async function publishSite() {
  const out = document.getElementById('pub-out');
  const say = (m, ok) => { if (out) out.innerHTML = `<p class="status ${ok ? 'ok' : 'err'}">${esc(m)}</p>`; else toast(m); };
  if (!S.artifact) { say('Publishing is available to editors in the Claude app. Ask Claude to publish the update instead.'); return; }
  const snap = snapshotFromDesk();
  say('Publishing…', true);
  try {
    await S.artifact.publish({ 'data/site.json': { content: JSON.stringify(snap), contentType: 'application/json' } });
    site = snap; audit('published site update', '', `${snap.articles.length} stories live`); say(`Published. ${snap.articles.length} stories are live.`, true); render(true);
  } catch (e) {
    if (e && (e.code === 'capability_disabled' || e.code === 'not_granted' || e.code === 'bad_request' || e.code === 'read_only_path')) {
      try { audit('published site update (full page)', '', `${snap.articles.length} stories live`); await S.artifact.publish(buildDocument(snap)); return; }
      catch (e2) { say('Could not publish (' + (e2.code || 'error') + '). Ask Claude to publish the update.'); return; }
    }
    if (e && e.code === 'conflict') { say('Someone published at the same time. The page will reload; try again.'); return; }
    say('Could not publish (' + (e && e.code || 'error') + ').');
  }
}

document.addEventListener('click', async ev => {
  const go = ev.target.closest('[data-go]'); if (go && !ev.target.closest('a,button,input,select,textarea')) { location.hash = go.dataset.go.slice(1); return; }
  const b = ev.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT' || (b.tagName === 'INPUT' && b.type !== 'checkbox')) return;
  const act = b.dataset.act; const r = route();
  const form = b.closest('form');
  switch (act) {
    case 'exit-preview': S.ui.preview = false; render(); break;
    case 'copy-form': { const pre = b.closest('.status').querySelector('.copytxt'); copyText(pre.textContent, pre); break; }
    case 'publish-site': publishSite(); break;
    case 'story-filter': S.ui.storyFilter = b.dataset.v; render(); break;
    case 'new-story-open': S.ui.newStory = true; render(); break;
    case 'new-story-cancel': S.ui.newStory = false; render(); break;
    case 'ed-tab': { const f = b.closest('form'); if (f) await saveArticle(f); S.ui.edTab = b.dataset.v; render(); break; }
    case 'approve': case 'unpublish': case 'hold': case 'to-draft': {
      const f = b.closest('form'); const saved = await saveArticle(f); if (!saved) return;
      const o = document.getElementById('ed-out');
      if (act === 'approve') {
        const iss = approvalIssues(saved); if (iss.length) { o.innerHTML = `<p class="status err">Not approved yet: ${esc(iss.join(' '))}</p>`; return; }
        await S.db.doc('articles/' + saved.slug).update({ status: 'published', approvedAt: nowIso(), approvedBy: S.uid || 'editor' });
        audit('approved', saved.slug); o.innerHTML = `<p class="status ok">Approved. Publishing the site update…</p>`; setTimeout(publishSite, 300);
      } else {
        const st = { unpublish: 'draft', hold: 'held', 'to-draft': 'draft' }[act];
        await S.db.doc('articles/' + saved.slug).update({ status: st }); audit(act === 'unpublish' ? 'unpublished' : act === 'hold' ? 'held' : 'moved to drafts', saved.slug);

    case 'remove-lang': { const slug = r.arg; const a = S.desk.articles.find(x => x.slug === slug); const upd = { [b.dataset.v]: null, translations: { ...(a.translations || {}), [b.dataset.v]: null }, updated: nowIso() }; await S.db.doc('articles/' + slug).update(upd); audit('removed ' + b.dataset.v + ' version', slug); S.ui.edTab = 'en'; break; }

        const res = await S.sample.json(`Translate this news story into ${name} for The Melbourne Indian, a Melbourne community newspaper. Keep every fact, number, date, name and quotation exactly; keep quotation marks around quoted words; do not add or remove information. Write idiomatic, natural prose, not word-for-word. Keep English acronyms (VEC, ABS, VFS, OCI) as they are. Reply with only JSON: {"headline": string, "dek": string, "body": array} where body mirrors the input body array item-for-item (strings stay strings; objects keep their keys h/ul/dl/note with translated values; in dl translate both columns).\n\nINPUT:\n${JSON.stringify(a.en)}`, { modelTier: 'complex' });
        if (!res || !res.headline || !Array.isArray(res.body)) throw { code: 'invalid_json' };
        await S.db.doc('articles/' + slug).update({ [lang]: { headline: res.headline, dek: res.dek || '', body: res.body }, translations: { ...(a.translations || {}), [lang]: 'machine' }, updated: nowIso() });
