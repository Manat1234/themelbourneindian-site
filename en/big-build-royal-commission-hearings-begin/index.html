:root{
  --paper:#FAF8F3; --surface:#FFFFFF; --ink:#181F1C; --ink2:#3B4540; --muted:#66716B; --rule:#DDDCD4; --rule2:#C9C8BE;
  --saffron:#BD5125; --moss:#315343; --mint:#E7EEE8; --cream:#F3E8D7; --forest:#182920; --forest-ink:#E9EFEA; --forest-muted:#A9BAB0;
  --s-community:#BD5125; --s-civic:#315343; --s-business:#24425E; --s-education:#0E6A73; --s-culture:#A16A07; --s-india:#8A2E3B;
  --ok:#2E7D4F; --warn:#A46200; --bad:#B23A3A; --focus:#0E6A73;
  --serif:"Newsreader","Noto Serif Devanagari","Noto Serif Gurmukhi",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Mukta","Mukta Mahee","Segoe UI",system-ui,sans-serif;
  --logo:Georgia,"Times New Roman",serif;
  --w:1240px;
}
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink)}
#app{font:400 17px/1.55 var(--sans);background:var(--paper);color:var(--ink);min-height:100vh}
[lang="hi"] #app,[lang="pa"] #app,#app [lang="hi"],#app [lang="pa"]{line-height:1.7}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img{max-width:100%;display:block}
.wrap{max-width:var(--w);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:14px}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0 0 1em}

/* ---------- top utility + masthead ---------- */
.util{border-bottom:1px solid var(--rule);font-size:13px;color:var(--muted)}
.util-in{display:flex;gap:10px 22px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:7px}
.util-l{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center}
.util-l strong{color:var(--saffron);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.util-r{display:flex;gap:4px 16px;align-items:center;flex-wrap:wrap}
.util-r a{text-decoration:none;font-weight:600;color:var(--ink2)}
.util-r a:hover{color:var(--saffron)}
.desk-link{background:var(--ink);color:var(--paper)!important;padding:3px 10px;border-radius:2px}
.mast{background:var(--paper)}
.mast-in{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:24px 14px;text-align:center}
.identity{display:flex;align-items:center;gap:18px;text-decoration:none;min-width:0;text-align:left}
.brandmark{width:68px;height:68px;flex:none;display:grid;place-items:center;background:#181f1c;color:#fff;font-family:var(--logo);font-size:38px;line-height:1;border-radius:50%;border:3px solid var(--saffron)}
.brand{display:block;font-family:var(--logo);letter-spacing:-.055em;font-size:clamp(30px,5.4vw,64px);font-weight:800;line-height:1.02}
.brand em{font-style:normal;color:var(--saffron)}
.tagline{display:block;font-size:14px;letter-spacing:.24em;text-transform:uppercase;margin-top:6px;color:var(--ink2);font-weight:700}
.edition-line{display:grid;grid-template-columns:minmax(16px,1fr) auto minmax(16px,1fr);align-items:center;gap:22px;width:100%;max-width:900px}
.edition-line::before,.edition-line::after{content:"";height:1px;background:var(--muted)}
.ed-links{display:flex;gap:14px;align-items:center}
.ed-links a{text-decoration:none;font-weight:700;color:var(--muted);font-size:17px;padding-bottom:2px;border-bottom:2px solid transparent}
.ed-links a[lang="en"]{letter-spacing:.2em;text-transform:uppercase;font-size:15px}
.ed-links a:hover{color:var(--ink)}
.ed-links a[aria-current]{color:var(--ink);border-color:var(--saffron)}
.ed-sep{color:var(--saffron);font-weight:700;font-size:20px}
.util-sub{color:var(--saffron)!important}
[lang="hi"] .tagline,[lang="pa"] .tagline{letter-spacing:.03em;font-size:13px;text-transform:none}
.mast-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.langs{display:flex;gap:2px;border:1px solid var(--rule2);border-radius:999px;padding:3px;background:var(--surface)}
.langs a{padding:5px 12px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:700;color:var(--muted)}
.langs a[aria-current]{background:var(--ink);color:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:10px 16px;border-radius:2px;font:700 14px/1.2 var(--sans);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--moss);border-color:var(--moss)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--mint)}
.btn.saffron{background:var(--saffron);border-color:var(--saffron);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.nav{border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);background:var(--paper);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.nav-in{display:flex;gap:0 24px;align-items:center;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.nav-in::-webkit-scrollbar{display:none}
.nav a{display:inline-block;text-decoration:none;font-weight:700;font-size:14px;padding:12px 0 10px;border-bottom:3px solid transparent;margin-bottom:-1px}
.nav a:hover{border-color:var(--rule2)}
.nav a[aria-current]{border-color:var(--sec,var(--saffron))}
.nav .spacer{margin-left:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}

/* key-dates ticker */
.ticker{border-bottom:1px solid var(--rule);background:var(--surface)}
.ticker-in{display:flex;gap:18px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-block:9px;font-size:14px;white-space:nowrap}
.ticker-in::-webkit-scrollbar{display:none}
.ticker b{color:var(--saffron);text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.ticker a{text-decoration:none}
.ticker a:hover{text-decoration:underline}
.ticker .d{font-weight:700;margin-right:6px}
.ticker .sep{color:var(--rule2)}

/* ---------- labels ---------- */
.kicker{display:inline-block;font:700 12px/1.2 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--sec,var(--saffron));text-decoration:none;margin-bottom:6px}
[lang="hi"] .kicker,[lang="pa"] .kicker{letter-spacing:.02em;font-size:14px;text-transform:none}
.type-tag{font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{display:inline-block;font:700 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:2px;border:1px solid currentColor;vertical-align:middle}
.b-draft{color:var(--warn)} .b-held{color:var(--bad)} .b-published{color:var(--ok)} .b-review{color:var(--s-business)}
.b-green{color:var(--ok)} .b-amber{color:var(--warn)} .b-red{color:var(--bad)}
.draftbar{background:var(--cream);border-bottom:1px solid var(--rule);font-size:14px}
.draftbar .wrap{padding-block:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- media ---------- */
.media{position:relative;overflow:hidden;background:var(--mint);aspect-ratio:16/9;max-width:100%}
.media img,.media svg{width:100%;height:100%;object-fit:cover;display:block}
.media.r43{aspect-ratio:4/3}.media.r32{aspect-ratio:3/2}.media.r11{aspect-ratio:1/1}
figure{margin:0}
figcaption{font-size:13px;color:var(--muted);padding-top:8px;line-height:1.45}
figcaption .credit{white-space:nowrap}

/* ---------- front page ---------- */
.front{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;padding-block:24px 30px}
.lead-pkg{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-content:start}
.lead-story{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;padding-bottom:22px;border-bottom:1px solid var(--rule)}
.lead-story h2{font-size:clamp(30px,3.5vw,46px);line-height:1.06;margin-bottom:12px}
[lang="hi"] .lead-story h2,[lang="pa"] .lead-story h2{line-height:1.3}
.lead-story .dek{font-size:18px;color:var(--ink2);margin-bottom:12px}
.story-link{text-decoration:none}
.story-link:hover h2,.story-link:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.second{display:flex;flex-direction:column;gap:10px;min-width:0}
.second h3{font-size:22px;line-height:1.15}
[lang="hi"] .second h3,[lang="pa"] .second h3{line-height:1.35}
.second .dek{font-size:15px;color:var(--ink2);margin:0}
.second + .second{border-left:1px solid var(--rule);padding-left:24px}
.rail{display:flex;flex-direction:column;gap:24px;min-width:0}
.rail-box{border-top:3px solid var(--ink);padding-top:10px}
.rail-box h2{font-size:20px;margin-bottom:6px}
.datelist{list-style:none;margin:0;padding:0}
.datelist li{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;align-items:center;padding-block:9px;border-bottom:1px solid var(--rule)}
.datelist a{text-decoration:none;font-size:15px;line-height:1.35}
.datelist a:hover{color:var(--saffron)}
.rd{display:flex;flex-direction:column;align-items:center;line-height:1}
.rd-n{font:600 26px/1 var(--serif)}
.rd-m{font:700 11px/1.4 var(--sans);color:var(--saffron);letter-spacing:.06em;text-transform:uppercase}

.latest{border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:34px}
.latest article{padding:14px 18px 16px;min-width:0}
.latest article + article{border-left:1px solid var(--rule)}
.latest .num{font:600 13px/1 var(--sans);color:var(--muted);display:block;margin-bottom:8px}
.latest h3{font-size:18px;line-height:1.2}
[lang="hi"] .latest h3,[lang="pa"] .latest h3{line-height:1.4}

.band-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:3px solid var(--sec,var(--ink));padding-top:8px;margin-bottom:16px}
.band-h h2{font-size:26px}
.band-h a{font-size:14px;font-weight:700;text-decoration:none;color:var(--sec,var(--saffron))}
.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 40px;margin-bottom:40px}
.secblock{min-width:0}
.secblock .top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;padding-bottom:14px}
.secblock .top h3{font-size:22px;line-height:1.15;margin-bottom:8px}
[lang="hi"] .secblock .top h3,[lang="pa"] .secblock .top h3{line-height:1.35}
.secblock .top .dek{font-size:15px;color:var(--ink2);margin:0}
.secblock ul{list-style:none;margin:0;padding:0}
.secblock li{border-top:1px solid var(--rule);padding-block:10px}
.secblock li a{text-decoration:none;font:600 17px/1.3 var(--serif)}
.secblock li a:hover{text-decoration:underline}

.guides{background:var(--cream);margin-bottom:40px}
.guides .wrap{padding-block:26px 30px}
.guides-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.guide{border-left:3px solid var(--sec,var(--saffron));padding-left:14px;min-width:0}
.guide h3{font-size:20px;line-height:1.2;margin-bottom:6px}
.guide p{font-size:15px;color:var(--ink2);margin:0}

.promo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-bottom:40px}
.promo > div{padding:28px}
.promo .nl{background:var(--moss);color:#fff}
.promo .dir{background:var(--surface);border:1px solid var(--rule)}
.promo h2{font-size:28px;margin-bottom:8px}
.promo p{font-size:15px}
.promo .nl .btn{background:#fff;color:#182920;border-color:#fff}

/* ---------- ads ---------- */
.ad{border:1px solid var(--rule);background:var(--surface);padding:14px;position:relative}
.ad-label{display:block;font:700 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.ad h4{font:600 20px/1.2 var(--serif);margin-bottom:6px}
.ad p{font-size:14px;color:var(--ink2);margin-bottom:10px}
.ad-leaderboard{margin-bottom:40px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;padding:18px 22px}.ad-leaderboard .ad-label{flex-basis:100%}.ad-leaderboard h4{margin:0}.ad-leaderboard p{flex:1 1 260px}
.ad-leaderboard .ad-label{margin:0}
.ad-leaderboard p{margin:0}
.ad-house{background:var(--mint)}
.ad-inline{margin:26px 0}

/* ---------- section page ---------- */
.sec-head{padding-block:26px 8px;border-bottom:3px solid var(--sec,var(--ink));margin-bottom:24px}
.sec-head h1{font-size:clamp(34px,5vw,54px);color:var(--sec,var(--ink))}
.sec-head p{color:var(--muted);margin:6px 0 0}
.sec-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;padding-bottom:40px}
.rowcard{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;padding-block:18px;border-bottom:1px solid var(--rule)}
.rowcard h3{font-size:24px;line-height:1.15;margin-bottom:8px}
[lang="hi"] .rowcard h3,[lang="pa"] .rowcard h3{line-height:1.35}
.rowcard .dek{font-size:16px;color:var(--ink2);margin-bottom:8px}
.empty{padding:28px;border:1px dashed var(--rule2);color:var(--muted);text-align:center}

/* ---------- article ---------- */
.art-head{padding-block:28px 18px;max-width:900px}
.art-head h1{font-size:clamp(32px,4.6vw,56px);line-height:1.05;margin-bottom:14px}
[lang="hi"] .art-head h1,[lang="pa"] .art-head h1{line-height:1.28}
.art-head .dek{font-size:20px;color:var(--ink2);margin-bottom:16px;max-width:62ch}
.byline{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding-block:10px;font-size:14px;color:var(--muted)}
.byline strong{color:var(--ink)}
.byline a{color:var(--s-education)}
.art-grid{display:grid;grid-template-columns:minmax(0,720px) 300px;gap:48px;justify-content:space-between;padding-bottom:50px}
.art-main{min-width:0}
.art-main > figure{margin:4px 0 26px}
.body{font:400 19px/1.7 var(--serif)}
[lang="hi"] .body,[lang="pa"] .body{font-size:19px;line-height:1.85}
.body p{margin:0 0 1.1em}
.body h2{font-size:26px;margin:1.6em 0 .5em}
.body ul{padding-left:1.2em}
.body li{margin-bottom:.4em}
.body a{color:var(--s-education)}
.note{font:400 16px/1.55 var(--sans);background:var(--mint);border-left:3px solid var(--moss);padding:12px 16px}
.keydates{margin:8px 0 22px;padding:0;border-top:2px solid var(--ink);font-family:var(--sans);font-size:16px}
.keydates div{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;padding-block:9px;border-bottom:1px solid var(--rule)}
.keydates dt{font-weight:700;font-variant-numeric:tabular-nums}
.keydates dd{margin:0}
.endmatter{font:400 15px/1.55 var(--sans);margin-top:30px}
.endmatter section{border-top:1px solid var(--rule);padding-top:14px;margin-top:18px}
.endmatter h2{font:700 13px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.endmatter ol,.endmatter ul{padding-left:20px;margin:0}
.endmatter li{margin-bottom:6px}
.endmatter a{color:var(--s-education)}
.morelist{list-style:none;margin:0;padding:0}
.morelist li{border-bottom:1px solid var(--rule);padding-block:10px}
.morelist a{text-decoration:none;font:600 16px/1.3 var(--serif)}
.morelist a:hover{text-decoration:underline}

/* ---------- static / forms ---------- */
.page-grid{display:grid;grid-template-columns:minmax(0,720px) 300px;gap:48px;justify-content:space-between;padding-block:28px 50px}
.prose{font:400 18px/1.65 var(--sans)}
.prose h1{font-size:clamp(32px,4.4vw,50px);margin-bottom:14px}
.prose h2{font-size:24px;margin:1.4em 0 .4em}
.prose a{color:var(--s-education)}
.prose .dek{font-size:20px;color:var(--ink2)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
thead th{border-bottom:2px solid var(--ink);font:700 12px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tiers dt{margin-top:14px}.tiers dd{margin:4px 0 0}
.form{display:grid;gap:14px;background:var(--surface);border:1px solid var(--rule);padding:20px}
.form h2{font-size:22px;margin:0}
.field{display:grid;gap:5px;min-width:0}
.field label,.flabel{font:700 13px/1.3 var(--sans)}
.field small{color:var(--muted);font-size:13px}
input[type=text],input[type=email],input[type=url],input[type=tel],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;font:400 16px/1.4 var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--rule2);border-radius:2px;padding:9px 10px;min-width:0}
textarea{min-height:110px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.status{font-size:14px;padding:10px 12px;border-radius:2px}
.status.ok{background:var(--mint);color:var(--ok)}
.status.err{background:var(--cream);color:var(--bad)}
.status a.btn,.status a.btn:visited,.status a.btn:hover{color:#fff;text-decoration:none}
.copybox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.copybox code{background:var(--mint);padding:4px 8px;border-radius:2px;overflow-wrap:anywhere}
.dir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.dir-card{border:1px solid var(--rule);background:var(--surface);padding:16px}
.dir-card h3{font-size:20px;margin-bottom:4px}

/* ---------- footer ---------- */
.foot{background:var(--forest);color:var(--forest-ink);margin-top:20px}
.foot .wrap{padding-block:40px 26px}
.foot-grid{display:grid;grid-template-columns:1.5fr repeat(3,minmax(0,1fr));gap:30px}
.foot-brand{font:800 28px/1 var(--logo);letter-spacing:-.05em;margin-bottom:10px}
.foot-brand em{font-style:normal;color:#EF9D6D}
.foot p,.foot a,.foot li{color:var(--forest-muted);font-size:14px}
.foot h3{font:700 13px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--forest-ink);margin-bottom:10px}
.foot ul{list-style:none;margin:0;padding:0}
.foot li{margin-bottom:8px}
.foot a{text-decoration:none}
.foot a:hover{color:#fff;text-decoration:underline}
.foot-bottom{border-top:1px solid #34463c;margin-top:30px;padding-top:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--forest-muted)}

/* ---------- desk ---------- */
.desk{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.desk-side{background:var(--forest);color:var(--forest-ink);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.desk-side .brandline{font:800 20px/1 var(--logo);letter-spacing:-.04em;margin-bottom:4px}
.desk-side .brandline em{font-style:normal;color:#EF9D6D}
.desk-side small{color:var(--forest-muted);display:block;margin-bottom:18px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.desk-side nav{display:flex;flex-direction:column;gap:2px}
.desk-side a{color:var(--forest-muted);text-decoration:none;padding:7px 10px;border-radius:2px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.desk-side a:hover{color:#fff;background:#22362b}
.desk-side a[aria-current]{color:#fff;background:#2c4537}
.desk-side .cnt{font-variant-numeric:tabular-nums;background:#EF9D6D;color:#182920;border-radius:999px;padding:0 7px;font-size:12px}
.desk-side hr{border:0;border-top:1px solid #2c3f34;margin:10px 0}
.desk-main{padding:22px max(16px,env(safe-area-inset-right,0px)) 60px 28px;min-width:0}
.desk-main h1{font-size:30px;margin-bottom:4px}
.desk-sub{color:var(--muted);margin-bottom:20px;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.tile{background:var(--surface);border:1px solid var(--rule);padding:14px;text-decoration:none;display:block}
.tile b{display:block;font:600 34px/1 var(--serif);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.attn{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.panel{background:var(--surface);border:1px solid var(--rule);padding:16px;margin-bottom:18px;min-width:0}
.panel h2{font-size:20px;margin-bottom:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--rule2);background:var(--surface);border-radius:999px;padding:5px 12px;font:600 13px/1 var(--sans);cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dtable td,.dtable th{font-size:14px}
.dtable tr.click{cursor:pointer}
.dtable tr.click:hover td{background:var(--mint)}
.dtable .hl{font:600 16px/1.3 var(--serif)}
.langpills span{display:inline-block;font:700 10px/1 var(--sans);padding:3px 5px;border:1px solid var(--rule2);border-radius:2px;margin-right:3px;color:var(--muted)}
.langpills span.on{border-color:var(--ok);color:var(--ok)}
.editor{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule2);margin-bottom:12px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font:700 14px/1 var(--sans);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--saffron)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.confirm{background:var(--cream);border:1px solid var(--warn);padding:12px;margin-top:10px;font-size:14px}
.list-card{border-bottom:1px solid var(--rule);padding-block:12px;display:grid;gap:6px}
.list-card h3{font-size:18px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.preview-frame{width:100%;height:600px;border:1px solid var(--rule);background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:2px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.warnlist{margin:6px 0 0;padding-left:18px;color:var(--bad);font-size:14px}

/* ---------- responsive ---------- */
@media (max-width:1060px){
  .front,.sec-grid,.art-grid,.page-grid{grid-template-columns:minmax(0,1fr)}
  .rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .latest{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .latest article:nth-child(3){border-left:0}
  .latest article:nth-child(n+3){border-top:1px solid var(--rule)}
  .editor{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .lead-story{grid-template-columns:minmax(0,1fr)}
  .lead-pkg{grid-template-columns:minmax(0,1fr)}
  .second + .second{border-left:0;padding-left:0;border-top:1px solid var(--rule);padding-top:14px}
  .sections,.promo{grid-template-columns:minmax(0,1fr)}
  .foot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .foot-grid > div:first-child{grid-column:1/-1}
  .desk{grid-template-columns:minmax(0,1fr)}
  .desk-side{position:static;height:auto}
  .desk-side nav{flex-direction:row;flex-wrap:wrap}
  .desk-main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .ad-leaderboard{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  #app{font-size:16px}
  .brandmark{width:44px;height:44px;font-size:25px}
  .identity{gap:10px}
  .tagline{font-size:9.5px;letter-spacing:.12em}
  .edition-line{gap:12px}
  .ed-links{gap:10px}
  .ed-links a{font-size:15px}
  .ed-links a[lang="en"]{font-size:13px;letter-spacing:.12em}
  .latest{grid-template-columns:minmax(0,1fr)!important}
  .latest article + article{border-left:0;border-top:1px solid var(--rule)}
  .secblock .top,.rowcard{grid-template-columns:minmax(0,1fr)}
  .row2{grid-template-columns:minmax(0,1fr)}
  .keydates div{grid-template-columns:minmax(0,1fr);gap:2px}
  .body{font-size:18px}
  .foot-grid{grid-template-columns:minmax(0,1fr)}
  .promo > div{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* ---------- rotating hero ---------- */
.hero{grid-column:1/-1;position:relative;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.hero-track{display:grid}
.hero-slide{grid-area:1/1;border-bottom:0;padding-bottom:4px;opacity:0;visibility:hidden;transition:opacity .8s ease,visibility 0s linear .8s}
.hero-slide.is-on{opacity:1;visibility:visible;transition:opacity .8s ease,visibility 0s}
.hero-slide .media img{transform-origin:60% 40%}
.hero-slide.is-on .media img{animation:heroZoom 9s ease-out both}
.hero-slide.is-on .hero-txt>*{animation:heroRise .75s cubic-bezier(.2,.7,.2,1) both}
.hero-slide.is-on .hero-txt>*:nth-child(2){animation-delay:.08s}
.hero-slide.is-on .hero-txt>*:nth-child(3){animation-delay:.16s}
.hero-slide.is-on .hero-txt>*:nth-child(4){animation-delay:.24s}
.hero-slide.is-on .hero-txt>*:nth-child(5){animation-delay:.3s}
@keyframes heroZoom{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes heroRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero-ctl{display:flex;align-items:center;gap:8px;margin-top:6px}
.hero-btn{appearance:none;flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--rule2);background:var(--surface);color:var(--ink);display:grid;place-items:center;font:700 20px/1 var(--sans);cursor:pointer;padding:0;transition:background .2s,color .2s,border-color .2s}
.hero-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hero-pause{font-size:10px;letter-spacing:-1px}
.hero-dots{display:flex;gap:6px;flex:1;max-width:360px;margin:0 4px}
.hero-dot{appearance:none;border:0;background:none;padding:12px 0;flex:1;cursor:pointer;min-width:24px}
.hero-dot i{display:block;position:relative;height:3px;border-radius:2px;background:var(--rule2);overflow:hidden}
.hero-dot i::after{content:"";position:absolute;inset:0;background:var(--saffron);transform:scaleX(0);transform-origin:left}
.hero-dot[aria-current] i::after{animation:heroFill var(--hero-ms,7000ms) linear forwards}
.hero.paused .hero-dot[aria-current] i::after,.hero.paused .hero-slide.is-on .media img{animation-play-state:paused}
.hero.static .hero-dot[aria-current] i::after{animation:none;transform:scaleX(1)}
@keyframes heroFill{to{transform:scaleX(1)}}
@media (min-width:821px){.hero-slide>.story-link{display:block;height:100%}.hero-slide .media{aspect-ratio:auto;height:100%;min-height:300px}}
@media (prefers-reduced-motion:reduce){.hero-slide,.hero-slide.is-on{transition:none}.hero-slide.is-on .media img,.hero-slide.is-on .hero-txt>*{animation:none}.hero-dot[aria-current] i::after{animation:none;transform:scaleX(1)}}

/* ---------- share ---------- */
.share{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 4px;font:600 14px/1 var(--sans)}
.share-l{color:var(--muted);margin-right:2px}
.sh{appearance:none;display:inline-flex;align-items:center;padding:8px 12px;border:1px solid var(--rule2);border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;font:600 13px/1 var(--sans);cursor:pointer}
.sh:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sh-wa{background:#1f7a4d;border-color:#1f7a4d;color:#fff}
.sh-wa:hover{background:#155c39;border-color:#155c39;color:#fff}
.endmatter .share{margin:22px 0 0}

/* ---------- JUST IN tag ---------- */
.flash{display:inline-flex;align-items:center;gap:7px;margin:0 10px 10px 0;padding:6px 10px 6px 9px;border-radius:2px;background:var(--ink);color:#fff;font:800 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;vertical-align:middle}
.flash.is-live{background:#C8102E}
.flash i{width:7px;height:7px;border-radius:50%;background:#fff}
.flash.is-live i{animation:flashPulse 1.6s ease-out infinite}
@keyframes flashPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}100%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
[lang="hi"] .flash,[lang="pa"] .flash{letter-spacing:.02em;text-transform:none;font-size:13px}
@media (prefers-reduced-motion:reduce){.flash.is-live i{animation:none}}

/* ---------- key dates: moving ticker ---------- */
.ticker-in{overflow:hidden;gap:0}
.ticker-l{display:inline-flex;align-items:center;gap:8px;flex:none;padding-right:16px;margin-right:2px;border-right:1px solid var(--rule);background:var(--surface);position:relative;z-index:1}
.ticker-l i{width:7px;height:7px;border-radius:50%;background:var(--saffron);animation:kdPulse 2s ease-out infinite}
@keyframes kdPulse{0%{box-shadow:0 0 0 0 rgba(189,81,37,.55)}100%{box-shadow:0 0 0 7px rgba(189,81,37,0)}}
.ticker-vp{flex:1;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22px,#000 calc(100% - 44px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 22px,#000 calc(100% - 44px),transparent 100%)}
.ticker-track{display:flex;width:max-content}
.ticker-track.run{animation:kdRun 40s linear infinite}
.ticker-vp:hover .ticker-track,.ticker-vp:focus-within .ticker-track{animation-play-state:paused}
.ticker-set{display:flex;align-items:center;gap:18px;padding-left:18px}
@keyframes kdRun{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.due{display:inline-flex;align-items:center;margin-right:7px;padding:3px 7px;border-radius:2px;background:var(--ink);color:#fff;font:800 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;vertical-align:1px}
.due.is-today{background:#C8102E}
.due.is-soon{background:var(--saffron)}
[lang="hi"] .due,[lang="pa"] .due{letter-spacing:.02em;text-transform:none;font-size:12px}
.dl-t{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.dl-t .due{margin:0;background:transparent;color:var(--muted);padding:0;letter-spacing:.06em}
.dl-t .due.is-today{background:#C8102E;color:#fff;padding:3px 7px}
.dl-t .due.is-soon{background:transparent;color:var(--saffron)}
.datelist li{animation:kdIn .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes kdIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .ticker-track.run{animation:none}
  .ticker-set[aria-hidden]{display:none}
  .ticker-vp{overflow-x:auto;scrollbar-width:none;-webkit-mask-image:none;mask-image:none}
  .ticker-l i,.datelist li{animation:none}
}

/* ---------- sport section + upcoming matches ---------- */
:root{--s-sport:#1D5FB4}
.fixtures{border-top-color:var(--s-sport)}
.fixtures h2{display:flex;align-items:center;gap:8px}
.fixtures h2::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--s-sport)}
.fx{list-style:none;margin:0;padding:0}
.fx li{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;align-items:start;padding-block:10px;border-bottom:1px solid var(--rule);animation:kdIn .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
.fx .rd-m{color:var(--s-sport)}
.fx-t{display:flex;flex-direction:column;gap:3px;min-width:0}
.fx-c{font:700 11px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fx-c b{margin-left:6px;padding:2px 6px;border-radius:2px;background:var(--s-sport);color:#fff;font-weight:800;letter-spacing:.06em}
[lang="hi"] .fx-c,[lang="pa"] .fx-c{text-transform:none;letter-spacing:0;font-size:12px}
.fx-t strong,.fx-t a{font:600 15px/1.3 var(--sans);color:var(--ink);text-decoration:none}
.fx-t a:hover{color:var(--s-sport);text-decoration:underline}
.fx-v{font-size:13.5px;color:var(--muted)}
.fx-t .due{align-self:flex-start;margin:2px 0 0}
.fx-note{margin:10px 0 0;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.fx li{animation:none}}

/* ---------- sport: scores ticker ---------- */
.ticker-scores .ticker-l{color:var(--s-sport)}
.ticker-scores .ticker-l i{background:var(--s-sport);animation:none}
.ticker-scores .ticker-l.is-live{color:#C8102E}
.ticker-scores .ticker-l.is-live i{background:#C8102E;animation:scPulse 1.6s ease-out infinite}
@keyframes scPulse{0%{box-shadow:0 0 0 0 rgba(200,16,46,.55)}100%{box-shadow:0 0 0 7px rgba(200,16,46,0)}}
.sc{display:inline-flex;align-items:center;gap:7px;text-decoration:none}
.sc .d{font-weight:700;color:var(--s-sport)}
.sc-live{padding:3px 7px;border-radius:2px;background:#C8102E;color:#fff;font:800 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}
[lang="hi"] .sc-live,[lang="pa"] .sc-live{letter-spacing:.02em;text-transform:none;font-size:12px}
.sc-upd{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){.ticker-scores .ticker-l.is-live i{animation:none}}

/* ---------- directory: featured listings ---------- */
.dir-card.is-featured{border-color:var(--saffron);box-shadow:inset 0 3px 0 var(--saffron)}

/* ---------- free-subscribe nudge (public site only) ---------- */
.nudge{position:fixed;right:20px;bottom:20px;z-index:60;width:360px;max-width:calc(100vw - 32px);background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-top:3px solid var(--saffron);border-radius:4px;box-shadow:0 14px 40px rgba(24,31,28,.18),0 2px 6px rgba(24,31,28,.08);padding:18px 18px 16px;font:400 15px/1.45 var(--sans);transform:translateY(16px);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s ease}
.nudge.is-on{transform:none;opacity:1}
.nudge-x{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;border-radius:50%}
.nudge-x:hover{background:var(--mint);color:var(--ink)}
.nudge-k{display:flex;align-items:center;gap:8px;font:800 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--saffron);margin:0 0 8px}
.nudge-k i{font:700 13px/1 var(--logo);font-style:normal;text-transform:none;width:22px;height:22px;border:2px solid var(--saffron);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);letter-spacing:0;padding-bottom:2px}
.nudge h2{font:700 21px/1.2 var(--serif);margin:0 30px 6px 0;letter-spacing:-.2px}
.nudge p{margin:0 0 12px;color:var(--ink2);font-size:14.5px}
.nudge-row{display:flex;gap:8px}
.nudge-row input{flex:1;min-width:0;font:400 16px/1.2 var(--sans);padding:10px 12px;border:1px solid var(--rule2);border-radius:2px;background:#fff;color:var(--ink)}
.nudge-row input:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
.nudge-row .btn{background:var(--saffron);border-color:var(--saffron);color:#fff;white-space:nowrap}
.nudge-fine{margin:9px 0 0;font-size:12px;line-height:1.4;color:var(--muted)}
.nudge .out:empty{display:none}
.nudge .out{margin-top:8px}
.nudge.done .nudge-row,.nudge.done .nudge-fine,.nudge.done p{display:none}
@media (max-width:560px){.nudge{right:10px;left:10px;bottom:10px;width:auto;max-width:none;padding:14px 14px 12px}.nudge h2{font-size:18px;margin-bottom:10px}.nudge p:not(.nudge-fine){display:none}.nudge-k{margin-bottom:6px}.nudge-fine{font-size:11.5px;margin-top:7px}.nudge-x{top:4px;right:4px}}

</style><script id="snapshot" type="application/json">{"ads": [], "articles": [{"approvedAt": "2026-11-11T09:03:00Z", "approvedBy": "publisher", "byline": "The Melbourne Indian newsroom", "created": "2026-11-11T09:10:00Z", "date": "2026-11-11", "en": {"body": ["The Victorian Liberal Party has withdrawn its endorsement of Paul Lindemann, its candidate for the Labor-held seat of Williamstown in Melbourne's west, over comments about Indigenous Australians that came to light on Wednesday.", "In a statement, the party said the views Mr Lindemann had expressed were \"offensive, unacceptable and inconsistent with the values and standards expected of Liberal candidates\", the ABC reported. It said all candidates were expected to treat Australians with dignity and respect, that Mr Lindemann's comments \"fell short of that standard\", and that it had not previously been aware of them.", "The Age reported that the comments were posted from an anonymous Facebook account, named after Mr Lindemann's yacht, that it linked to him. It reported that in posts about the proposed Voice to Parliament, the account described Indigenous Australians as \"never civilised\".", {"h": "A junior basketball suspension"}, "Earlier on Wednesday, Sport Minister Steve Dimopoulos called on Opposition Leader Jess Wilson to drop Mr Lindemann over his conduct as a junior basketball coach, the ABC reported.", "Mr Lindemann was suspended for six weeks last year for bringing the game into disrepute after an under-14 girls' game, The Age and 7NEWS reported. He told The Age he had acted on his \"first instinct\" to protect a player. In a statement, he apologised and said he should have \"handled the situation differently\", according to the ABC.", {"h": "Still on the ballot"}, "Nominations for the 28 November election have closed, so Mr Lindemann's name will stay on the Williamstown ballot paper, The Age reported.", "Labor has held Williamstown for all but four years since 1889. Jobs Minister Melissa Horne has held the seat since 2018, and kept it at the last election with a two-party-preferred margin of 13.4 per cent, The Age reported.", "The decision came a day after One Nation dropped its Preston candidate, Franco Guardiani, over social media posts praising Adolf Hitler.", {"note": "A full list of candidates for every district is on the VEC website. If you see hateful content aimed at a community, Victoria's anti-vilification laws explain how to report it."}], "dek": "The party says it was not aware of the comments before. Nominations have closed, so he will still appear on ballot papers in the Labor-held seat.", "headline": "Liberals drop Williamstown candidate Paul Lindemann over comments about Indigenous Australians, but his name stays on the ballot"}, "figure": {"en": "days until Victorians vote, on 28 November", "value": "17"}, "image": {"addedAt": "2026-11-11T09:10:00Z", "addedBy": "claude", "alt": {"en": "Williamstown Town Hall, a two-storey building with arched windows and an Australian flag, behind a trimmed hedge."}, "caption": {"en": "Williamstown Town Hall on Ferguson Street. The seat of Williamstown takes in the suburbs around Melbourne's western bayside."}, "credit": "Melburnian", "file": "images/williamstown-town-hall.jpg", "licence": "CC BY 3.0", "og": "og/williamstown-town-hall.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Williamstown_Town_Hall.jpg", "srcset": "img/williamstown-town-hall-800.webp 800w, img/williamstown-town-hall-1280.webp 1280w", "url": "img/williamstown-town-hall-1280.webp"}, "priority": 8, "risk": "amber", "section": "civic", "slug": "liberals-drop-williamstown-candidate-paul-lindemann", "sources": [{"checked": "2026-11-11", "title": "ABC News: Victorian Liberals dump Williamstown candidate Paul Lindemann over offensive comments (11 Nov 2026, 7:23pm)", "url": "https://www.abc.net.au/news/2026-11-11/victorian-liberals-dump-williamstown-candidate-paul-lindemann/107375112"}, {"checked": "2026-11-11", "title": "The Age, via Head Topics: Liberal candidate Paul Lindemann removed over racist Facebook posts (11 Nov 2026)", "url": "https://au.headtopics.com/news/liberal-candidate-paul-lindemann-removed-over-racist-89745762"}, {"checked": "2026-11-11", "title": "7NEWS, via Head Topics: Liberal candidate under scrutiny over abuse of teen basketball player (11 Nov 2026)", "url": "https://au.headtopics.com/news/liberal-candidate-under-scrutiny-over-abuse-of-teen-89745787"}, {"checked": "2026-11-11", "title": "7NEWS Melbourne on X: Liberal Party withdraws endorsement for Williamstown candidate (11 Nov 2026)", "url": "https://x.com/7NewsMelbourne/status/2120423285133378016"}], "status": "published", "type": "news", "updated": "2026-11-11T09:10:00Z"}, {"approvedAt": "2026-11-08T20:06:27Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["People applying for an Australian visa in India may now be asked to provide biometrics, meaning fingerprints and a facial image, as part of the application. The Australian High Commission in New Delhi announced the change from 26 October 2026.", "The High Commission says India is one of nearly 60 countries where Australia is expanding biometric collection. The rule applies only to new applications lodged from 26 October; applications already submitted are not affected.", "This matters for Melbourne families sponsoring or inviting parents, relatives and friends from India, such as for visitor visas.", {"h": "How it works"}, {"ul": ["The Department of Home Affairs tells each applicant whether they need to provide biometrics, with instructions.", "Depending on their circumstances, applicants may be asked to attend an Australian Biometrics Collection Centre in person.", "Eligible applicants who have given biometrics at a collection centre before and hold a valid passport may be able to use the Australian Immi App instead, at no cost.", "The High Commission says visa processing times are not expected to be affected."]}, "The announcement does not list which visa types or age groups are covered. Applicants should follow the instructions they receive from Home Affairs.", {"note": "This is general information, not migration advice. Check the Department of Home Affairs biometrics page or speak to a registered migration agent about your situation."}], "dek": "Since 26 October, people applying for an Australian visa in India may be asked for fingerprints and a facial image. The Australian High Commission says applications lodged before that date are not affected.", "headline": "Family visiting from India? Visa applicants there may now need to give fingerprints"}, "figure": {"en": "biometrics may be required for visa applicants in India", "value": "26 Oct"}, "image": {"addedAt": "2026-11-08T20:13:38Z", "addedBy": "claude", "alt": {"en": "An illuminated 'MELBOURNE' sign set into a timber-slat wall in Melbourne Airport's international arrivals hall, above a glass balustrade and polished floor."}, "caption": {"en": "The international arrivals hall at Melbourne Airport's Terminal 2."}, "credit": "MDRX", "file": "images/melbourne-airport-t2-international-arrivals.jpg", "licence": "CC BY-SA 4.0", "og": "og/melbourne-airport-t2-international-arrivals.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Melbourne_Airport_Terminal_2_(inside)_International_Arrivals_2022-02-06.jpg", "srcset": "img/melbourne-airport-t2-international-arrivals-800.webp 800w, img/melbourne-airport-t2-international-arrivals-1600.webp 1600w", "url": "img/melbourne-airport-t2-international-arrivals-1600.webp"}, "priority": 6, "risk": "amber", "section": "india", "slug": "australia-visa-biometrics-india-2026", "sources": [{"checked": "2026-11-08", "title": "Australian High Commission, New Delhi: Australia expands biometric collection requirements for visa applicants in India", "url": "https://india.highcommission.gov.au/ndli/vm_Biometric_collection_requirements_for_Australia_visa_applicants_in_India.html"}, {"checked": "2026-11-08", "title": "Department of Home Affairs: Biometrics", "url": "https://immi.homeaffairs.gov.au/help-support/meeting-our-requirements/biometrics"}, {"checked": "2026-11-08", "title": "Department of Home Affairs: Australian Immi App", "url": "https://immi.homeaffairs.gov.au/supporting/Pages/australian-immi-app.aspx"}], "status": "published", "type": "news", "updated": "2026-11-08T20:13:38Z"}, {"approvedAt": "2026-11-09T00:38:30Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "created": "2026-11-09T00:38:30Z", "date": "2026-11-09", "en": {"body": ["The royal commission into corruption on Victoria's major infrastructure projects has heard that a two-day union stoppage at a Sunbury level crossing site in 2022 pushed up the project's costs by an estimated $6 million, and that the state paid for it.", "\"Practically speaking, every dollar spent at Gap Road was paid first by the state,\" counsel assisting Chris Young KC told the hearing in Collingwood on Monday, according to ABC News coverage. The first witnesses are due to give evidence from today, Tuesday 10 November.", {"note": "Allegations aired at a royal commission are not proven. Mr Young said some of them have been denied. The commission has made no findings."}, {"h": "What the commission heard on day one"}, "Mr Young said union officials repeatedly ordered work to stop on 6 and 7 June 2022, during a shutdown of the Sunbury line for critical works. Work resumed that evening after a meeting at the CFMEU's offices, without the safety issues that had been cited being fixed, he said. Union-backed health and safety representatives were appointed shortly afterwards.", "A labour-hire firm engaged on the site in June 2022 went from two workers to 20 and billed about $1.2 million by September, the commission heard. That firm's licence has since been cancelled. CFMEU officials visited the site 34 times in a year, while WorkSafe inspectors recorded no breaches, Mr Young said.", "The project's target cost rose from $110 million to $116 million after the stoppage. It was delivered for $104 million, which Mr Young said meant the alliance building it collected about $2 million in extra profit under its contract. He said other contractors had described \"remarkably similar\" experiences on other major projects, including North East Link, and that some agencies had been slow to hand over documents.", "The hearing was also read a 2017 memo by contractor John Holland which said the CFMEU had \"unprecedented access to ministers\" and would probably know about government tenders before they were announced. Notes from a contractors' meeting recorded a threat that workers would be \"smashed\" if they turned up. Police and WorkSafe were notified, the commission heard, but no action was taken. These are claims recorded in documents, not findings.", {"h": "What the Premier said"}, "Premier Ben Carroll denied knowing about the CFMEU's access to senior officials and ministers. \"What today's hearings show is that I am a premier that will make the tough decisions,\" he said. He also confirmed the state would pay for lawyers for former premiers Jacinta Allan and Daniel Andrews at the inquiry. \"I want to make sure Victorians get the answers they deserve,\" he said.", {"h": "What the commission will look at"}, "Mr Young set out themes the inquiry expects to explore. They include allegations that the union placed unelected delegates on sites as health and safety representatives, sometimes through labour-hire companies, and that contractors were often left to deal with disruption themselves by \"buying peace\" and pricing its cost into their bids. He said those costs were shared with the state or passed on to it.", "He tendered a June 2023 briefing to Jacinta Allan, then the transport infrastructure minister, which raised concerns including pressure on contractors, excess staffing on sites, a rise in full-time union delegates and threats of unprotected industrial action. The briefing records concerns raised at the time and is not a finding. AAP has reported that Ms Allan, who later became premier, will be required to give evidence, but it is not yet known when.", "Later hearing blocks will examine alleged links between organised crime and the construction industry, and how government money was allocated and projects chosen.", "Mr Young also warned that threatening or punishing a witness is a serious offence, and said any reported threat would be referred to Victoria Police.", {"h": "About the inquiry"}, "The Royal Commission into the Integrity of Major Public and Civil Infrastructure Construction Projects in Victoria was established on 20 August 2026. It is led by the Honourable Christopher Kourakis AC, a former chief justice of South Australia, and its final report is due by 20 August 2027.", "Premier Ben Carroll called the inquiry as his first act after replacing Ms Allan, who had resisted calls from across the parliament for a royal commission. The calls followed reporting by Nine newspapers in 2024 alleging corruption and criminal infiltration of the CFMEU and Big Build sites. Parts of the union were placed into administration by the federal government in August 2024.", "A report for the union's administrators by barrister Geoffrey Watson SC estimated that alleged corrupt conduct had effectively cost Victorian taxpayers $15 billion. That figure is Mr Watson's estimate, and testing claims like it is part of the commission's work.", {"h": "Hearings during the campaign"}, "This block of hearings runs until Friday 20 November, overlapping with early voting, which opens on Wednesday 18 November. Polling day is Saturday 28 November. A second block of hearings is expected before the end of the year, ABC News has reported.", "ABC News has reported that the hearings will run through about two weeks of the four-week campaign. Mr Carroll has said that \"integrity is not negotiable\".", {"h": "How to watch or attend"}, {"dl": [["Where", "Level 9, 54 Wellington Street, Collingwood"], ["When", "9 to 20 November, usually from 10am. The lobby opens at 9.15am"], ["Entry", "Open to the public, with security screening. Allow extra time"], ["Online", "Hearings are livestreamed and transcripts are published at rcimcp.vic.gov.au"]]}, "The commission also takes submissions from anyone with information relevant to its terms of reference, through its website."], "dek": "The royal commission's first day laid out how a two-day stoppage at Gap Road played out. The first witnesses are due to give evidence today. None of the allegations has been tested.", "headline": "Big Build inquiry: union stoppage added $6m to Sunbury rail job, and 'every dollar' was paid first by the state, counsel says"}, "featured": false, "figure": {"en": "added to the Gap Road job after the stoppage, the inquiry heard", "value": "$6m"}, "image": {"addedAt": "2026-11-09T00:44:15Z", "addedBy": "claude", "alt": {"en": "A blue and grey high-capacity Metro train showing Flinders Street as its destination waits at Sunbury station, beneath a footbridge, on an overcast morning."}, "caption": {"en": "A high-capacity train at Sunbury station on 30 October 2023, the first day these trains ran passenger services on the Sunbury line. The royal commission's first hearings are examining works on the line's upgrade at Gap Road, Sunbury."}, "credit": "Wongm", "file": "images/hcmt-set-37-sunbury-station.jpg", "licence": "CC BY-SA 4.0", "og": "og/hcmt-set-37-sunbury-station.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:HCMT_set_37_Sunbury_station.jpg", "srcset": "img/hcmt-set-37-sunbury-station-800.webp 800w, img/hcmt-set-37-sunbury-station-1600.webp 1600w", "url": "img/hcmt-set-37-sunbury-station-1600.webp"}, "priority": 7, "risk": "amber", "section": "civic", "slug": "big-build-royal-commission-hearings-begin", "sources": [{"checked": "2026-11-10", "title": "ABC News: CFMEU's 'unprecedented' political links aired at Victoria's Big Build hearing — as it happened (9 Nov 2026)", "url": "https://www.abc.net.au/news/2026-11-09/vic-election-blog-big-build-royal-commission/107357514"}, {"checked": "2026-11-09", "title": "Royal Commission into the Integrity of Major Public and Civil Infrastructure Construction Projects in Victoria", "url": "https://www.rcimcp.vic.gov.au/"}, {"checked": "2026-11-09", "title": "Royal commission: Hearings (dates, venue, attendance)", "url": "https://www.rcimcp.vic.gov.au/hearings"}, {"checked": "2026-11-09", "title": "ABC News: Big Build royal commission hears CFMEU influence was 'unprecedented' (9 Nov 2026)", "url": "https://www.abc.net.au/news/2026-11-09/victoria-big-build-royal-commission-hears-cfmeu-influence/107364446"}, {"checked": "2026-11-09", "title": "ABC News: What to expect from Victoria's construction corruption royal commission", "url": "https://www.abc.net.au/news/2026-11-09/victoria-big-build-construction-royal-commission-explainer/107352214"}, {"checked": "2026-11-09", "title": "AAP via Braidwood Times: Big build inquiry resumes weeks before election day", "url": "https://www.braidwoodtimes.com.au/story/9387833/big-build-inquiry-resumes-weeks-before-election-day/"}, {"checked": "2026-11-09", "title": "ABC News: Election campaign will play out with a corruption royal commission in full swing (8 Nov 2026)", "url": "https://www.abc.net.au/news/2026-11-08/labor-royal-commission-ben-carroll-vic-election-campaign/107351126"}], "status": "published", "type": "news", "updated": "2026-11-09T20:25:00Z"}, {"approvedAt": "2026-11-10T05:21:00Z", "approvedBy": "publisher (via Claude, chat instruction 10 Nov)", "byline": "The Melbourne Indian newsroom", "created": "2026-11-10T05:10:00Z", "date": "2026-11-10", "en": {"body": ["Two days into its first public hearings, Victoria's royal commission into corruption on major construction projects has looked at just one job: the removal of a level crossing at Gap Road, Sunbury, in 2022. But the documents and evidence aired in a Collingwood hearing room this week reach well beyond one rail bridge, to the questions of how much power the CFMEU held on Big Build sites, what that cost taxpayers, and how much the state knew.", "None of it has been tested. The commission has made no findings, some of the allegations have been denied, and the union is represented at the hearing and has questioned witnesses. This block of hearings runs until Friday 20 November, two days after early voting opens, so the first early voters will cast their ballots while evidence is still being heard, and long before any findings are made.", {"note": "Allegations and evidence at a royal commission are not proven. Documents read at the hearing record what their authors believed at the time. The commission's final report is not due until August 2027."}, {"h": "Five things the commission has heard"}, {"ul": ["One job, two days, $6 million. Counsel assisting Chris Young KC said a stoppage on 6 and 7 June 2022 pushed Gap Road's target cost from $110 million to $116 million, and that \"every dollar\" spent on the site was paid first by the state, according to ABC News. The project was eventually delivered for $104 million, which he said meant the alliance building it collected about $2 million in extra profit under its contract.", "A worker says he 'had to' join. Crane operator Glenn Tyrrell, the site's elected health and safety representative, told the commission that union organisers would \"come on site and literally stop the whole job\", ABC News reported. He said about 15 casual workers were later called into a lunch room, told to move to a different labour-hire firm and told they had to join the CFMEU. He said he paid $590 up front for six months of union fees, the first time he had joined any union.", "Safety was the stated reason, and the supervisor disputes it. John Holland site supervisor Robert Van Den Tol, giving evidence by video, said he had always considered the site safe and rejected the union's claim of a risk-assessment problem with piling work: \"if I had seen it, I would have stopped it,\" he said, according to ABC News. He said he believed the union was targeting the project because it was the last crew in Melbourne without a union-affiliated safety representative. Under questioning from the CFMEU's lawyer, he agreed that a WorkSafe note about protection around deep holes appeared to be a valid complaint, NCA NewsWire reported.", "The costs spread beyond one site. AAP reported that the site's traffic-control contractor was replaced four days after a closed-door meeting during the stoppage. The Guardian reported counsel as saying traffic controllers' rates rose from about $45 to $88 an hour, and that a government briefing to Jacinta Allan, then the minister responsible, estimated the union's campaign over traffic-management pay would add $60 million to $78 million to current projects and well over $400 million to projects being planned.", "The paper trail reaches government. Internal documents from the contractor John Holland, read at the hearing, described the CFMEU as having \"unprecedented access to ministers\" and \"a significant level of influence within the state government\", AAP and The Guardian reported. These are a contractor's views, not findings. Counsel also tendered a June 2023 briefing to Ms Allan that raised concerns about pressure on contractors, excess staffing and a rise in full-time union delegates."]}, {"h": "Gap Road, June 2022: the timeline so far"}, {"dl": [["25-31 May", "The CFMEU issues eight safety notices to John Holland, ABC News reported. A further 23 notices follow on 1 and 2 June."], ["Early June", "The project enters a planned 30-day shutdown of the Sunbury line."], ["6 June", "Union officials stop work on the site."], ["7 June", "A meeting is held at the CFMEU's offices. Work resumes afterwards, without the safety issues that had been cited being fixed, counsel said."], ["Days later", "The traffic-control contractor is replaced (AAP). About a week after the stoppage, casual workers are told to change labour-hire firm and join the union (Mr Tyrrell's evidence)."], ["2023", "Works are completed. The project comes in at $104 million against a revised target of $116 million."]]}, {"h": "What the union and the politicians say"}, "The CFMEU's construction division has been in administration since the federal government intervened in August 2024. Its lawyers have cross-examined witnesses this week, but none of the reports we read carried a public response from the union or its administrators to the evidence. Administrator Michael Crosby has previously said developers, head contractors, subcontractors and labour-hire operators should also be called, ABC News reported.", "The commission's own terms of reference exclude lawful industrial action and lawful actions under workplace safety laws. The question for the commissioner is whether conduct went beyond what the law allows.", "Premier Ben Carroll, who announced the inquiry on the day he replaced Ms Allan as Labor leader in July, has said Victorians \"deserve answers\". His government is paying for lawyers for Ms Allan and former premier Daniel Andrews. Liberal leader Jess Wilson said that \"doesn't pass the pub test\", The Guardian reported.", "Lawyers for Ms Allan and Mr Andrews attended Monday's hearing, and both are open to being called to give evidence, AAP reported. Counsel assisting has said notices will be issued to each person named in the 2023 briefing \"in due course\", The Nightly reported. No date has been announced.", {"h": "The questions still to be answered"}, {"ul": ["How much did the state know? \"We will examine how much the state knew and what it didn't,\" Commissioner Christopher Kourakis said on Monday, according to AAP.", "Was Gap Road typical? Counsel said other contractors had described \"remarkably similar\" experiences on other major projects, including North East Link, ABC News reported.", "Where does organised crime fit in? Counsel said apparently legitimate businesses had paid people linked to organised crime for services that appeared to involve \"little more than intimidation and menace\", AAP reported. Later hearing blocks will examine those links, and how government money was allocated and projects chosen.", "Is anyone holding back? Counsel said some parties had not complied with notices to produce documents, in some cases citing government policy, The Guardian reported. He also said about half of the companies invited to make voluntary submissions had not responded, NCA NewsWire reported.", "What did it all cost? A report for the union's administrators by barrister Geoffrey Watson SC estimated that alleged corrupt conduct had effectively cost Victorian taxpayers $15 billion. That is his estimate, and testing claims like it is part of the commission's job."]}, {"h": "The inquiry by the numbers"}, {"dl": [["110,688", "documents received (commission figures, 6 November)"], ["121", "notices to produce issued"], ["24", "hearings held before this week, mostly behind closed doors"], ["20", "witnesses compelled to appear in the November hearings, counsel said"], ["$50 million", "the commission's budget, as reported by AAP"], ["20 Aug 2027", "final report due"]]}, {"h": "What happens next"}, {"dl": [["To Fri 20 Nov", "First block of public hearings on Gap Road, Level 9, 54 Wellington Street, Collingwood, from 10am. Livestreamed at rcimcp.vic.gov.au"], ["Wed 18 Nov", "Early voting opens for the state election"], ["Sat 28 Nov", "Election day"], ["Before the end of 2026", "A second block of hearings is expected, ABC News has reported"], ["By 20 Aug 2027", "The commissioner's final report to the government"]]}, "The commission has not yet published a witness list or transcripts for this block. It says both will be posted on its website as soon as practicable.", {"h": "If you worked on a Big Build site"}, {"ul": ["Anyone can make a submission through the commission's website. You can ask for it to be anonymous, or for all or part of it to be kept confidential.", "If you do not want to make a formal submission, the commission's tip-off line is 1800 965 936. Tip-offs are not published and can be anonymous.", "For help in your language, or other assistance making a submission, email enquiries@rcimcp.vic.gov.au.", "If you suspect a crime, contact Crime Stoppers Victoria on 1800 333 000. The commission says a submission does not replace reporting to police.", "Counsel assisting has warned that threatening or punishing a witness is a serious offence, and that any reported threat will be referred to Victoria Police."]}, {"note": "This is general information from the royal commission's website, not legal advice. Our earlier report on day one of the hearings is in the Civic section."}], "dek": "A $6 million stoppage, a rail site taken over and contractor memos about union access to ministers. Here is what the royal commission has heard so far, what is disputed, and what still has to be answered.", "headline": "Inside the Big Build inquiry: what two days of hearings have revealed, and what comes before Victorians vote"}, "featured": false, "figure": {"en": "documents handed to the Big Build royal commission so far", "value": "110,688"}, "image": {"addedAt": "2026-11-10T05:37:58Z", "addedBy": "claude (photo supplied by the publisher)", "alt": {"en": "A newly built, partly finished railway platform at Rosanna station, with blue construction hoardings and concrete barriers along one side, overhead wires above the tracks, and a few people waiting on the platforms under a cloudy sky."}, "caption": {"en": "Rosanna station, in Melbourne's north-east, reopened but still partly built during level crossing removal works in June 2018. The photo is illustrative and does not show the Gap Road project examined by the royal commission."}, "credit": "Philip Mallis", "file": "images/rosanna-railway-station-melbourne-platform-during-level-crossing-removal-june-20.jpg", "licence": "CC BY-SA 2.0", "og": "og/rosanna-railway-station-melbourne-platform-during-level-crossing-removal-june-20.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Rosanna_railway_station_Melbourne_platform_during_level_crossing_removal,_June_2018.jpg", "srcset": "img/rosanna-railway-station-melbourne-platform-during-level-crossing-removal-june-20-800.webp 800w, img/rosanna-railway-station-melbourne-platform-during-level-crossing-removal-june-20-1600.webp 1600w", "url": "img/rosanna-railway-station-melbourne-platform-during-level-crossing-removal-june-20-1600.webp"}, "priority": 8, "risk": "amber", "section": "civic", "slug": "big-build-royal-commission-what-we-know-so-far", "sources": [{"checked": "2026-11-10", "title": "Royal Commission into the Integrity of Major Public and Civil Infrastructure Construction Projects in Victoria (home page, fast facts)", "url": "https://www.rcimcp.vic.gov.au/"}, {"checked": "2026-11-10", "title": "Royal commission: Hearing block 1, 9-20 November 2026 (Gap Road)", "url": "https://www.rcimcp.vic.gov.au/hearing-block-1-9-20-november-2026"}, {"checked": "2026-11-10", "title": "Royal commission: About us and terms of reference", "url": "https://www.rcimcp.vic.gov.au/about-us"}, {"checked": "2026-11-10", "title": "Royal commission: Submissions and tip-offs", "url": "https://www.rcimcp.vic.gov.au/submissions"}, {"checked": "2026-11-10", "title": "ABC News: Big Build royal commission hears CFMEU stopped work on rail project dozens of times (Melissa Brown, 10 Nov 2026)", "url": "https://www.abc.net.au/news/2026-11-10/royal-commission-cfmeu-vic-big-build-day-two/107368012"}, {"checked": "2026-11-10", "title": "ABC News: CFMEU's 'unprecedented' political links aired at Victoria's Big Build hearing, as it happened (9 Nov 2026)", "url": "https://www.abc.net.au/news/2026-11-09/vic-election-blog-big-build-royal-commission/107357514"}, {"checked": "2026-11-10", "title": "ABC News: Victoria's Big Build royal commission explained (Judd Boaz, 9 Nov 2 he Melbourne Indian newsroom", "created": "2026-11-09T04:02:29Z", "date": "2026-11-09", "en": {"body": ["Cricket fans in Melbourne won't need to set an alarm for India's biggest Test series of the season. All five Tests of the 2027 Border-Gavaskar Trophy are scheduled to start at 3pm Melbourne time, according to Cricket Australia, so each day's play runs from mid-afternoon into the evening.", {"h": "The schedule"}, {"dl": [["Thu 21 to Mon 25 Jan", "First Test, VCA Stadium, Nagpur"], ["Fri 29 Jan to Tue 2 Feb", "Second Test, MA Chidambaram Stadium, Chennai"], ["Thu 11 to Mon 15 Feb", "Third Test, ACA Stadium, Guwahati"], ["Fri 19 to Tue 23 Feb", "Fourth Test, JSCA International Stadium, Ranchi"], ["Sat 27 Feb to Wed 3 Mar", "Fifth Test, Narendra Modi Stadium, Ahmedabad"]]}, {"h": "No Tests in Mumbai, Kolkata or Bengaluru"}, "India's cricket board announced the venues in March. None of the five Tests is in Kolkata, Mumbai or Bengaluru, three established Test grounds that have long drawn big crowds, AAP reported.", "Guwahati's stadium staged its first Test in November 2025, against South Africa. Ahmedabad, which hosts the final Test, has become India's ground of choice for major matches, including the 2023 ODI World Cup final and the 2026 T20 World Cup final.", "Australia arrive as holders, after winning the last series 3-1 at home.", {"h": "How the teams get there"}, "India's home summer leads into the series: three ODIs and three T20 Internationals against Sri Lanka from 13 to 27 December, and three ODIs against Zimbabwe from 3 to 9 January.", "Australia have a busy run beforehand, with a four-Test home series against New Zealand that includes the Boxing Day Test at the MCG from 26 December.", {"note": "Dates and times come from Cricket Australia's published schedule and can change. We will update this story if they do."}], "dek": "Five Tests in Nagpur, Chennai, Guwahati, Ranchi and Ahmedabad from 21 January, with Australia defending the trophy they won 3-1 at home.", "headline": "India v Australia: the 2027 Border-Gavaskar Trophy will start at 3pm Melbourne time"}, "figure": {"en": "Melbourne start time for each Test", "value": "3pm"}, "image": {"addedAt": "2026-11-09T06:13:29Z", "addedBy": "claude", "alt": {"en": "Wide view from the upper stands of the Narendra Modi Stadium in Ahmedabad, with orange and blue seats around a green field and the pitch in the centre."}, "caption": {"en": "The Narendra Modi Stadium in Ahmedabad, which will host the fifth and final Test from 27 February."}, "credit": "A Cricket Premi", "file": "images/narendra-modi-stadium-view-from-the-gallery.jpg", "licence": "CC BY-SA 4.0", "og": "og/narendra-modi-stadium-view-from-the-gallery.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Narendra_Modi_Stadium_view_from_the_gallery.jpg", "srcset": "img/narendra-modi-stadium-view-from-the-gallery-800.webp 800w, img/narendra-modi-stadium-view-from-the-gallery-1600.webp 1600w", "url": "img/narendra-modi-stadium-view-from-the-gallery-1600.webp"}, "priority": 5, "risk": "green", "section": "sport", "slug": "border-gavaskar-trophy-2027-schedule", "sources": [{"checked": "2026-11-09", "title": "Cricket Australia: Border-Gavaskar Trophy 2027 schedule and venues", "url": "https://www.cricket.com.au/news/4476875/australia-v-india-test-series-border-gavaskar-trophy-2027-schedule-venues-revealed"}, {"checked": "2026-11-09", "title": "AAP via Northern Daily Leader: India snub traditional venues for Border-Gavaskar Tests", "url": "https://www.northerndailyleader.com.au/story/9208511/india-snub-traditional-venues-for-border-gavaskar-tests"}, {"checked": "2026-11-09", "title": "Deccan Herald: India's 2026-27 home schedule", "url": "https://www.deccanherald.com/sports/cricket/team-indias-home-schedule-for-2026-27-announced-check-full-list-of-matches-dates-and-venues-here-3945277"}, {"checked": "2026-11-09", "title": "Cricket Australia: 2026-27 schedule", "url": "https://www.cricket.com.au/news/4425772/mark-your-calendar-2026-australia-cricket-schedule-fixtures-dates-tours-wtc-top-end-tests-south-africa-bangladesh-new-zealand-england-india-t20-world-cup"}], "status": "published", "type": "news", "updated": "2026-11-09T06:13:29Z"}, {"approvedAt": "2026-11-09T06:30:58Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "created": "2026-11-09T06:30:58Z", "date": "2026-11-09", "en": {"body": ["Judges would have to treat an attack on someone who steps in to help another person as an aggravating factor when sentencing, under a law the Victorian Coalition says it will introduce if it wins the state election on 28 November.", "Opposition Leader Jess Wilson has named the proposal Aidan's Law, after Aidan Becker, a 22-year-old off-duty security guard who died after he was stabbed at Mernda railway station, in Melbourne's north, in March while trying to help a 14-year-old boy. Ms Wilson said the policy followed a request from Mr Becker's mother, Natalie, AAP reported.", "\"If you're brave enough to stand up for someone else, the law should stand up for you,\" Ms Wilson said.", "Victorian courts can already take that kind of circumstance into account, but the law does not specifically require them to, according to AAP. Details such as wording, penalties and timing were not part of the announcement as reported.", {"note": "Several people have been charged in connection with Mr Becker's death. The case is before the courts."}, {"h": "Labor's pitch on the same day"}, "Premier Ben Carroll promised 200 more police reservists, former officers who would answer phones and staff counters at police stations, on top of 400 already being recruited. He also announced two new police stations and the rebuilding or upgrading of four others, AAP reported.", "\"Victorians have been very clear that they want to see someone at the counter when they walk into their local station,\" Mr Carroll said.", "The Labor government has started a review of Victoria's sentencing laws, with public consultation due to begin in April 2027.", {"h": "When you can vote"}, "Early voting opens on Wednesday 18 November, and election day is Saturday 28 November."], "dek": "Jess Wilson says courts would have to treat an attack on a Good Samaritan as more serious if the Coalition wins on 28 November. Labor is promising 200 more police reservists.", "headline": "Coalition promises 'Aidan's Law' for people who step in to help, as Labor pledges more police at station counters"}, "figure": {"en": "election day", "value": "28 Nov"}, "image": {"addedAt": "2026-11-09T06:30:58Z", "addedBy": "claude", "alt": {"en": "The sandstone front of the Supreme Court of Victoria, with its arched colonnade and dome, seen through autumn trees from William Street."}, "caption": {"en": "The Supreme Court of Victoria on William Street, Melbourne. The Coalition's pledge would change how courts sentence people who attack Good Samaritans."}, "credit": "Nickbenanh", "file": "images/front-facade-of-the-supreme-court-of-victoria.jpg", "licence": "CC BY-SA 3.0", "og": "og/front-facade-of-the-supreme-court-of-victoria.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Front_facade_of_the_Supreme_Court_of_Victoria.jpg", "srcset": "img/front-facade-of-the-supreme-court-of-victoria-800.webp 800w, img/front-facade-of-the-supreme-court-of-victoria-1600.webp 1600w", "url": "img/front-facade-of-the-supreme-court-of-victoria-1600.webp"}, "priority": 8, "risk": "amber", "section": "civic", "slug": "coalition-aidans-law-good-samaritans", "sources": [{"checked": "2026-11-09", "title": "AAP: Vow to toughen penalties for attacks on Good Samaritans (9 Nov 2026)", "url": "https://aapnews.aap.com.au/news/vow-to-toughen-penalties-for-attacks-on-good-samaritans"}, {"checked": "2026-11-09", "title": "Canberra Times (AAP): same report", "url": "https://www.canberratimes.com.au/story/9387844/vow-to-toughen-penalties-for-attacks-on-good-samaritans/"}, {"checked": "2026-11-09", "title": "ABC News: court proceedings over Aidan Becker's death (5 Aug 2026)", "url": "https://www.abc.net.au/news/2026-08-05/aidan-becker-murder-court-not-guilty-plea/106998816"}], "status": "published", "type": "news", "updated": "2026-11-09T06:30:58Z"}, {"approvedAt": "2026-11-09T04:02:29Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "created": "2026-11-09T04:02:29Z", "date": "2026-11-09", "en": {"body": ["Melbourne's international cricket summer starts in less than a fortnight. Here are the matches to put in the diary, from the Women's Big Bash League at Junction Oval to the 150th anniversary Test at the MCG in March, and when to tune in for India's matches at home.", {"h": "At the MCG"}, {"dl": [["Sat 21 Nov, 7.15pm", "Australia v England, first men's T20 International"], ["Sat 26 to Wed 30 Dec, 10.30am", "Boxing Day Test: Australia v New Zealand"], ["Thu 11 to Mon 15 Mar 2027, 2pm", "150th anniversary Test: Australia v England (day-night)"]]}, "The public ballot for 150th anniversary Test tickets has closed, the MCG says. The ground will also host six Big Bash League (BBL|16) matches this summer; check the BBL fixture for dates.", {"h": "Women's Big Bash at Junction Oval"}, "The Melbourne Stars and Melbourne Renegades play their home WBBL|12 matches at Junction Oval in St Kilda. Their remaining November home games:", {"dl": [["Thu 12 Nov, 3.40pm", "Melbourne Stars v Brisbane Heat"], ["Sun 22 Nov, 7.10pm", "Melbourne Stars v Melbourne Renegades"], ["Wed 25 Nov, 7.10pm", "Melbourne Renegades v Brisbane Heat"], ["Sat 28 Nov, time to be confirmed", "Melbourne Stars v Melbourne Renegades"]]}, {"note": "The two clubs list different start times for the 28 November derby (3.40pm and 7.10pm). Check the club websites closer to the day."}, {"h": "India's season at home"}, "India host Sri Lanka in December for three one-day internationals (13 December in Delhi, 16 December in Bengaluru, 19 December in Ahmedabad) and three T20 Internationals (22 December in Rajkot, 24 December in Cuttack, 27 December in Pune), then Zimbabwe for three ODIs in Kolkata, Hyderabad and Mumbai from 3 January.", "Then comes the big one. Australia tour India for the five-Test Border-Gavaskar Trophy from 21 January to 3 March, with every Test scheduled to start at 3pm Melbourne time.", {"dl": [["21 to 25 Jan", "First Test, Nagpur"], ["29 Jan to 2 Feb", "Second Test, Chennai"], ["11 to 15 Feb", "Third Test, Guwahati"], ["19 to 23 Feb", "Fourth Test, Ranchi"], ["27 Feb to 3 Mar", "Fifth Test, Ahmedabad"]]}, "Times are Melbourne time and can change. Check with the venue or broadcaster before you go or tune in. Tickets for matches in Australia are sold through Cricket Australia's website."], "dek": "England play a T20 at the MCG on 21 November, New Zealand are here for the Boxing Day Test, and India host Australia for five Tests from 21 January.", "headline": "Cricket this summer: the big matches in Melbourne, and when India play"}, "figure": {"en": "internationals at the MCG this season", "value": "3"}, "image": {"addedAt": "2026-11-09T06:13:29Z", "addedBy": "claude", "alt": {"en": "Cricket fans in blue shirts wave Indian flags in the stands of the packed Melbourne Cricket Ground, with players on the field and the big screen behind."}, "caption": {"en": "India fans wave the tricolour at the MCG during the 2015 Cricket World Cup."}, "credit": "Rajiv Bhuttan", "file": "images/indian-cricket-supporters-at-the-melbourne-cricket-ground-mcg-during-the-2015-cr.jpg", "licence": "CC BY 2.0", "og": "og/indian-cricket-supporters-at-the-melbourne-cricket-ground-mcg-during-the-2015-cr.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Indian_Cricket_supporters_at_the_Melbourne_Cricket_Ground_(MCG)_during_the_2015_Cricket_World_Cup.jpg", "srcset": "img/indian-cricket-supporters-at-the-melbourne-cricket-ground-mcg-during-the-2015-cr-800.webp 800w, img/indian-cricket-supporters-at-the-melbourne-cricket-ground-mcg-during-the-2015-cr-1600.webp 1600w", "url": "img/indian-cricket-supporters-at-the-melbourne-cricket-ground-mcg-during-the-2015-cr-1600.webp"}, "priority": 6, "risk": "green", "section": "sport", "slug": "cricket-summer-2026-27-melbourne-guide", "sources": [{"checked": "2026-11-09", "title": "Cricket Australia: 2026-27 schedule", "url": "https://www.cricket.com.au/news/4425772/mark-your-calendar-2026-australia-cricket-schedule-fixtures-dates-tours-wtc-top-end-tests-south-africa-bangladesh-new-zealand-england-india-t20-world-cup"}, {"checked": "2026-11-09", "title": "MCG: International cricket schedule confirmed for 2026/27", "url": "https://www.mcg.org.au/news/2026/march/international-cricket-schedule-confirmed-for-202627"}, {"checked": "2026-11-09", "title": "Melbourne Stars: WBBL|12 fixture", "url": "https://www.melbournestars.com.au/news/4529130/wbbl12-fixture-stars-at-home-under-lights"}, {"checked": "2026-11-09", "title": "Melbourne Renegades: WBBL|12 fixture", "url": "https://www.melbournerenegades.com.au/news/4529164/fixtures"}, {"checked": "2026-11-09", "title": "Cricket Australia: Border-Gavaskar Trophy 2027 schedule", "url": "https://www.cricket.com.au/news/4476875/australia-v-india-test-series-border-gavaskar-trophy-2027-schedule-venues-revealed"}, {"checked": "2026-11-09", "title": "Deccan Herald: India's 2026-27 home schedule", "url": "https://www.deccanherald.com/sports/cricket/team-indias-home-schedule-for-2026-27-announced-check-full-list-of-matches-dates-and-venues-here-3945277"}], "status": "published", "type": "guide", "updated": "2026-11-09T06:13:29Z"}, {"approvedAt": "2026-11-09T20:06:00Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "created": "2026-11-09T11:30:00Z", "date": "2026-11-10", "en": {"body": ["More than $450,000 has been raised for the family of Feng Jianming, the food delivery rider killed near Queen Victoria Market on Friday night, as a Footscray man faced court charged with his murder.", "Roberto Urbano, 51, of Footscray, has been charged with murder and intentionally causing seriou
