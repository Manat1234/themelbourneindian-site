:root{
  --paper:#FAF8F3; --surface:#FFFFFF; --ink:#181F1C; --ink2:#3B4540; --muted:#66716B; --rule:#DDDCD4; --rule2:#C9C8BE;
  --saffron:#BD5125; --moss:#315343; --mint:#E7EEE8; --cream:#F3E8D7; --forest:#182920; --forest-ink:#E9EFEA; --forest-muted:#A9BAB0;
  --s-community:#BD5125; --s-civic:#315343; --s-business:#24425E; --s-education:#0E6A73; --s-culture:#A16A07; --s-india:#8A2E3B;
  --ok:#2E7D4F; --warn:#A46200; --bad:#B23A3A; --focus:#0E6A73;
  --serif:"Newsreader","Noto Serif Devanagari","Noto Serif Gurmukhi",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Mukta","Mukta Mahee","Segoe UI",system-ui,sans-serif;
  --logo:Georgia,"Times New Roman",serif;
  --w:1240px;
}
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink)}
#app{font:400 17px/1.55 var(--sans);background:var(--paper);color:var(--ink);min-height:100vh}
[lang="hi"] #app,[lang="pa"] #app,#app [lang="hi"],#app [lang="pa"]{line-height:1.7}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img{max-width:100%;display:block}
.wrap{max-width:var(--w);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:14px}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0 0 1em}

/* ---------- top utility + masthead ---------- */
.util{border-bottom:1px solid var(--rule);font-size:13px;color:var(--muted)}
.util-in{display:flex;gap:10px 22px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:7px}
.util-l{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center}
.util-l strong{color:var(--saffron);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.util-r{display:flex;gap:4px 16px;align-items:center;flex-wrap:wrap}
.util-r a{text-decoration:none;font-weight:600;color:var(--ink2)}
.util-r a:hover{color:var(--saffron)}
.desk-link{background:var(--ink);color:var(--paper)!important;padding:3px 10px;border-radius:2px}
.mast{background:var(--paper)}
.mast-in{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:24px 14px;text-align:center}
.identity{display:flex;align-items:center;gap:18px;text-decoration:none;min-width:0;text-align:left}
.brandmark{width:68px;height:68px;flex:none;display:grid;place-items:center;background:#181f1c;color:#fff;font-family:var(--logo);font-size:38px;line-height:1;border-radius:50%;border:3px solid var(--saffron)}
.brand{display:block;font-family:var(--logo);letter-spacing:-.055em;font-size:clamp(30px,5.4vw,64px);font-weight:800;line-height:1.02}
.brand em{font-style:normal;color:var(--saffron)}
.tagline{display:block;font-size:14px;letter-spacing:.24em;text-transform:uppercase;margin-top:6px;color:var(--ink2);font-weight:700}
.edition-line{display:grid;grid-template-columns:minmax(16px,1fr) auto minmax(16px,1fr);align-items:center;gap:22px;width:100%;max-width:900px}
.edition-line::before,.edition-line::after{content:"";height:1px;background:var(--muted)}
.ed-links{display:flex;gap:14px;align-items:center}
.ed-links a{text-decoration:none;font-weight:700;color:var(--muted);font-size:17px;padding-bottom:2px;border-bottom:2px solid transparent}
.ed-links a[lang="en"]{letter-spacing:.2em;text-transform:uppercase;font-size:15px}
.ed-links a:hover{color:var(--ink)}
.ed-links a[aria-current]{color:var(--ink);border-color:var(--saffron)}
.ed-sep{color:var(--saffron);font-weight:700;font-size:20px}
.util-sub{color:var(--saffron)!important}
[lang="hi"] .tagline,[lang="pa"] .tagline{letter-spacing:.03em;font-size:13px;text-transform:none}
.mast-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.langs{display:flex;gap:2px;border:1px solid var(--rule2);border-radius:999px;padding:3px;background:var(--surface)}
.langs a{padding:5px 12px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:700;color:var(--muted)}
.langs a[aria-current]{background:var(--ink);color:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:10px 16px;border-radius:2px;font:700 14px/1.2 var(--sans);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--moss);border-color:var(--moss)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--mint)}
.btn.saffron{background:var(--saffron);border-color:var(--saffron);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.nav{border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);background:var(--paper);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.nav-in{display:flex;gap:0 24px;align-items:center;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.nav-in::-webkit-scrollbar{display:none}
.nav a{display:inline-block;text-decoration:none;font-weight:700;font-size:14px;padding:12px 0 10px;border-bottom:3px solid transparent;margin-bottom:-1px}
.nav a:hover{border-color:var(--rule2)}
.nav a[aria-current]{border-color:var(--sec,var(--saffron))}
.nav .spacer{margin-left:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}

/* key-dates ticker */
.ticker{border-bottom:1px solid var(--rule);background:var(--surface)}
.ticker-in{display:flex;gap:18px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-block:9px;font-size:14px;white-space:nowrap}
.ticker-in::-webkit-scrollbar{display:none}
.ticker b{color:var(--saffron);text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.ticker a{text-decoration:none}
.ticker a:hover{text-decoration:underline}
.ticker .d{font-weight:700;margin-right:6px}
.ticker .sep{color:var(--rule2)}

/* ---------- labels ---------- */
.kicker{display:inline-block;font:700 12px/1.2 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--sec,var(--saffron));text-decoration:none;margin-bottom:6px}
[lang="hi"] .kicker,[lang="pa"] .kicker{letter-spacing:.02em;font-size:14px;text-transform:none}
.type-tag{font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{display:inline-block;font:700 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:2px;border:1px solid currentColor;vertical-align:middle}
.b-draft{color:var(--warn)} .b-held{color:var(--bad)} .b-published{color:var(--ok)} .b-review{color:var(--s-business)}
.b-green{color:var(--ok)} .b-amber{color:var(--warn)} .b-red{color:var(--bad)}
.draftbar{background:var(--cream);border-bottom:1px solid var(--rule);font-size:14px}
.draftbar .wrap{padding-block:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- media ---------- */
.media{position:relative;overflow:hidden;background:var(--mint);aspect-ratio:16/9;max-width:100%}
.media img,.media svg{width:100%;height:100%;object-fit:cover;display:block}
.media.r43{aspect-ratio:4/3}.media.r32{aspect-ratio:3/2}.media.r11{aspect-ratio:1/1}
figure{margin:0}
figcaption{font-size:13px;color:var(--muted);padding-top:8px;line-height:1.45}
figcaption .credit{white-space:nowrap}

/* ---------- front page ---------- */
.front{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;padding-block:24px 30px}
.lead-pkg{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-content:start}
.lead-story{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;padding-bottom:22px;border-bottom:1px solid var(--rule)}
.lead-story h2{font-size:clamp(30px,3.5vw,46px);line-height:1.06;margin-bottom:12px}
[lang="hi"] .lead-story h2,[lang="pa"] .lead-story h2{line-height:1.3}
.lead-story .dek{font-size:18px;color:var(--ink2);margin-bottom:12px}
.story-link{text-decoration:none}
.story-link:hover h2,.story-link:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.second{display:flex;flex-direction:column;gap:10px;min-width:0}
.second h3{font-size:22px;line-height:1.15}
[lang="hi"] .second h3,[lang="pa"] .second h3{line-height:1.35}
.second .dek{font-size:15px;color:var(--ink2);margin:0}
.second + .second{border-left:1px solid var(--rule);padding-left:24px}
.rail{display:flex;flex-direction:column;gap:24px;min-width:0}
.rail-box{border-top:3px solid var(--ink);padding-top:10px}
.rail-box h2{font-size:20px;margin-bottom:6px}
.datelist{list-style:none;margin:0;padding:0}
.datelist li{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;align-items:center;padding-block:9px;border-bottom:1px solid var(--rule)}
.datelist a{text-decoration:none;font-size:15px;line-height:1.35}
.datelist a:hover{color:var(--saffron)}
.rd{display:flex;flex-direction:column;align-items:center;line-height:1}
.rd-n{font:600 26px/1 var(--serif)}
.rd-m{font:700 11px/1.4 var(--sans);color:var(--saffron);letter-spacing:.06em;text-transform:uppercase}

.latest{border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:34px}
.latest article{padding:14px 18px 16px;min-width:0}
.latest article + article{border-left:1px solid var(--rule)}
.latest .num{font:600 13px/1 var(--sans);color:var(--muted);display:block;margin-bottom:8px}
.latest h3{font-size:18px;line-height:1.2}
[lang="hi"] .latest h3,[lang="pa"] .latest h3{line-height:1.4}

.band-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-top:3px solid var(--sec,var(--ink));padding-top:8px;margin-bottom:16px}
.band-h h2{font-size:26px}
.band-h a{font-size:14px;font-weight:700;text-decoration:none;color:var(--sec,var(--saffron))}
.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 40px;margin-bottom:40px}
.secblock{min-width:0}
.secblock .top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;padding-bottom:14px}
.secblock .top h3{font-size:22px;line-height:1.15;margin-bottom:8px}
[lang="hi"] .secblock .top h3,[lang="pa"] .secblock .top h3{line-height:1.35}
.secblock .top .dek{font-size:15px;color:var(--ink2);margin:0}
.secblock ul{list-style:none;margin:0;padding:0}
.secblock li{border-top:1px solid var(--rule);padding-block:10px}
.secblock li a{text-decoration:none;font:600 17px/1.3 var(--serif)}
.secblock li a:hover{text-decoration:underline}

.guides{background:var(--cream);margin-bottom:40px}
.guides .wrap{padding-block:26px 30px}
.guides-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.guide{border-left:3px solid var(--sec,var(--saffron));padding-left:14px;min-width:0}
.guide h3{font-size:20px;line-height:1.2;margin-bottom:6px}
.guide p{font-size:15px;color:var(--ink2);margin:0}

.promo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-bottom:40px}
.promo > div{padding:28px}
.promo .nl{background:var(--moss);color:#fff}
.promo .dir{background:var(--surface);border:1px solid var(--rule)}
.promo h2{font-size:28px;margin-bottom:8px}
.promo p{font-size:15px}
.promo .nl .btn{background:#fff;color:#182920;border-color:#fff}

/* ---------- ads ---------- */
.ad{border:1px solid var(--rule);background:var(--surface);padding:14px;position:relative}
.ad-label{display:block;font:700 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.ad h4{font:600 20px/1.2 var(--serif);margin-bottom:6px}
.ad p{font-size:14px;color:var(--ink2);margin-bottom:10px}
.ad-leaderboard{margin-bottom:40px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;padding:18px 22px}.ad-leaderboard .ad-label{flex-basis:100%}.ad-leaderboard h4{margin:0}.ad-leaderboard p{flex:1 1 260px}
.ad-leaderboard .ad-label{margin:0}
.ad-leaderboard p{margin:0}
.ad-house{background:var(--mint)}
.ad-inline{margin:26px 0}

/* ---------- section page ---------- */
.sec-head{padding-block:26px 8px;border-bottom:3px solid var(--sec,var(--ink));margin-bottom:24px}
.sec-head h1{font-size:clamp(34px,5vw,54px);color:var(--sec,var(--ink))}
.sec-head p{color:var(--muted);margin:6px 0 0}
.sec-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;padding-bottom:40px}
.rowcard{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;padding-block:18px;border-bottom:1px solid var(--rule)}
.rowcard h3{font-size:24px;line-height:1.15;margin-bottom:8px}
[lang="hi"] .rowcard h3,[lang="pa"] .rowcard h3{line-height:1.35}
.rowcard .dek{font-size:16px;color:var(--ink2);margin-bottom:8px}
.empty{padding:28px;border:1px dashed var(--rule2);color:var(--muted);text-align:center}

/* ---------- article ---------- */
.art-head{padding-block:28px 18px;max-width:900px}
.art-head h1{font-size:clamp(32px,4.6vw,56px);line-height:1.05;margin-bottom:14px}
[lang="hi"] .art-head h1,[lang="pa"] .art-head h1{line-height:1.28}
.art-head .dek{font-size:20px;color:var(--ink2);margin-bottom:16px;max-width:62ch}
.byline{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding-block:10px;font-size:14px;color:var(--muted)}
.byline strong{color:var(--ink)}
.byline a{color:var(--s-education)}
.art-grid{display:grid;grid-template-columns:minmax(0,720px) 300px;gap:48px;justify-content:space-between;padding-bottom:50px}
.art-main{min-width:0}
.art-main > figure{margin:4px 0 26px}
.body{font:400 19px/1.7 var(--serif)}
[lang="hi"] .body,[lang="pa"] .body{font-size:19px;line-height:1.85}
.body p{margin:0 0 1.1em}
.body h2{font-size:26px;margin:1.6em 0 .5em}
.body ul{padding-left:1.2em}
.body li{margin-bottom:.4em}
.body a{color:var(--s-education)}
.note{font:400 16px/1.55 var(--sans);background:var(--mint);border-left:3px solid var(--moss);padding:12px 16px}
.keydates{margin:8px 0 22px;padding:0;border-top:2px solid var(--ink);font-family:var(--sans);font-size:16px}
.keydates div{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;padding-block:9px;border-bottom:1px solid var(--rule)}
.keydates dt{font-weight:700;font-variant-numeric:tabular-nums}
.keydates dd{margin:0}
.endmatter{font:400 15px/1.55 var(--sans);margin-top:30px}
.endmatter section{border-top:1px solid var(--rule);padding-top:14px;margin-top:18px}
.endmatter h2{font:700 13px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.endmatter ol,.endmatter ul{padding-left:20px;margin:0}
.endmatter li{margin-bottom:6px}
.endmatter a{color:var(--s-education)}
.morelist{list-style:none;margin:0;padding:0}
.morelist li{border-bottom:1px solid var(--rule);padding-block:10px}
.morelist a{text-decoration:none;font:600 16px/1.3 var(--serif)}
.morelist a:hover{text-decoration:underline}

/* ---------- static / forms ---------- */
.page-grid{display:grid;grid-template-columns:minmax(0,720px) 300px;gap:48px;justify-content:space-between;padding-block:28px 50px}
.prose{font:400 18px/1.65 var(--sans)}
.prose h1{font-size:clamp(32px,4.4vw,50px);margin-bottom:14px}
.prose h2{font-size:24px;margin:1.4em 0 .4em}
.prose a{color:var(--s-education)}
.prose .dek{font-size:20px;color:var(--ink2)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top}
thead th{border-bottom:2px solid var(--ink);font:700 12px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tiers dt{margin-top:14px}.tiers dd{margin:4px 0 0}
.form{display:grid;gap:14px;background:var(--surface);border:1px solid var(--rule);padding:20px}
.form h2{font-size:22px;margin:0}
.field{display:grid;gap:5px;min-width:0}
.field label,.flabel{font:700 13px/1.3 var(--sans)}
.field small{color:var(--muted);font-size:13px}
input[type=text],input[type=email],input[type=url],input[type=tel],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;font:400 16px/1.4 var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--rule2);border-radius:2px;padding:9px 10px;min-width:0}
textarea{min-height:110px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.status{font-size:14px;padding:10px 12px;border-radius:2px}
.status.ok{background:var(--mint);color:var(--ok)}
.status.err{background:var(--cream);color:var(--bad)}
.copybox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.copybox code{background:var(--mint);padding:4px 8px;border-radius:2px;overflow-wrap:anywhere}
.dir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.dir-card{border:1px solid var(--rule);background:var(--surface);padding:16px}
.dir-card h3{font-size:20px;margin-bottom:4px}

/* ---------- footer ---------- */
.foot{background:var(--forest);color:var(--forest-ink);margin-top:20px}
.foot .wrap{padding-block:40px 26px}
.foot-grid{display:grid;grid-template-columns:1.5fr repeat(3,minmax(0,1fr));gap:30px}
.foot-brand{font:800 28px/1 var(--logo);letter-spacing:-.05em;margin-bottom:10px}
.foot-brand em{font-style:normal;color:#EF9D6D}
.foot p,.foot a,.foot li{color:var(--forest-muted);font-size:14px}
.foot h3{font:700 13px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--forest-ink);margin-bottom:10px}
.foot ul{list-style:none;margin:0;padding:0}
.foot li{margin-bottom:8px}
.foot a{text-decoration:none}
.foot a:hover{color:#fff;text-decoration:underline}
.foot-bottom{border-top:1px solid #34463c;margin-top:30px;padding-top:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--forest-muted)}

/* ---------- desk ---------- */
.desk{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.desk-side{background:var(--forest);color:var(--forest-ink);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.desk-side .brandline{font:800 20px/1 var(--logo);letter-spacing:-.04em;margin-bottom:4px}
.desk-side .brandline em{font-style:normal;color:#EF9D6D}
.desk-side small{color:var(--forest-muted);display:block;margin-bottom:18px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.desk-side nav{display:flex;flex-direction:column;gap:2px}
.desk-side a{color:var(--forest-muted);text-decoration:none;padding:7px 10px;border-radius:2px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.desk-side a:hover{color:#fff;background:#22362b}
.desk-side a[aria-current]{color:#fff;background:#2c4537}
.desk-side .cnt{font-variant-numeric:tabular-nums;background:#EF9D6D;color:#182920;border-radius:999px;padding:0 7px;font-size:12px}
.desk-side hr{border:0;border-top:1px solid #2c3f34;margin:10px 0}
.desk-main{padding:22px max(16px,env(safe-area-inset-right,0px)) 60px 28px;min-width:0}
.desk-main h1{font-size:30px;margin-bottom:4px}
.desk-sub{color:var(--muted);margin-bottom:20px;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.tile{background:var(--surface);border:1px solid var(--rule);padding:14px;text-decoration:none;display:block}
.tile b{display:block;font:600 34px/1 var(--serif);font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.attn{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.panel{background:var(--surface);border:1px solid var(--rule);padding:16px;margin-bottom:18px;min-width:0}
.panel h2{font-size:20px;margin-bottom:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--rule2);background:var(--surface);border-radius:999px;padding:5px 12px;font:600 13px/1 var(--sans);cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dtable td,.dtable th{font-size:14px}
.dtable tr.click{cursor:pointer}
.dtable tr.click:hover td{background:var(--mint)}
.dtable .hl{font:600 16px/1.3 var(--serif)}
.langpills span{display:inline-block;font:700 10px/1 var(--sans);padding:3px 5px;border:1px solid var(--rule2);border-radius:2px;margin-right:3px;color:var(--muted)}
.langpills span.on{border-color:var(--ok);color:var(--ok)}
.editor{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule2);margin-bottom:12px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font:700 14px/1 var(--sans);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--saffron)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.confirm{background:var(--cream);border:1px solid var(--warn);padding:12px;margin-top:10px;font-size:14px}
.list-card{border-bottom:1px solid var(--rule);padding-block:12px;display:grid;gap:6px}
.list-card h3{font-size:18px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.preview-frame{width:100%;height:600px;border:1px solid var(--rule);background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:2px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.warnlist{margin:6px 0 0;padding-left:18px;color:var(--bad);font-size:14px}

/* ---------- responsive ---------- */
@media (max-width:1060px){
  .front,.sec-grid,.art-grid,.page-grid{grid-template-columns:minmax(0,1fr)}
  .rail{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .latest{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .latest article:nth-child(3){border-left:0}
  .latest article:nth-child(n+3){border-top:1px solid var(--rule)}
  .editor{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .lead-story{grid-template-columns:minmax(0,1fr)}
  .lead-pkg{grid-template-columns:minmax(0,1fr)}
  .second + .second{border-left:0;padding-left:0;border-top:1px solid var(--rule);padding-top:14px}
  .sections,.promo{grid-template-columns:minmax(0,1fr)}
  .foot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .foot-grid > div:first-child{grid-column:1/-1}
  .desk{grid-template-columns:minmax(0,1fr)}
  .desk-side{position:static;height:auto}
  .desk-side nav{flex-direction:row;flex-wrap:wrap}
  .desk-main{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .ad-leaderboard{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  #app{font-size:16px}
  .brandmark{width:44px;height:44px;font-size:25px}
  .identity{gap:10px}
  .tagline{font-size:9.5px;letter-spacing:.12em}
  .edition-line{gap:12px}
  .ed-links{gap:10px}
  .ed-links a{font-size:15px}
  .ed-links a[lang="en"]{font-size:13px;letter-spacing:.12em}
  .latest{grid-template-columns:minmax(0,1fr)!important}
  .latest article + article{border-left:0;border-top:1px solid var(--rule)}
  .secblock .top,.rowcard{grid-template-columns:minmax(0,1fr)}
  .row2{grid-template-columns:minmax(0,1fr)}
  .keydates div{grid-template-columns:minmax(0,1fr);gap:2px}
  .body{font-size:18px}
  .foot-grid{grid-template-columns:minmax(0,1fr)}
  .promo > div{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* ---------- rotating hero ---------- */
.hero{grid-column:1/-1;position:relative;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.hero-track{display:grid}
.hero-slide{grid-area:1/1;border-bottom:0;padding-bottom:4px;opacity:0;visibility:hidden;transition:opacity .8s ease,visibility 0s linear .8s}
.hero-slide.is-on{opacity:1;visibility:visible;transition:opacity .8s ease,visibility 0s}
.hero-slide .media img{transform-origin:60% 40%}
.hero-slide.is-on .media img{animation:heroZoom 9s ease-out both}
.hero-slide.is-on .hero-txt>*{animation:heroRise .75s cubic-bezier(.2,.7,.2,1) both}
.hero-slide.is-on .hero-txt>*:nth-child(2){animation-delay:.08s}
.hero-slide.is-on .hero-txt>*:nth-child(3){animation-delay:.16s}
.hero-slide.is-on .hero-txt>*:nth-child(4){animation-delay:.24s}
.hero-slide.is-on .hero-txt>*:nth-child(5){animation-delay:.3s}
@keyframes heroZoom{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes heroRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero-ctl{display:flex;align-items:center;gap:8px;margin-top:6px}
.hero-btn{appearance:none;flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--rule2);background:var(--surface);color:var(--ink);display:grid;place-items:center;font:700 20px/1 var(--sans);cursor:pointer;padding:0;transition:background .2s,color .2s,border-color .2s}
.hero-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hero-pause{font-size:10px;letter-spacing:-1px}
.hero-dots{display:flex;gap:6px;flex:1;max-width:360px;margin:0 4px}
.hero-dot{appearance:none;border:0;background:none;padding:12px 0;flex:1;cursor:pointer;min-width:24px}
.hero-dot i{display:block;position:relative;height:3px;border-radius:2px;background:var(--rule2);overflow:hidden}
.hero-dot i::after{content:"";position:absolute;inset:0;background:var(--saffron);transform:scaleX(0);transform-origin:left}
.hero-dot[aria-current] i::after{animation:heroFill var(--hero-ms,7000ms) linear forwards}
.hero.paused .hero-dot[aria-current] i::after,.hero.paused .hero-slide.is-on .media img{animation-play-state:paused}
.hero.static .hero-dot[aria-current] i::after{animation:none;transform:scaleX(1)}
@keyframes heroFill{to{transform:scaleX(1)}}
@media (min-width:821px){.hero-slide>.story-link{display:block;height:100%}.hero-slide .media{aspect-ratio:auto;height:100%;min-height:300px}}
@media (prefers-reduced-motion:reduce){.hero-slide,.hero-slide.is-on{transition:none}.hero-slide.is-on .media img,.hero-slide.is-on .hero-txt>*{animation:none}.hero-dot[aria-current] i::after{animation:none;transform:scaleX(1)}}

/* ---------- share ---------- */
.share{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 4px;font:600 14px/1 var(--sans)}
.share-l{color:var(--muted);margin-right:2px}
.sh{appearance:none;display:inline-flex;align-items:center;padding:8px 12px;border:1px solid var(--rule2);border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;font:600 13px/1 var(--sans);cursor:pointer}
.sh:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sh-wa{background:#1f7a4d;border-color:#1f7a4d;color:#fff}
.sh-wa:hover{background:#155c39;border-color:#155c39;color:#fff}
.endmatter .share{margin:22px 0 0}

/* ---------- JUST IN tag ---------- */
.flash{display:inline-flex;align-items:center;gap:7px;margin:0 10px 10px 0;padding:6px 10px 6px 9px;border-radius:2px;background:var(--ink);color:#fff;font:800 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;vertical-align:middle}
.flash.is-live{background:#C8102E}
.flash i{width:7px;height:7px;border-radius:50%;background:#fff}
.flash.is-live i{animation:flashPulse 1.6s ease-out infinite}
@keyframes flashPulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}100%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
[lang="hi"] .flash,[lang="pa"] .flash{letter-spacing:.02em;text-transform:none;font-size:13px}
@media (prefers-reduced-motion:reduce){.flash.is-live i{animation:none}}

/* ---------- key dates: moving ticker ---------- */
.ticker-in{overflow:hidden;gap:0}
.ticker-l{display:inline-flex;align-items:center;gap:8px;flex:none;padding-right:16px;margin-right:2px;border-right:1px solid var(--rule);background:var(--surface);position:relative;z-index:1}
.ticker-l i{width:7px;height:7px;border-radius:50%;background:var(--saffron);animation:kdPulse 2s ease-out infinite}
@keyframes kdPulse{0%{box-shadow:0 0 0 0 rgba(189,81,37,.55)}100%{box-shadow:0 0 0 7px rgba(189,81,37,0)}}
.ticker-vp{flex:1;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22px,#000 calc(100% - 44px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 22px,#000 calc(100% - 44px),transparent 100%)}
.ticker-track{display:flex;width:max-content}
.ticker-track.run{animation:kdRun 40s linear infinite}
.ticker-vp:hover .ticker-track,.ticker-vp:focus-within .ticker-track{animation-play-state:paused}
.ticker-set{display:flex;align-items:center;gap:18px;padding-left:18px}
@keyframes kdRun{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.due{display:inline-flex;align-items:center;margin-right:7px;padding:3px 7px;border-radius:2px;background:var(--ink);color:#fff;font:800 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;vertical-align:1px}
.due.is-today{background:#C8102E}
.due.is-soon{background:var(--saffron)}
[lang="hi"] .due,[lang="pa"] .due{letter-spacing:.02em;text-transform:none;font-size:12px}
.dl-t{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.dl-t .due{margin:0;background:transparent;color:var(--muted);padding:0;letter-spacing:.06em}
.dl-t .due.is-today{background:#C8102E;color:#fff;padding:3px 7px}
.dl-t .due.is-soon{background:transparent;color:var(--saffron)}
.datelist li{animation:kdIn .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes kdIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .ticker-track.run{animation:none}
  .ticker-set[aria-hidden]{display:none}
  .ticker-vp{overflow-x:auto;scrollbar-width:none;-webkit-mask-image:none;mask-image:none}
  .ticker-l i,.datelist li{animation:none}
}
