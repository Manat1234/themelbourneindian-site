nts"}, "figure": {"en": "biometrics may be required for visa applicants in India", "value": "26 Oct"}, "image": {"addedAt": "2026-11-08T20:13:38Z", "addedBy": "claude", "alt": {"en": "An illuminated 'MELBOURNE' sign set into a timber-slat wall in Melbourne Airport's international arrivals hall, above a glass balustrade and polished floor."}, "caption": {"en": "The international arrivals hall at Melbourne Airport's Terminal 2."}, "credit": "MDRX", "file": "images/melbourne-airport-t2-international-arrivals.jpg", "licence": "CC BY-SA 4.0", "og": "og/melbourne-airport-t2-international-arrivals.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Melbourne_Airport_Terminal_2_(inside)_International_Arrivals_2022-02-06.jpg", "srcset": "img/melbourne-airport-t2-international-arrivals-800.webp 800w, img/melbourne-airport-t2-international-arrivals-1600.webp 1600w", "url": "img/melbourne-airport-t2-international-arrivals-1600.webp"}, "priority": 6, "risk": "amber", "section": "india", "slug": "australia-visa-biometrics-india-2026", "sources": [{"checked": "2026-11-08", "title": "Australian High Commission, New Delhi: Australia expands biometric collection requirements for visa applicants in India", "url": "https://india.highcommission.gov.au/ndli/vm_Biometric_collection_requirements_for_Australia_visa_applicants_in_India.html"}, {"checked": "2026-11-08", "title": "Department of Home Affairs: Biometrics", "url": "https://immi.homeaffairs.gov.au/help-support/meeting-our-requirements/biometrics"}, {"checked": "2026-11-08", "title": "Department of Home Affairs: Australian Immi App", "url": "https://immi.homeaffairs.gov.au/supporting/Pages/australian-immi-app.aspx"}], "status": "published", "type": "news", "updated": "2026-11-08T20:13:38Z"}, {"byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["Diwali falls on Sunday 8 November this year, the date set by the lunar calendar. For many Hindu, Sikh and Jain families in Melbourne, the day brings prayers, lamps, sweets and visits to family and friends.", "Public celebrations started early. Melbourne Diwali, a free festival run by the not-for-profit SarasCare, was scheduled for Saturday 31 October at Marvel Stadium Square in Docklands, from 2pm to 10pm.", "On Saturday 7 November the Immigration Museum on Flinders Street held a day of free Diwali activities, including henna, rangoli and traditional games. In ticketed Indian embroidery workshops, visitors added their own work to a shared 10-metre textile artwork.", "Many Hindu temples and Sikh gurdwaras across Melbourne hold special prayers and services around Diwali. For Sikhs, the day is also Bandi Chhor Divas, which marks the release of Guru Hargobind Sahib Ji from imprisonment. Check with your local temple or gurdwara for times.", {"h": "Coming up: Gurpurab"}, "The next major date for many in the community is the Gurpurab of Guru Nanak Dev Ji later this month. Published calendars list it on 24 or 25 November, depending on the calendar and time zone used, so confirm the dates of nagar kirtans and services with your gurdwara."], "dek": "Diwali falls on Sunday 8 November this year. Celebrations across the city began a week earlier.", "headline": "Diwali 2026: Melbourne marks the festival of lights"}, "figure": {"en": "November · Diwali", "hi": "नवंबर · दिवाली", "pa": "ਨਵੰਬਰ · ਦੀਵਾਲੀ", "value": "8"}, "hi": {"body": ["चंद्र पंचांग के अनुसार इस साल दिवाली रविवार, 8 नवंबर को है। मेलबर्न में बहुत से हिंदू, सिख और जैन परिवारों के लिए यह दिन पूजा, दीयों, मिठाइयों और अपनों से मिलने-जुलने का दिन है।", "सार्वजनिक उत्सव पहले ही शुरू हो गए थे। गैर-लाभकारी संस्था SarasCare द्वारा आयोजित निःशुल्क 'मेलबर्न दिवाली' उत्सव शनिवार, 31 अक्टूबर को डॉकलैंड्स के मार्वल स्टेडियम स्क्वेयर में दोपहर 2 बजे से रात 10 बजे तक होना तय था।", "शनिवार, 7 नवंबर को फ़्लिंडर्स स्ट्रीट स्थित इमिग्रेशन म्यूज़ियम में दिवाली की निःशुल्क गतिविधियाँ हुईं, जिनमें मेहंदी, रंगोली और पारंपरिक खेल शामिल थे। टिकट वाली भारतीय कढ़ाई कार्यशालाओं में लोगों ने 10 मीटर लंबी साझा कपड़ा-कलाकृति में अपना योगदान जोड़ा।", "दिवाली के आसपास मेलबर्न के कई हिंदू मंदिरों और सिख गुरुद्वारों में विशेष पूजा और दीवान होते हैं। सिखों के लिए यह दिन बंदी छोड़ दिवस भी है, जो गुरु हरगोबिंद साहिब जी की क़ैद से रिहाई की याद में मनाया जाता है। समय जानने के लिए अपने नज़दीकी मंदिर या गुरुद्वारे से संपर्क करें।", {"h": "आगे: गुरपुरब"}, "समुदाय में बहुतों के लिए अगली बड़ी तारीख़ इसी महीने गुरु नानक देव जी का प्रकाश पर्व (गुरपुरब) है। अलग-अलग कैलेंडर और समय-क्षेत्र के हिसाब से प्रकाशित पंचांगों में इसकी तारीख़ 24 या 25 नवंबर दी गई है, इसलिए नगर कीर्तन और दीवानों की तारीख़ अपने गुरुद्वारे से पक्की कर लें।"], "dek": "इस साल दिवाली रविवार, 8 नवंबर को है। शहर में उत्सव एक हफ़्ता पहले ही शुरू हो गए थे।", "headline": "दिवाली 2026: रोशनी के त्योहार के रंग में मेलबर्न"}, "image": {"addedAt": "2026-11-08T11:22:03Z", "addedBy": "claude", "alt": {"en": "Small lit clay oil lamps arranged around a larger central lamp on marigold petals and a white rangoli pattern on a stone floor."}, "caption": {"en": "Diyas, the traditional oil lamps lit for Diwali, arranged in a rangoli."}, "credit": "siddarth varanasi", "file": "images/diya-set-in-a-rangoli.jpg", "licence": "CC BY 2.0", "og": "og/diya-set-in-a-rangoli.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Diya_set_in_a_rangoli.jpg", "srcset": "img/diya-set-in-a-rangoli-800.webp 800w, img/diya-set-in-a-rangoli-1600.webp 1600w", "url": "img/diya-set-in-a-rangoli-1600.webp"}, "pa": {"body": ["ਚੰਦਰ ਕੈਲੰਡਰ ਮੁਤਾਬਕ ਇਸ ਸਾਲ ਦੀਵਾਲੀ ਐਤਵਾਰ, 8 ਨਵੰਬਰ ਨੂੰ ਹੈ। ਮੈਲਬਰਨ ਦੇ ਬਹੁਤ ਸਾਰੇ ਹਿੰਦੂ, ਸਿੱਖ ਅਤੇ ਜੈਨ ਪਰਿਵਾਰਾਂ ਲਈ ਇਹ ਦਿਨ ਅਰਦਾਸ-ਪੂਜਾ, ਦੀਵਿਆਂ, ਮਠਿਆਈਆਂ ਅਤੇ ਆਪਣਿਆਂ ਨੂੰ ਮਿਲਣ ਦਾ ਦਿਨ ਹੈ।", "ਜਨਤਕ ਜਸ਼ਨ ਪਹਿਲਾਂ ਹੀ ਸ਼ੁਰੂ ਹੋ ਗਏ ਸਨ। ਗੈਰ-ਮੁਨਾਫ਼ਾ ਸੰਸਥਾ SarasCare ਵੱਲੋਂ ਕਰਵਾਇਆ ਜਾਂਦਾ ਮੁਫ਼ਤ 'ਮੈਲਬਰਨ ਦੀਵਾਲੀ' ਮੇਲਾ ਸ਼ਨੀਵਾਰ, 31 ਅਕਤੂਬਰ ਨੂੰ ਡੌਕਲੈਂਡਜ਼ ਦੇ ਮਾਰਵਲ ਸਟੇਡੀਅਮ ਸਕੁਏਅਰ ਵਿੱਚ ਦੁਪਹਿਰ 2 ਵਜੇ ਤੋਂ ਰਾਤ 10 ਵਜੇ ਤੱਕ ਹੋਣਾ ਤੈਅ ਸੀ।", "ਸ਼ਨੀਵਾਰ, 7 ਨਵੰਬਰ ਨੂੰ ਫ਼ਲਿੰਡਰਜ਼ ਸਟ੍ਰੀਟ ਸਥਿਤ ਇਮੀਗ੍ਰੇਸ਼ਨ ਮਿਊਜ਼ੀਅਮ ਵਿੱਚ ਦੀਵਾਲੀ ਦੀਆਂ ਮੁਫ਼ਤ ਗਤੀਵਿਧੀਆਂ ਹੋਈਆਂ, ਜਿਨ੍ਹਾਂ ਵਿੱਚ ਮਹਿੰਦੀ, ਰੰਗੋਲੀ ਅਤੇ ਰਵਾਇਤੀ ਖੇਡਾਂ ਸ਼ਾਮਲ ਸਨ। ਟਿਕਟ ਵਾਲੀਆਂ ਭਾਰਤੀ ਕਢਾਈ ਵਰਕਸ਼ਾਪਾਂ ਵਿੱਚ ਲੋਕਾਂ ਨੇ 10 ਮੀਟਰ ਲੰਮੀ ਸਾਂਝੀ ਕੱਪੜਾ-ਕਲਾਕ੍ਰਿਤੀ ਵਿੱਚ ਆਪਣਾ ਹਿੱਸਾ ਪਾਇਆ।", "ਦੀਵਾਲੀ ਦੇ ਆਸ-ਪਾਸ ਮੈਲਬਰਨ ਦੇ ਕਈ ਹਿੰਦੂ ਮੰਦਰਾਂ ਅਤੇ ਗੁਰਦੁਆਰਿਆਂ ਵਿੱਚ ਖ਼ਾਸ ਪੂਜਾ ਅਤੇ ਦੀਵਾਨ ਸਜਦੇ ਹਨ। ਸਿੱਖਾਂ ਲਈ ਇਹ ਦਿਨ ਬੰਦੀ ਛੋੜ ਦਿਵਸ ਵੀ ਹੈ, ਜੋ ਗੁਰੂ ਹਰਗੋਬਿੰਦ ਸਾਹਿਬ ਜੀ ਦੀ ਕੈਦ ਤੋਂ ਰਿਹਾਈ ਦੀ ਯਾਦ ਵਿੱਚ ਮਨਾਇਆ ਜਾਂਦਾ ਹੈ। ਸਮੇਂ ਲਈ ਆਪਣੇ ਨੇੜਲੇ ਮੰਦਰ ਜਾਂ ਗੁਰਦੁਆਰੇ ਨਾਲ ਸੰਪਰਕ ਕਰੋ।", {"h": "ਅੱਗੇ: ਗੁਰਪੁਰਬ"}, "ਭਾਈਚਾਰੇ ਵਿੱਚ ਬਹੁਤਿਆਂ ਲਈ ਅਗਲੀ ਵੱਡੀ ਤਰੀਕ ਇਸੇ ਮਹੀਨੇ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦਾ ਪ੍ਰਕਾਸ਼ ਪੁਰਬ ਹੈ। ਵੱਖ-ਵੱਖ ਕੈਲੰਡਰਾਂ ਅਤੇ ਸਮਾਂ-ਖੇਤਰਾਂ ਮੁਤਾਬਕ ਛਪੀਆਂ ਜੰਤਰੀਆਂ ਵਿੱਚ ਇਸਦੀ ਤਰੀਕ 24 ਜਾਂ 25 ਨਵੰਬਰ ਦਿੱਤੀ ਗਈ ਹੈ, ਇਸ ਲਈ ਨਗਰ ਕੀਰਤਨ ਅਤੇ ਦੀਵਾਨਾਂ ਦੀ ਤਰੀਕ ਆਪਣੇ ਗੁਰਦੁਆਰੇ ਤੋਂ ਪੱਕੀ ਕਰ ਲਓ।"], "dek": "ਇਸ ਸਾਲ ਦੀਵਾਲੀ ਐਤਵਾਰ, 8 ਨਵੰਬਰ ਨੂੰ ਹੈ। ਸ਼ਹਿਰ ਵਿੱਚ ਜਸ਼ਨ ਇੱਕ ਹਫ਼ਤਾ ਪਹਿਲਾਂ ਹੀ ਸ਼ੁਰੂ ਹੋ ਗਏ ਸਨ।", "headline": "ਦੀਵਾਲੀ 2026: ਰੌਸ਼ਨੀਆਂ ਦੇ ਤਿਉਹਾਰ ਦੇ ਰੰਗ ਵਿੱਚ ਮੈਲਬਰਨ"}, "priority": 8, "risk": "green", "section": "culture", "slug": "diwali-2026-melbourne", "sources": [{"checked": "2026-11-08", "title": "Time Out Melbourne: Diwali in Melbourne 2026 (4 November 2026)", "url": "https://www.timeout.com/melbourne/news/from-festive-feasts-to-dance-parties-5-ways-to-celebrate-diwali-in-melbourne-110426"}, {"checked": "2026-11-08", "title": "Melbourne Diwali 2026: visitor guide (SarasCare)", "url": "https://www.melbournediwali.com.au/event-info"}, {"checked": "2026-11-08", "title": "City of Melbourne What's On: Diwali at the Immigration Museum", "url": "https://whatson.melbourne.vic.gov.au/things-to-do/diwali-at-the-immigration-museum"}], "status": "published", "translations": {"hi": "reviewed-by-claude", "pa": "reviewed-by-claude"}, "type": "news", "updated": "2026-11-08T11:22:03Z"}, {"approvedAt": "2026-11-08T20:02:36Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["When Prime Minister Anthony Albanese hosted Indian Prime Minister Narendra Modi for the third Australia–India Annual Summit in Melbourne in July, the two leaders reaffirmed their commitment to a Comprehensive Economic Cooperation Agreement (CECA). Modi said the two countries had decided to \"work at a fast pace\" on the CECA and on a bilateral investment treaty.", "India's Commerce Minister Piyush Goyal and Australia's Trade Minister Don Farrell discussed speeding up the negotiations when they met on the sidelines of the G20 trade ministers' meeting in Milwaukee on 30 September and 1 October, according to a post by Goyal. No timetable for concluding the agreement has been announced, The Indian Sun reported.", {"h": "What is already in place"}, "The interim Economic Cooperation and Trade Agreement (ECTA) has been in force since 29 December 2022. From 1 January 2026, eligible Indian goods gained duty-free access across all Australian tariff lines, subject to rules of origin.", "India was Australia's sixth-largest trading partner in 2025, with two-way trade in goods and services worth A$50.2 billion, according to the Department of Foreign Affairs and Trade.", {"h": "What the Melbourne summit agreed"}, {"ul": ["A Joint Declaration on Defence and Security Cooperation, and a new partnership on cyber, critical technologies and supply chains.", "An arrangement enabling long-term Australian uranium exports to India, for peaceful purposes only and under international (IAEA) safeguards.", "Approval for Melbourne's Victoria University to operate a campus in Gurugram, and a letter of intent for a Flinders University campus in Bengaluru.", "$10 million for the Centre for Australia-India Relations' Maitri grants, which support business and people-to-people links.", "A temporary space tracking terminal on the Cocos (Keeling) Islands to support India's Gaganyaan human spaceflight program."]}, "\"Our partnership has never been stronger,\" Albanese said after the talks. Modi said the relationship was \"not just a partnership for the present; it is also a partnership for the future.\"", {"h": "What it means for Melbourne businesses"}, "A fuller agreement could widen market access for services and investment. Any final agreement would still need to pass through Australia's treaty processes, including tabling in Parliament, law firm Clayton Utz noted in July."], "dek": "Leaders agreed in Melbourne in July to move faster on a comprehensive economic agreement. Trade ministers met again in October, but no date has been set to finish the deal.", "headline": "After the Melbourne summit, where does the India–Australia trade deal stand?"}, "figure": {"en": "two-way trade, 2025", "value": "A$50.2bn"}, "image": {"addedAt": "2026-11-08T11:22:03Z", "addedBy": "claude", "alt": {"en": "Red-and-white container cranes beside two container ships stacked with shipping containers at the Port of Melbourne under a cloudy sky."}, "caption": {"en": "The container terminal at the Port of Melbourne, one of the gateways for Australia's trade with India."}, "credit": "Bernard Spragg. NZ from Christchurch, New Zealand", "file": "images/port-of-melbourne-container-terminal.jpg", "licence": "CC0", "og": "og/port-of-melbourne-container-terminal.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Container_terminal._Port_of_Melbourne._(21891290959).jpg", "srcset": "img/port-of-melbourne-container-terminal-800.webp 800w, img/port-of-melbourne-container-terminal-1600.webp 1600w", "url": "img/port-of-melbourne-container-terminal-1600.webp"}, "priority": 8, "risk": "amber", "section": "india", "slug": "india-australia-trade-after-melbourne-summit", "sources": [{"checked": "2026-11-08", "title": "Prime Minister of Australia: Third Australia–India Annual Summit joint statement (9 July 2026)", "url": "https://www.pm.gov.au/media/australia-india-joint-statement"}, {"checked": "2026-11-08", "title": "Prime Minister of Australia: Joint media statement, Melbourne (9 July 2026)", "url": "https://www.pm.gov.au/media/joint-media-statement-melbourne"}, {"checked": "2026-11-08", "title": "The Indian Sun: India, Australia push to accelerate comprehensive trade deal (4 October 2026)", "url": "https://www.theindiansun.com.au/2026/10/04/india-australia-push-to-accelerate-comprehensive-trade-deal/"}, {"checked": "2026-11-08", "title": "Clayton Utz: The Australia–India Annual Summit, from ECTA to CECA (16 July 2026)", "url": "https://www.claytonutz.com/insights/2026/july/the-australia-india-annual-summit-from-ecta-to-ceca-and-what-it-means-for-business"}, {"checked": "2026-11-09", "title": "Department of Foreign Affairs and Trade: India country brief", "url": "https://www.dfat.gov.au/geo/india/india-country-brief"}], "status": "published", "type": "analysis", "updated": "2026-11-08T20:02:36Z"}, {"approvedAt": "2026-11-08T20:02:36Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["India has overtaken England as the most common overseas country of birth for people living in Australia, according to Australian Bureau of Statistics figures released on 29 April 2026.", "About 971,000 India-born people were living in Australia at 30 June 2025, with the England-born population also at about 971,000. India narrowly overtook England during 2025, the first time it has held the top position.", "The India-born population also recorded the largest increase of any birthplace group since 2015, rising by 522,000. The Italy-born and England-born populations recorded the largest decreases over the same period.", "Overall, 8.8 million people living in Australia, or 32 per cent of the population, were born overseas.", {"h": "Recognised at the Melbourne summit"}, "The milestone was noted in July, when Prime Minister Anthony Albanese and Indian Prime Minister Narendra Modi met in Melbourne. Their joint statement said the Indian community in Australia was \"now Australia's largest overseas-born group\".", {"note": "The ABS release did not include a state-by-state breakdown. We will report Victorian figures when they are published."}], "dek": "About 971,000 people living in Australia were born in India, narrowly ahead of England, according to the Australian Bureau of Statistics.", "headline": "India is now Australia's largest overseas-born community"}, "figure": {"en": "India-born people in Australia", "hi": "ऑस्ट्रेलिया में भारत में जन्मे लोग", "pa": "ਆਸਟ੍ਰੇਲੀਆ ਵਿੱਚ ਭਾਰਤ 'ਚ ਜੰਮੇ ਲੋਕ", "value": "971,000"}, "image": {"addedAt": "2026-11-08T20:13:38Z", "addedBy": "claude", "alt": {"en": "The ornate cream entrance towers of Shri Shiva Vishnu Temple in Carrum Downs, with visitors, some in saris, walking in front under a blue sky."}, "caption": {"en": "Shri Shiva Vishnu Temple in Carrum Downs, in Melbourne's south-east."}, "credit": "கோபி", "file": "images/shri-shiva-vishnu-temple-carrum-downs.jpg", "licence": "CC0", "og": "og/shri-shiva-vishnu-temple-carrum-downs.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Shiva_vishnu_koyil.jpg", "srcset": "img/shri-shiva-vishnu-temple-carrum-downs-800.webp 800w, img/shri-shiva-vishnu-temple-carrum-downs-1600.webp 1600w", "url": "img/shri-shiva-vishnu-temple-carrum-downs-1600.webp"}, "priority": 9, "risk": "green", "section": "community", "slug": "india-largest-overseas-born-group", "sources": [{"checked": "2026-11-08", "title": "Australian Bureau of Statistics: 8 things of interest about Australia's overseas-born population (29 April 2026)", "url": "https://www.abs.gov.au/media-centre/media-releases/8-things-interest-about-australias-overseas-born-population"}, {"checked": "2026-11-08", "title": "Australian Bureau of Statistics: Australia's population by country of birth, June 2025", "url": "https://www.abs.gov.au/statistics/people/population/australias-population-country-birth/latest-release"}, {"checked": "2026-11-08", "title": "Prime Minister of Australia: Third Australia–India Annual Summit joint statement (9 July 2026)", "url": "https://www.pm.gov.au/media/australia-india-joint-statement"}], "status": "published", "type": "news", "updated": "2026-11-08T20:13:38Z"}, {"approvedAt": "2026-11-08T12:32:11Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["Indian passport, visa and other consular applications in Australia are now handled through six VFS Global centres, in Adelaide, Brisbane, Canberra, Melbourne, Perth and Sydney, VFS Global said in July.", "The Melbourne centre is on the ground floor of 324 St Kilda Road, Melbourne. Applicants book an appointment online through VFS Global's India–Australia portal. Applications are taken Monday to Friday, 8.30am to 4pm, except on public holidays and holidays declared by the Indian mission.", {"h": "The cost"}, "A VFS Global service charge of $115 per application applies from 23 July 2026, in addition to the Government of India fee, SBS Hindi reported, citing an announcement by the High Commission of India.", {"h": "Why services stopped in July"}, "New passport and visa applications in Australia were suspended from 1 July while a dispute over the tender for India's outsourced consular services went through the Indian courts, Bloomberg reported. The High Commission of India in Canberra announced the restart on 23 July.", "In May, SBS Hindi reported that India's Consul General in Melbourne, Anish Rajan, had announced a move from the Swanston Street office to a larger centre on St Kilda Road, with extra counters to shorten booking waits.", {"h": "Before you book"}, {"ul": ["Book only through the official VFS Global website for Indian services in Australia.", "Check the current document checklist for your service before your appointment.", "Allow extra time, as appointment availability can change, particularly around holidays."]}, {"note": "Fees and procedures can change. Check the High Commission of India and VFS Global websites before you apply."}], "dek": "Indian consular applications in Victoria now go through a VFS Global centre on St Kilda Road, with a $115 service charge per application on top of government fees.", "headline": "Indian passport, visa and OCI services in Melbourne: what changed in 2026"}, "figure": {"en": "VFS service charge per application", "hi": "प्रति आवेदन VFS सेवा शुल्क", "pa": "ਪ੍ਰਤੀ ਅਰਜ਼ੀ VFS ਸੇਵਾ ਫ਼ੀਸ", "value": "$115"}, "image": {"addedAt": "2026-11-08T11:22:03Z", "addedBy": "claude", "alt": {"en": "A long yellow tram covered in advertising travelling along St Kilda Road, with trees behind and a grass median in front."}, "caption": {"en": "A tram on St Kilda Road, where the VFS Global centre for Indian consular services in Melbourne is located."}, "credit": "Ymblanter", "file": "images/tram-3510-st-kilda-road.jpg", "licence": "CC BY-SA 4.0", "og": "og/tram-3510-st-kilda-road.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Melbourne_Tram_3510_on_St_Kilda_Road.jpg", "srcset": "img/tram-3510-st-kilda-road-800.webp 800w, img/tram-3510-st-kilda-road-1600.webp 1600w", "url": "img/tram-3510-st-kilda-road-1600.webp"}, "priority": 7, "risk": "green", "section": "community", "slug": "indian-consular-services-melbourne", "sources": [{"checked": "2026-11-08", "title": "VFS Global media release: India consular services launch in Australia (24 July 2026)", "url": "https://www.vfsglobal.com/en/PDF/media-releases/2026/Media-release_India-consular-services-launch-in-Australia_Jul-2026.pdf"}, {"checked": "2026-11-08", "title": "Business Standard / Bloomberg: India restarts visa, passport services in Australia after 23-day halt (23 July 2026)", "url": "https://www.business-standard.com/immigration/india-restarts-visa-passport-services-in-australia-after-23-day-halt-126072300777_1.html"}, {"checked": "2026-11-08", "title": "SBS Hindi: Indian passport and consular services get costlier as VFS fee rises to $115 (23 July 2026)", "url": "https://www.sbs.com.au/language/hindi/en/podcast-episode/indian-passport-and-consular-services-in-australia-get-costlier-as-vfs-fee-soars-to-115/ov3ml4nfr"}, {"checked": "2026-11-08", "title": "SBS Hindi: New, larger VFS centre for Victoria (19 May 2026)", "url": "https://www.sbs.com.au/language/hindi/en/podcast-episode/major-upgrade-for-victorias-growing-indian-diaspora-as-a-new-larger-vfs-centre-to-open-soon/ezqtcs9xd"}, {"checked": "2026-11-08", "title": "High Commission of India, Canberra: Modes of payment and fee schedule (VFS charges are extra)", "url": "https://hcicanberra.gov.in/page/modes-of-payment-and-fee-schedule"}], "status": "published", "type": "guide", "updated": "2026-11-08T12:32:11Z"}, {"approvedAt": "2026-11-08T20:02:36Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["The federal government has set the 2027 National Planning Level for new international student commencements at 295,000, unchanged from 2026, Study Australia announced in July.", "The government says the planning level is not a cap on student numbers. Student visa applications are processed as a priority until a student's chosen provider reaches 80 per cent of its allocation. Applications after that point are still accepted but processed more slowly.", "No active provider will receive a lower allocation in 2027 than in 2026, and TAFE students remain exempt from the planning level, The PIE News reported.", {"h": "Visa costs"}, "The student visa (subclass 500) application fee starts at A$2,500, according to the Department of Home Affairs. A lower fee applies to some applicants, including those enrolling in standalone English language (ELICOS) or non-award courses.", {"h": "What ministers said"}, "Education Minister Jason Clare said, as reported by The PIE News: \"International education is an incredibly important export industry for Australia, but we need to manage it sustainably.\"", {"h": "Melbourne's education links with India"}, "Melbourne's Victoria University received approval in July to open a campus in Gurugram, near Delhi. The university said the campus would teach through its block model, with students studying one subject at a time in four-week blocks, and that it was scheduled to open in August 2026.", {"note": "This is general information, not migration advice. For advice about your circumstances, speak to a registered migration agent or check the Department of Home Affairs website."}], "dek": "The federal government has kept the planning level for new international students at 295,000 for 2027, unchanged from this year.", "headline": "International student numbers for 2027: what Indian students in Melbourne need to know"}, "figure": {"en": "new international students planned for 2027", "value": "295,000"}, "image": {"addedAt": "2026-11-08T11:22:03Z", "addedBy": "claude", "alt": {"en": "Victoria University buildings at the Footscray Park campus, seen across a wide green lawn with parked cars below."}, "caption": {"en": "Victoria University's Footscray Park campus; the university has approval to open a campus in Gurugram, India."}, "credit": "Melburnian", "file": "images/victoria-university-footscray-park.jpg", "licence": "CC BY 2.5", "og": "og/victoria-university-footscray-park.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Victoria_University_Footscray_Park.jpg", "srcset": "img/victoria-university-footscray-park-800.webp 800w, img/victoria-university-footscray-park-1600.webp 1600w", "url": "img/victoria-university-footscray-park-1600.webp"}, "priority": 7, "risk": "amber", "section": "education", "slug": "international-students-2027-settings", "sources": [{"checked": "2026-11-08", "title": "Study Australia: Australia confirms international education settings for 2027 (15 July 2026)", "url": "https://www.studyaustralia.gov.au/en/tools-and-resources/news/australia-confirms-international-education-settings-for-2027"}, {"checked": "2026-11-08", "title": "The PIE News: Australia maintains 2027 international student planning level at 295,000 (3 July 2026)", "url": "https://thepienews.com/australia-maintains-2027-international-student-planning-level-at-295000/"}, {"checked": "2026-11-08", "title": "Victoria University: Victoria University gains approval for India campus (9 July 2026)", "url": "https://www.vu.edu.au/about-vu/news-events/news/victoria-university-gains-approval-for-india-campus"}, {"checked": "2026-11-09", "title": "Department of Home Affairs: Subclass 500 Student visa", "url": "https://immi.homeaffairs.gov.au/visas/getting-a-visa/visa-listing/student-500"}], "status": "published", "type": "explainer", "updated": "2026-11-08T20:02:36Z"}, {"approvedAt": "2026-11-08T20:02:36Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["The City of Melbourne's 2026–27 budget includes more than $1.2 million to keep developing a Little India precinct in Docklands. The council's aim is a recognisable cultural destination alongside Chinatown and Koreatown, built through infrastructure, events and creative projects.", "The funding was first flagged in the council's draft budget in March. Councillor Philip Le Liu said at the time, Melbourning reported: \"As Australia's most multicultural city, we're taking big steps to make Little India a reality.\"", {"h": "What happens next"}, "In its response to budget consultation, the council said it would focus on \"testing future ideas for Little India\". It has committed to engaging extensively with Docklands residents and Indian communities, and to running trial experiences so people can try ideas and help shape future plans.", "More than 550 people contributed to the council's wider budget consultation, which ran from 31 March to 28 April.", "No opening date has been announced. Lord Mayor Nick Reece discussed the project with SBS Hindi in May, and SBS reported that he had invited Indian Prime Minister Narendra Modi to an official opening.", {"h": "Residents' concerns"}, "Local newspaper Docklands News reported that the council's consultation summary found a minority of submissions supported a Little India in Docklands, while most urged caution about a single-theme precinct. Concerns included top-down delivery and money being diverted from the suburb's other needs, with many residents pointing to greening, shade, wind protection and better public spaces.", "The council has kept the $1.2 million commitment but is taking a staged approach that starts with trial activations, the paper reported. Council officers have said no exact location has been chosen, and the council has committed to finalising a Docklands public realm improvements plan.", "At a budget hearing on 12 May, Federation of Indian Associations of Victoria president Vasan Srinivasan called the funding a \"positive and historic beginning\", but said a world-class precinct would need between $5 million and $10 million, Docklands News reported.", {"h": "The backlash"}, "The proposal has also drawn what The Australia Today described in April as \"negative and, at times, racist commentary\". Mr Srinivasan launched a petition in support of the precinct, the outlet reported.", "Victoria's strengthened anti-vilification laws, which added new civil protections from 15 April 2026, apply to public conduct online as well as offline.", {"note": "We will report consultation dates for Little India as soon as the council announces them."}], "dek": "The City of Melbourne has set aside more than $1.2 million to develop a Little India precinct in Docklands, but no site has been chosen and many local residents have urged caution.", "headline": "Little India in Docklands: where Melbourne's precinct plan stands"}, "figure": {"en": "for Little India in Docklands", "value": "$1.2m"}, "image": {"addedAt": "2026-11-08T11:22:03Z", "addedBy": "claude", "alt": {"en": "Panoramic view across the still water of Victoria Harbour in Docklands towards the stadium, apartment towers and Melbourne's city skyline."}, "caption": {"en": "Docklands, where the City of Melbourne is developing a Little India precinct, seen from Waterfront City in 2006."}, "credit": "jjron", "file": "images/docklands-from-waterfront-city.jpg", "licence": "CC BY-SA 3.0", "og": "og/docklands-from-waterfront-city.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Melbourne_from_Waterfront_City,_Docklands_Pano,_20.07.06.jpg", "srcset": "img/docklands-from-waterfront-city-800.webp 800w, img/docklands-from-waterfront-city-1600.webp 1600w", "url": "img/docklands-from-waterfront-city-1600.webp"}, "priority": 8, "risk": "amber", "section": "community", "slug": "little-india-docklands", "sources": [{"checked": "2026-11-08", "title": "Melbourning: City of Melbourne's draft budget includes plans to light up Melbourne and expand cultural precincts (31 March 2026)", "url": "https://www.melbourning.com.au/2026/03/31/city-of-melbournes-draft-budget-includes-plans-to-light-up-melbourne-and-expand-cultural-precincts/"}, {"checked": "2026-11-08", "title": "Participate Melbourne: Budget 2026–27, what we heard", "url": "https://participate.melbourne.vic.gov.au/budget-2026-27/what-we-heard"}, {"checked": "2026-11-08", "title": "SBS Hindi: Melbourne's Little India project accelerates (1 May 2026)", "url": "https://www.sbs.com.au/language/hindi/en/podcast-episode/melbournes-little-india-project-accelerates-lord-mayor-invites-pm-modi-for-the-official-opening/a0ly5uiuy"}, {"checked": "2026-11-08", "title": "The Australia Today: Premier Carroll reaches out to Indian Victorians (8 September 2026)", "url": "https://www.theaustraliatoday.com.au/we-respect-you-premier-carroll-reaches-out-to-indian-victorians-amid-rising-anti-indian-rhetoric/"}, {"checked": "2026-11-08", "title": "Victorian Government: New protections against vilification", "url": "https://www.vic.gov.au/new-protections-against-vilification"}, {"checked": "2026-11-09", "title": "Docklands News: Little India precinct debate puts Docklands' future in sharper focus", "url": "https://www.docklandsnews.com.au/little-india-precinct-debate-puts-docklands-future-in-sharper-focus"}, {"checked": "2026-11-09", "title": "The Australia Today: Community urged to stand united against racist backlash as Melbourne unveils $1.2m Little India precinct plan (24 April 2026)", "url": "https://www.theaustraliatoday.com.au/?p=117404"}], "status": "published", "type": "explainer", "updated": "2026-11-08T20:02:36Z"}, {"byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["Community associations, temples, gurdwaras, cultural groups and trader associations can apply for Victorian Government funding, but most rounds open once a year and close within a few weeks. All three of the main 2026 programs below have now closed.", {"h": "Multicultural Festivals and Events Program 2026–27"}, "Grants ranged from $5,000 for smaller community events to $50,000 for events of any size, with a further $1 million set aside for events in rural and regional Victoria. Events had to be free, inclusive, accessible and culturally safe. Applications closed on 17 April 2026.", {"h": "Multicultural Capacity Building Program"}, "This $5 million program had three streams offering up to $10,000, $100,000 or $400,000 for skills, partnerships and leadership, and for day-to-day costs such as IT systems and business planning. Organisations from new and emerging communities, and from rural and regional areas, were a priority. Applications closed on 19 February 2026.", {"h": "Multicultural Business Skills Fund"}, "This fund offered $5,000 grants to not-for-profit business associations, such as trader groups and chambers of commerce, to run advice, training or mentoring for multicultural small business owners and their staff. Each project needed at least 10 participants. Applications closed at 4pm on 28 September 2026, and funded projects must be finished by 26 February 2027.", {"h": "Getting ready for the next round"}, {"ul": ["Make sure your organisation has a current ABN and is registered with the right regulator. The business skills fund required both.", "Keep a short description of your organisation, its members and its past events ready to adapt.", "Watch the Victorian Government's multicultural grants pages from early in the year. In 2026 the capacity building and festivals rounds were announced in January and March."]}, {"note": "Programs for 2027 have not been announced. Rules and amounts may change."}], "dek": "Three Victorian Government funding rounds for multicultural groups and businesses have closed. Here is what they offered, so your organisation can plan ahead.", "headline": "Missed this year's multicultural grants? What ran in 2026, and how to be ready next time"}, "figure": {"en": "smallest grant on offer in 2026", "hi": "2026 में सबसे छोटा अनुदान", "pa": "2026 ਵਿੱਚ ਸਭ ਤੋਂ ਛੋਟੀ ਗ੍ਰਾਂਟ", "value": "$5k"}, "hi": {"body": ["सामुदायिक संघ, मंदिर, गुरुद्वारे, सांस्कृतिक समूह और व्यापारी संघ विक्टोरियाई सरकार से फ़ंडिंग के लिए आवेदन कर सकते हैं, लेकिन ज़्यादातर दौर साल में एक बार खुलते हैं और कुछ ही हफ़्तों में बंद हो जाते हैं। नीचे दिए गए 2026 के तीनों मुख्य कार्यक्रम अब बंद हो चुके हैं।", {"h": "बहुसांस्कृतिक उत्सव और कार्यक्रम योजना 2026–27"}, "छोटे सामुदायिक कार्यक्रमों के लिए $5,000 से लेकर किसी भी आकार के कार्यक्रम के लिए $50,000 तक के अनुदान थे, और ग्रामीण व क्षेत्रीय विक्टोरिया के कार्यक्रमों के लिए अलग से $1 मिलियन रखे गए। कार्यक्रमों का निःशुल्क, सबके लिए खुला, सुलभ और सांस्कृतिक रूप से सुरक्षित होना ज़रूरी था। आवेदन 17 अप्रैल 2026 को बंद हुए।", {"h": "बहुसांस्कृतिक क्षमता निर्माण कार्यक्रम"}, "$5 मिलियन के इस कार्यक्रम में तीन श्रेणियाँ थीं, जिनमें कौशल, साझेदारी और नेतृत्व के लिए, और आईटी सिस्टम व व्यावसायिक योजना जैसे रोज़मर्रा के ख़र्चों के लिए $10,000, $100,000 या $400,000 तक मिल सकते थे। नए और उभरते समुदायों तथा ग्रामीण व क्षेत्रीय इलाक़ों के संगठनों को प्राथमिकता दी गई। आवेदन 19 फ़रवरी 2026 को बंद हुए।", {"h": "बहुसांस्कृतिक व्यवसाय कौशल कोष"}, "इस कोष में गैर-लाभकारी व्यापार संघों, जैसे ट्रेडर समूहों और चैंबर ऑफ़ कॉमर्स, को $5,000 के अनुदान दिए गए, ताकि वे बहुसांस्कृतिक छोटे व्यवसायों के मालिकों और कर्मचारियों के लिए सलाह, प्रशिक्षण या मार्गदर्शन दे सकें। हर परियोजना में कम से कम 10 प्रतिभागी ज़रूरी थे। आवेदन 28 सितंबर 2026 को शाम 4 बजे बंद हुए, और स्वीकृत परियोजनाएँ 26 फ़रवरी 2027 तक पूरी करनी होंगी।", {"h": "अगले दौर की तैयारी"}, {"ul": ["सुनिश्चित करें कि आपके संगठन के पास वैध ABN हो और वह सही नियामक संस्था के पास पंजीकृत हो। व्यवसाय कौशल कोष के लिए दोनों ज़रूरी थे।", "अपने संगठन, उसके सदस्यों और पिछले कार्यक्रमों का छोटा विवरण तैयार रखें, जिसे ज़रूरत के हिसाब से बदला जा सके।", "साल की शुरुआत से ही विक्टोरियाई सरकार के बहुसांस्कृतिक अनुदान पृष्ठों पर नज़र रखें। 2026 में क्षमता निर्माण और उत्सव वाले दौर जनवरी और मार्च में घोषित हुए थे।"]}, {"note": "2027 के कार्यक्रमों की घोषणा अभी नहीं हुई है। नियम और राशि बदल सकती हैं।"}], "dek": "बहुसांस्कृतिक संगठनों और व्यवसायों के लिए विक्टोरियाई सरकार के तीन फ़ंडिंग दौर बंद हो चुके हैं। जानिए उनमें क्या था, ताकि आपका संगठन पहले से योजना बना सके।", "headline": "इस साल के बहुसांस्कृतिक अनुदान छूट गए? 2026 में क्या मिला और अगली बार कैसे तैयार रहें"}, "image": {"addedAt": "2026-11-08T11:22:03Z", "addedBy": "claude", "alt": {"en": "The paved plaza and terraced steps of Federation Square in Melbourne, with gum trees, flags and angular buildings under a blue sky."}, "caption": {"en": "Federation Square in central Melbourne; the Victorian Government's multicultural programs fund free community festivals and events."}, "credit": "DXR", "file": "images/fed-square-north-view.jpg", "licence": "CC BY-SA 4.0", "og": "og/fed-square-north-view.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Fed_Square,_Melbourne,_north_view_20230219_1.jpg", "srcset": "img/fed-square-north-view-800.webp 800w, img/fed-square-north-view-1600.webp 1600w", "url": "img/fed-square-north-view-1600.webp"}, "pa": {"body": ["ਭਾਈਚਾਰਕ ਸਭਾਵਾਂ, ਮੰਦਰ, ਗੁਰਦੁਆਰੇ, ਸੱਭਿਆਚਾਰਕ ਗਰੁੱਪ ਅਤੇ ਵਪਾਰੀ ਸੰਘ ਵਿਕਟੋਰੀਆ ਸਰਕਾਰ ਤੋਂ ਫ਼ੰਡਿੰਗ ਲਈ ਅਰਜ਼ੀ ਦੇ ਸਕਦੇ ਹਨ, ਪਰ ਬਹੁਤੇ ਗੇੜ ਸਾਲ ਵਿੱਚ ਇੱਕ ਵਾਰ ਖੁੱਲ੍ਹਦੇ ਹਨ ਅਤੇ ਕੁਝ ਹਫ਼ਤਿਆਂ ਵਿੱਚ ਬੰਦ ਹੋ ਜਾਂਦੇ ਹਨ। ਹੇਠਾਂ ਦਿੱਤੇ 2026 ਦੇ ਤਿੰਨੇ ਮੁੱਖ ਪ੍ਰੋਗਰਾਮ ਹੁਣ ਬੰਦ ਹੋ ਚੁੱਕੇ ਹਨ।", {"h": "ਬਹੁ-ਸੱਭਿਆਚਾਰਕ ਤਿਉਹਾਰ ਅਤੇ ਸਮਾਗਮ ਪ੍ਰੋਗਰਾਮ 2026–27"}, "ਛੋਟੇ ਭਾਈਚਾਰਕ ਸਮਾਗਮਾਂ ਲਈ $5,000 ਤੋਂ ਲੈ ਕੇ ਕਿਸੇ ਵੀ ਆਕਾਰ ਦੇ ਸਮਾਗਮ ਲਈ $50,000 ਤੱਕ ਦੀਆਂ ਗ੍ਰਾਂਟਾਂ ਸਨ, ਅਤੇ ਪੇਂਡੂ ਤੇ ਖੇਤਰੀ ਵਿਕਟੋਰੀਆ ਦੇ ਸਮਾਗਮਾਂ ਲਈ ਵੱਖਰੇ ਤੌਰ 'ਤੇ $1 ਮਿਲੀਅਨ ਰੱਖੇ ਗਏ। ਸਮਾਗਮਾਂ ਦਾ ਮੁਫ਼ਤ, ਸਾਰਿਆਂ ਲਈ ਖੁੱਲ੍ਹਾ, ਪਹੁੰਚਯੋਗ ਅਤੇ ਸੱਭਿਆਚਾਰਕ ਤੌਰ 'ਤੇ ਸੁਰੱਖਿਅਤ ਹੋਣਾ ਜ਼ਰੂਰੀ ਸੀ। ਅਰਜ਼ੀਆਂ 17 ਅਪ੍ਰੈਲ 2026 ਨੂੰ ਬੰਦ ਹੋਈਆਂ।", {"h": "ਬਹੁ-ਸੱਭਿਆਚਾਰਕ ਸਮਰੱਥਾ ਨਿਰਮਾਣ ਪ੍ਰੋਗਰਾਮ"}, "$5 ਮਿਲੀਅਨ ਦੇ ਇਸ ਪ੍ਰੋਗਰਾਮ ਵਿੱਚ ਤਿੰਨ ਸ਼੍ਰੇਣੀਆਂ ਸਨ, ਜਿਨ੍ਹਾਂ ਵਿੱਚ ਹੁਨਰ, ਭਾਈਵਾਲੀਆਂ ਅਤੇ ਲੀਡਰਸ਼ਿਪ ਲਈ, ਅਤੇ ਆਈਟੀ ਸਿਸਟਮ ਤੇ ਕਾਰੋਬਾਰੀ ਯੋਜਨਾਬੰਦੀ ਵਰਗੇ ਰੋਜ਼ਾਨਾ ਖ਼ਰਚਿਆਂ ਲਈ $10,000, $100,000 ਜਾਂ $400,000 ਤੱਕ ਮਿਲ ਸਕਦੇ ਸਨ। ਨਵੇਂ ਅਤੇ ਉੱਭਰ ਰਹੇ ਭਾਈਚਾਰਿਆਂ ਅਤੇ ਪੇਂਡੂ ਤੇ ਖੇਤਰੀ ਇਲਾਕਿਆਂ ਦੀਆਂ ਸੰਸਥਾਵਾਂ ਨੂੰ ਪਹਿਲ ਦਿੱਤੀ ਗਈ। ਅਰਜ਼ੀਆਂ 19 ਫ਼ਰਵਰੀ 2026 ਨੂੰ ਬੰਦ ਹੋਈਆਂ।", {"h": "ਬਹੁ-ਸੱਭਿਆਚਾਰਕ ਕਾਰੋਬਾਰੀ ਹੁਨਰ ਫ਼ੰਡ"}, "ਇਸ ਫ਼ੰਡ ਵਿੱਚ ਗੈਰ-ਮੁਨਾਫ਼ਾ ਵਪਾਰਕ ਸੰਘਾਂ, ਜਿਵੇਂ ਵਪਾਰੀ ਗਰੁੱਪਾਂ ਅਤੇ ਚੈਂਬਰ ਆਫ਼ ਕਾਮਰਸ, ਨੂੰ $5,000 ਦੀਆਂ ਗ੍ਰਾਂਟਾਂ ਦਿੱਤੀਆਂ ਗਈਆਂ, ਤਾਂ ਜੋ ਉਹ ਬਹੁ-ਸੱਭਿਆਚਾਰਕ ਛੋਟੇ ਕਾਰੋਬਾਰਾਂ ਦੇ ਮਾਲਕਾਂ ਅਤੇ ਮੁਲਾਜ਼ਮਾਂ ਲਈ ਸਲਾਹ, ਸਿਖਲਾਈ ਜਾਂ ਰਹਿਨੁਮਾਈ ਦੇ ਸਕਣ। ਹਰ ਪ੍ਰੋਜੈਕਟ ਵਿੱਚ ਘੱਟੋ-ਘੱਟ 10 ਭਾਗੀਦਾਰ ਜ਼ਰੂਰੀ ਸਨ। ਅਰਜ਼ੀਆਂ 28 ਸਤੰਬਰ 2026 ਨੂੰ ਸ਼ਾਮ 4 ਵਜੇ ਬੰਦ ਹੋਈਆਂ, ਅਤੇ ਮਨਜ਼ੂਰ ਪ੍ਰੋਜੈਕਟ 26 ਫ਼ਰਵਰੀ 2027 ਤੱਕ ਪੂਰੇ ਕਰਨੇ ਹੋਣਗੇ।", {"h": "ਅਗਲੇ ਗੇੜ ਦੀ ਤਿਆਰੀ"}, {"ul": ["ਯਕੀਨੀ ਬਣਾਓ ਕਿ ਤੁਹਾਡੀ ਸੰਸਥਾ ਕੋਲ ਚਾਲੂ ABN ਹੋਵੇ ਅਤੇ ਉਹ ਸਹੀ ਰੈਗੂਲੇਟਰ ਕੋਲ ਰਜਿਸਟਰਡ ਹੋਵੇ। ਕਾਰੋਬਾਰੀ ਹੁਨਰ ਫ਼ੰਡ ਲਈ ਦੋਵੇਂ ਜ਼ਰੂਰੀ ਸਨ।", "ਆਪਣੀ ਸੰਸਥਾ, ਇਸਦੇ ਮੈਂਬਰਾਂ ਅਤੇ ਪਿਛਲੇ ਸਮਾਗਮਾਂ ਦਾ ਛੋਟਾ ਵੇਰਵਾ ਤਿਆਰ ਰੱਖੋ, ਜਿਸਨੂੰ ਲੋੜ ਮੁਤਾਬਕ ਬਦਲਿਆ ਜਾ ਸਕੇ।", "ਸਾਲ ਦੇ ਸ਼ੁਰੂ ਤੋਂ ਹੀ ਵਿਕਟੋਰੀਆ ਸਰਕਾਰ ਦੇ ਬਹੁ-ਸੱਭਿਆਚਾਰਕ ਗ੍ਰਾਂਟਾਂ ਵਾਲੇ ਪੰਨਿਆਂ 'ਤੇ ਨਜ਼ਰ ਰੱਖੋ। 2026 ਵਿੱਚ ਸਮਰੱਥਾ ਨਿਰਮਾਣ ਅਤੇ ਤਿਉਹਾਰਾਂ ਵਾਲੇ ਗੇੜਾਂ ਦਾ ਐਲਾਨ ਜਨਵਰੀ ਅਤੇ ਮਾਰਚ ਵਿੱਚ ਹੋਇਆ ਸੀ।"]}, {"note": "2027 ਦੇ ਪ੍ਰੋਗਰਾਮਾਂ ਦਾ ਐਲਾਨ ਅਜੇ ਨਹੀਂ ਹੋਇਆ। ਨਿਯਮ ਅਤੇ ਰਕਮਾਂ ਬਦਲ ਸਕਦੀਆਂ ਹਨ।"}], "dek": "ਬਹੁ-ਸੱਭਿਆਚਾਰਕ ਸੰਸਥਾਵਾਂ ਅਤੇ ਕਾਰੋਬਾਰਾਂ ਲਈ ਵਿਕਟੋਰੀਆ ਸਰਕਾਰ ਦੇ ਤਿੰਨ ਫ਼ੰਡਿੰਗ ਗੇੜ ਬੰਦ ਹੋ ਚੁੱਕੇ ਹਨ। ਜਾਣੋ ਉਨ੍ਹਾਂ ਵਿੱਚ ਕੀ ਸੀ, ਤਾਂ ਜੋ ਤੁਹਾਡੀ ਸੰਸਥਾ ਪਹਿਲਾਂ ਤੋਂ ਯੋਜਨਾ ਬਣਾ ਸਕੇ।", "headline": "ਇਸ ਸਾਲ ਦੀਆਂ ਬਹੁ-ਸੱਭਿਆਚਾਰਕ ਗ੍ਰਾਂਟਾਂ ਖੁੰਝ ਗਈਆਂ? 2026 ਵਿੱਚ ਕੀ ਮਿਲਿਆ ਅਤੇ ਅਗਲੀ ਵਾਰ ਕਿਵੇਂ ਤਿਆਰ ਰਹੀਏ"}, "priority": 5, "risk": "green", "section": "business", "slug": "multicultural-grants-2026", "sources": [{"checked": "2026-11-08", "title": "Premier of Victoria: Keeping Victoria's multicultural celebrations affordable (19 March 2026)", "url": "https://www.premier.vic.gov.au/keeping-victorias-multicultural-celebrations-affordable"}, {"checked": "2026-11-08", "title": "Premier of Victoria: New funding for grassroots multicultural groups (15 January 2026)", "url": "https://www.premier.vic.gov.au/new-funding-grassroots-multicultural-groups"}, {"checked": "2026-11-08", "title": "Business Victoria: Multicultural Business Skills Fund grant program", "url": "https://business.vic.gov.au/grants-and-programs/multicultural-business-skills-fund-grant-program"}], "status": "published", "translations": {"hi": "reviewed-by-claude", "pa": "reviewed-by-claude"}, "type": "explainer", "updated": "2026-11-08T11:22:03Z"}, {"approvedAt": "2026-11-08T20:06:27Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["The Department of Home Affairs changed the rules for Student visa (subclass 500) and Student Guardian visa (subclass 590) applications on 2 October 2026. The changes affect where people can apply from and whether family members can be included.", "If you already hold a Student visa, the department says the changes do not affect your current visa. Applications lodged before 2 October, including those that listed family members, are assessed under the old rules.", {"h": "Applying from inside Australia"}, "According to the department's factsheet, most temporary visa holders in Australia can no longer lodge a Student or Student Guardian visa application while in Australia. This includes current Student visa holders applying for another Student visa, unless an exemption applies.", "Current Student Guardian visa holders can still lodge a further Student Guardian visa application in Australia, the factsheet says.", "If the new rules stop you applying onshore, you must be outside Australia both when you lodge the application and when the visa is granted.", {"h": "Exemptions for further study in Australia"}, {"ul": ["You need up to 12 more months to finish your course with the same education provider", "You are moving to a higher Australian Qualifications Framework (AQF) level after completing your main course", "You are applying for a PhD", "You are sponsored by the Department of Foreign Affairs and Trade or Defence", "You are applying for primary or secondary school study", "Your education provider has defaulted and you cannot continue your course", "Some moves between school, non-AQF and AQF courses (the factsheet lists these)"]}, {"h": "Partners and children"}, "New Student visa applicants can no longer include a partner or dependent children in their application unless an exemption applies. Exemptions include PhD students, students sponsored by DFAT or Defence, students on a foreign government scholarship, and eligible students from Pacific or ASEAN countries.", "Current Student visa holders can no longer add family members after their visa is granted. The department says there are no exemptions to this rule. Family members already included on a current Student visa may be included in the next application if it is made in Australia.", "The primary applicant and all family members in an application must be in the same location when it is lodged.", {"note": "This is general information, not migration advice. The Department of Home Affairs lists the affected visa types on its Subclass 500 Student visa page. For advice about your situation, speak to a registered migration agent or lawyer."}], "dek": "Since 2 October, most temporary visa holders in Australia can no longer lodge a Student visa application onshore, and new applicants generally cannot include a partner or children. Here is what the Department of Home Affairs says has changed.", "headline": "New student visa rules: who can still apply from inside Australia"}, "figure": {"en": "new onshore Student visa rules began", "value": "2 Oct"}, "image": {"addedAt": "2026-11-08T20:13:38Z", "addedBy": "claude", "alt": {"en": "Modern timber-and-glass student buildings around a paved courtyard at the University of Melbourne under a blue sky."}, "caption": {"en": "The student precinct at the University of Melbourne."}, "credit": "ColonelLight", "file": "images/university-of-melbourne-student-precinct.jpg", "licence": "CC BY-SA 4.0", "og": "og/university-of-melbourne-student-precinct.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:University_of_Melbourne_Student_Precinct.jpg", "srcset": "img/university-of-melbourne-student-precinct-800.webp 800w, img/university-of-melbourne-student-precinct-1280.webp 1280w", "url": "img/university-of-melbourne-student-precinct-1280.webp"}, "priority": 7, "risk": "amber", "section": "education", "slug": "student-visa-onshore-rules-october-2026", "sources": [{"checked": "2026-11-08", "title": "Department of Home Affairs: Changes to Student visa application rules (factsheet)", "url": "https://immi.homeaffairs.gov.au/Visa-subsite/files/changes-to-student-visa-applications-factsheet.pdf"}, {"checked": "2026-11-08", "title": "Kindra Migration Lawyers: Student visa rules changed today (2 October 2026), secondary, used for background only", "url": "https://kindramigration.com.au/insights/student-visa-rules-changed-today-what-students-and-families-need-to-know/"}], "status": "published", "type": "explainer", "updated": "2026-11-08T20:13:38Z"}, {"approvedAt": "2026-11-08T20:02:36Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["If you or someone in your family would find it easier to get voting information in your own language, the Victorian Electoral Commission (VEC) offers phone help ahead of the state election on Saturday 28 November.", {"h": "Which number to call"}, {"dl": [["Tamil", "03 9209 0168"], ["Urdu", "03 9209 0165"], ["Nepali", "03 9209 0163"], ["Hindi, Punjabi, Gujarati, Malayalam, Sinhala and any other language", "03 9209 0112"]]}, "Hindi, Punjabi, Gujarati, Malayalam and Sinhala do not have their own VEC line or translated information page. Speakers of these languages can use the general number above, which the VEC lists for 'any other language'.", "Auslan users can contact the VEC through the National Relay Service and then call 03 8620 1100.", {"h": "Key dates"}, {"dl": [["Tue 17 Nov, 10am–4pm", "Low-sensory voting (one site in each district)"], ["Wed 18 – Fri 27 Nov", "Early voting"], ["Wed 25 Nov, 6pm", "Postal vote applications close"], ["Sat 28 Nov, 8am–6pm", "Election day"]]}, {"h": "Check you are enrolled"}, "The electoral roll closed at 8pm on Tuesday 3 November, so it is too late to enrol or update your details for this election. You can still check your enrolment on the VEC website by entering your name and address exactly as they appear on the roll. If you cannot find your details, call the VEC on 131 832.", {"h": "Other help"}, "The VEC says it is mailing more than 3 million printed EasyVote guides to Victorian households. It also publishes Easy English guides on voting, and its online map shows voting centre locations.", {"note": "The Melbourne Indian does not endorse candidates or parties. Phone numbers are from the VEC website, checked on 9 November 2026."}], "dek": "The Victorian Electoral Commission has dedicated phone lines for Tamil, Urdu and Nepali speakers. For Hindi, Punjabi, Gujarati, Malayalam and other languages, there is one number to call.", "headline": "Voting help in Hindi, Punjabi, Tamil and more: who to call before 28 November"}, "figure": {"en": "VEC line for languages without their own number", "value": "03 9209 0112"}, "image": {"addedAt": "2026-11-08T20:13:38Z", "addedBy": "claude", "alt": {"en": "Voters stand at cardboard voting screens in a hall with a chequered carpet while electoral staff work at a table."}, "caption": {"en": "A polling place in suburban Melbourne during the 2016 federal election."}, "credit": "John O'Neill (jjron)", "file": "images/polling-place-melbourne-2016.jpg", "licence": "Public domain", "og": "og/polling-place-melbourne-2016.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Polling_place,_Melbourne_Suburbs,_Vic,_jjron,_02.07.2016.jpg", "url": "img/polling-place-melbourne-2016-640.webp"}, "priority": 8, "risk": "green", "section": "civic", "slug": "vec-voting-help-indian-languages", "sources": [{"checked": "2026-11-08", "title": "Victorian Electoral Commission: Information in your language", "url": "https://www.vec.vic.gov.au/information-in-your-language"}, {"checked": "2026-11-08", "title": "Victorian Electoral Commission: 2026 state election", "url": "https://www.vec.vic.gov.au/voting/2026-state-election"}, {"checked": "2026-11-08", "title": "Victorian Electoral Commission: Check my enrolment", "url": "https://www.vec.vic.gov.au/enrolment/check-my-enrolment"}, {"checked": "2026-11-08", "title": "Victorian Electoral Commission: Easy English guides on voting", "url": "https://www.vec.vic.gov.au/voting/learn-to-vote/easy-english-guides-on-voting"}, {"checked": "2026-11-08", "title": "VEC voting centre map", "url": "https://maps.vec.vic.gov.au/elections"}, {"checked": "2026-11-09", "title": "Victorian Electoral Commission: Voting options (low-sensory voting)", "url": "https://www.vec.vic.gov.au/voting/2026-state-election/voting-options"}, {"checked": "2026-11-09", "title": "Victorian Electoral Commission: 100 days until the 2026 state election (EasyVote guides)", "url": "https://vec.vic.gov.au/about-us/media/100-days-until-the-2026-victorian-state-election---what-you-need-to-know"}, {"checked": "2026-11-09", "title": "Victorian Electoral Commission: Contact us", "url": "https://www.vec.vic.gov.au/contact-us"}], "status": "published", "type": "guide", "updated": "2026-11-08T20:13:38Z"}, {"byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["Victorians go to the polls on Saturday 28 November for the 2026 state election. Voting centres will be open from 8am to 6pm, and you can vote at any voting centre in Victoria, according to the Victorian Electoral Commission (VEC).", "Voting is compulsory for everyone on the electoral roll. The roll closed at 8pm on Tuesday 3 November, so if you are not sure whether you are enrolled, check your details on the VEC website.", {"h": "Key dates"}, {"dl": [["Mon 9 Nov, 12 noon", "Candidate nominations close"], ["Tue 17 Nov, 10am–4pm", "Low sensory voting session"], ["Wed 18 Nov", "Early voting and telephone-assisted voting open"], ["Wed 25 Nov, 6pm", "Postal vote applications close"], ["Fri 27 Nov, 6pm", "Early voting closes"], ["Sat 28 Nov, 8am–6pm", "Election day"]]}, {"h": "Voting early"}, "Early voting runs from Wednesday 18 to Friday 27 November, 9am to 6pm each day except Sunday 22 November. You do not need a reason to vote early. The VEC says early voting locations will be published closer to the date.", {"h": "Voting by post or phone"}, "If you cannot get to a voting centre, you can apply for a postal vote until 6pm on Wednesday 25 November. Ballot packs are posted after nominations close and candidates are confirmed.", "Telephone-assisted voting is available for people who are blind, have low vision or have a motor impairment. Registration opens on Wednesday 18 November.", {"h": "Help in your language"}, "The VEC publishes voting information in other languages on its website, and early and election-day voting centres have how-to-vote information in other languages. You can also call the VEC on 131 832.", {"note": "The Melbourne Indian does not endorse candidates or parties. We will publish factual guides once nominations close on 9 November."}], "dek": "Early voting opens on 18 November and postal vote applications close on 25 November. Here is how to vote, and where to get help in your language.", "headline": "Victoria votes on 28 November: the dates you need to know"}, "featured": false, "figure": {"en": "November · election day", "hi": "नवंबर · मतदान का दिन", "pa": "ਨਵੰਬਰ · ਚੋਣਾਂ ਵਾਲਾ ਦਿਨ", "value": "28"}, "hi": {"body": ["विक्टोरिया के मतदाता 2026 के राज्य चुनाव के लिए शनिवार, 28 नवंबर को वोट डालेंगे। विक्टोरियन इलेक्टोरल कमीशन (VEC) के अनुसार मतदान केंद्र सुबह 8 बजे से शाम 6 बजे तक खुले रहेंगे, और आप विक्टोरिया के किसी भी मतदान केंद्र पर वोट दे सकते हैं।", "मतदाता सूची में दर्ज हर व्यक्ति के लिए मतदान अनिवार्य है। मतदाता सूची मंगलवार, 3 नवंबर को रात 8 बजे बंद हो चुकी है। अगर आपको पक्का नहीं पता कि आपका नाम दर्ज है, तो VEC की वेबसाइट पर अपनी जानकारी जाँच लें।", {"h": "मुख्य तारीख़ें"}, {"dl": [["सोम 9 नवंबर, दोपहर 12 बजे", "उम्मीदवारों के नामांकन बंद"], ["मंगल 17 नवंबर, सुबह 10 – शाम 4", "कम शोर-शराबे वाला (लो सेंसरी) मतदान सत्र"], ["बुध 18 नवंबर", "अग्रिम मतदान और टेलीफ़ोन सहायता से मतदान शुरू"], ["बुध 25 नवंबर, शाम 6 बजे", "डाक मत के आवेदन बंद"], ["शुक्र 27 नवंबर, शाम 6 बजे", "अग्रिम मतदान बंद"], ["शनि 28 नवंबर, सुबह 8 – शाम 6", "चुनाव का दिन"]]}, {"h": "पहले वोट देना"}, "अग्रिम मतदान बुधवार 18 नवंबर से शुक्रवार 27 नवंबर तक रोज़ सुबह 9 बजे से शाम 6 बजे तक होगा, केवल रविवार 22 नवंबर को छोड़कर। पहले वोट देने के लिए कोई कारण बताने की ज़रूरत नहीं है। VEC के अनुसार अग्रिम मतदान केंद्रों की जगहें तारीख़ के क़रीब बताई जाएँगी।", {"h": "डाक या फ़ोन से वोट"}, "अगर आप मतदान केंद्र तक नहीं जा सकते, तो बुधवार 25 नवंबर शाम 6 बजे तक डाक मत के लिए आवेदन कर सकते हैं। नामांकन बंद होने और उम्मीदवार तय होने के बाद मतपत्र डाक से भेजे जाते हैं।", "जो लोग देख नहीं सकते, कम देख पाते हैं या जिन्हें हाथ-पैर चलाने में कठिनाई है, वे टेलीफ़ोन की सहायता से वोट दे सकते हैं। इसका पंजीकरण बुधवार 18 नवंबर से शुरू होगा।", {"h": "अपनी भाषा में मदद"}, "VEC अपनी वेबसाइट पर दूसरी भाषाओं में मतदान की जानकारी देता है, और अग्रिम व चुनाव-दिवस के मतदान केंद्रों पर भी दूसरी भाषाओं में वोट डालने की जानकारी मिलती है। आप VEC को 131 832 पर फ़ोन भी कर सकते हैं।", {"note": "द मेलबर्न इंडियन किसी उम्मीदवार या दल का समर्थन नहीं करता। 9 नवंबर को नामांकन बंद होने के बाद हम तथ्यों पर आधारित गाइड प्रकाशित करेंगे।"}], "dek": "अग्रिम मतदान 18 नवंबर से शुरू होगा और डाक मत के आवेदन 25 नवंबर को बंद होंगे। जानिए वोट कैसे डालें और अपनी भाषा में मदद कहाँ मिलेगी।", "headline": "विक्टोरिया में 28 नवंबर को मतदान: ये तारीख़ें याद रखें"}, "image": {"addedAt": "2026-11-08T11:22:03Z", "addedBy": "claude", "alt": {"en": "The colonnaded sandstone front of Parliament House on Spring Street, Melbourne, with tram wires overhead and a tree on the right."}, "caption": {"en": "Parliament House on Spring Street, Melbourne, home of the Victorian Parliament that voters will elect on 28 November."}, "credit": "Kensarlance", "file": "images/parliament-house-spring-street.jpg", "licence": "Public domain", "og": "og/parliament-house-spring-street.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Parliament_House_Spring_Street_Melbourne.jpg", "srcset": "img/parliament-house-spring-street-800.webp 800w, img/parliament-house-spring-street-1600.webp 1600w", "url": "img/parliament-house-spring-street-1600.webp"}, "pa": {"body": ["ਵਿਕਟੋਰੀਆ ਦੇ ਵੋਟਰ 2026 ਦੀਆਂ ਸੂਬਾਈ ਚੋਣਾਂ ਲਈ ਸ਼ਨੀਵਾਰ, 28 ਨਵੰਬਰ ਨੂੰ ਵੋਟਾਂ ਪਾਉਣਗੇ। ਵਿਕਟੋਰੀਅਨ ਇਲੈਕਟੋਰਲ ਕਮਿਸ਼ਨ (VEC) ਮੁਤਾਬਕ ਵੋਟਿੰਗ ਕੇਂਦਰ ਸਵੇਰੇ 8 ਵਜੇ ਤੋਂ ਸ਼ਾਮ 6 ਵਜੇ ਤੱਕ ਖੁੱਲ੍ਹੇ ਰਹਿਣਗੇ, ਅਤੇ ਤੁਸੀਂ ਵਿਕਟੋਰੀਆ ਦੇ ਕਿਸੇ ਵੀ ਵੋਟਿੰਗ ਕੇਂਦਰ ਵਿੱਚ ਵੋਟ ਪਾ ਸਕਦੇ ਹੋ।", "ਵੋਟਰ ਸੂਚੀ ਵਿੱਚ ਦਰਜ ਹਰ ਵਿਅਕਤੀ ਲਈ ਵੋਟ ਪਾਉਣੀ ਲਾਜ਼ਮੀ ਹੈ। ਵੋਟਰ ਸੂਚੀ ਮੰਗਲਵਾਰ, 3 ਨਵੰਬਰ ਨੂੰ ਰਾਤ 8 ਵਜੇ ਬੰਦ ਹੋ ਚੁੱਕੀ ਹੈ। ਜੇ ਤੁਹਾਨੂੰ ਪੱਕਾ ਨਹੀਂ ਪਤਾ ਕਿ ਤੁਹਾਡਾ ਨਾਂ ਦਰਜ ਹੈ ਜਾਂ ਨਹੀਂ, ਤਾਂ VEC ਦੀ ਵੈੱਬਸਾਈਟ 'ਤੇ ਆਪਣੇ ਵੇਰਵੇ ਜਾਂਚ ਲਓ।", {"h": "ਮੁੱਖ ਤਰੀਕਾਂ"}, {"dl": [["ਸੋਮ 9 ਨਵੰਬਰ, ਦੁਪਹਿਰ 12 ਵਜੇ", "ਉਮੀਦਵਾਰਾਂ ਦੀਆਂ ਨਾਮਜ਼ਦਗੀਆਂ ਬੰਦ"], ["ਮੰਗਲ 17 ਨਵੰਬਰ, ਸਵੇਰੇ 10 – ਸ਼ਾਮ 4", "ਘੱਟ ਰੌਲੇ-ਰੱਪੇ ਵਾਲਾ (ਲੋ ਸੈਂਸਰੀ) ਵੋਟਿੰਗ ਸੈਸ਼ਨ"], ["ਬੁੱਧ 18 ਨਵੰਬਰ", "ਅਗਾਊਂ ਵੋਟਿੰਗ ਅਤੇ ਫ਼ੋਨ ਦੀ ਸਹਾਇਤਾ ਨਾਲ ਵੋਟਿੰਗ ਸ਼ੁਰੂ"], ["ਬੁੱਧ 25 ਨਵੰਬਰ, ਸ਼ਾਮ 6 ਵਜੇ", "ਡਾਕ ਵੋਟ ਦੀਆਂ ਅਰਜ਼ੀਆਂ ਬੰਦ"], ["ਸ਼ੁੱਕਰ 27 ਨਵੰਬਰ, ਸ਼ਾਮ 6 ਵਜੇ", "ਅਗਾਊਂ ਵੋਟਿੰਗ ਬੰਦ"], ["ਸ਼ਨੀ 28 ਨਵੰਬਰ, ਸਵੇਰੇ 8 – ਸ਼ਾਮ 6", "ਚੋਣਾਂ ਵਾਲਾ ਦਿਨ"]]}, {"h": "ਪਹਿਲਾਂ ਵੋਟ ਪਾਉਣੀ"}, "ਅਗਾਊਂ ਵੋਟਿੰਗ ਬੁੱਧਵਾਰ 18 ਨਵੰਬਰ ਤੋਂ ਸ਼ੁੱਕਰਵਾਰ 27 ਨਵੰਬਰ ਤੱਕ ਹਰ ਰੋਜ਼ ਸਵੇਰੇ 9 ਵਜੇ ਤੋਂ ਸ਼ਾਮ 6 ਵਜੇ ਤੱਕ ਹੋਵੇਗੀ, ਸਿਰਫ਼ ਐਤਵਾਰ 22 ਨਵੰਬਰ ਨੂੰ ਛੱਡ ਕੇ। ਪਹਿਲਾਂ ਵੋਟ ਪਾਉਣ ਲਈ ਕੋਈ ਕਾਰਨ ਦੱਸਣ ਦੀ ਲੋੜ ਨਹੀਂ। VEC ਮੁਤਾਬਕ ਅਗਾਊਂ ਵੋਟਿੰਗ ਕੇਂਦਰਾਂ ਦੀਆਂ ਥਾਵਾਂ ਤਰੀਕ ਦੇ ਨੇੜੇ ਦੱਸੀਆਂ ਜਾਣਗੀਆਂ।", {"h": "ਡਾਕ ਜਾਂ ਫ਼ੋਨ ਰਾਹੀਂ ਵੋਟ"}, "ਜੇ ਤੁਸੀਂ ਵੋਟਿੰਗ ਕੇਂਦਰ ਨਹੀਂ ਜਾ ਸਕਦੇ, ਤਾਂ ਬੁੱਧਵਾਰ 25 ਨਵੰਬਰ ਸ਼ਾਮ 6 ਵਜੇ ਤੱਕ ਡਾਕ ਵੋਟ ਲਈ ਅਰਜ਼ੀ ਦੇ ਸਕਦੇ ਹੋ। ਨਾਮਜ਼ਦਗੀਆਂ ਬੰਦ ਹੋਣ ਅਤੇ ਉਮੀਦਵਾਰ ਪੱਕੇ ਹੋਣ ਤੋਂ ਬਾਅਦ ਬੈਲਟ ਪੇਪਰ ਡਾਕ ਰਾਹੀਂ ਭੇਜੇ ਜਾਂਦੇ ਹਨ।", "ਜਿਹੜੇ ਲੋਕ ਦੇਖ ਨਹੀਂ ਸਕਦੇ, ਘੱਟ ਦੇਖਦੇ ਹਨ ਜਾਂ ਜਿਨ੍ਹਾਂ ਨੂੰ ਹੱਥਾਂ-ਪੈਰਾਂ ਦੀ ਹਿਲਜੁਲ ਵਿੱਚ ਦਿੱਕਤ ਹੈ, ਉਹ ਫ਼ੋਨ ਦੀ ਸਹਾਇਤਾ ਨਾਲ ਵੋਟ ਪਾ ਸਕਦੇ ਹਨ। ਇਸ ਲਈ ਰਜਿਸਟ੍ਰੇਸ਼ਨ ਬੁੱਧਵਾਰ 18 ਨਵੰਬਰ ਤੋਂ ਸ਼ੁਰੂ ਹੋਵੇਗੀ।", {"h": "ਆਪਣੀ ਬੋਲੀ ਵਿੱਚ ਮਦਦ"}, "VEC ਆਪਣੀ ਵੈੱਬਸਾਈਟ 'ਤੇ ਹੋਰ ਬੋਲੀਆਂ ਵਿੱਚ ਵੋਟਿੰਗ ਦੀ ਜਾਣਕਾਰੀ ਦਿੰਦਾ ਹੈ, ਅਤੇ ਅਗਾਊਂ ਅਤੇ ਚੋਣਾਂ ਵਾਲੇ ਦਿਨ ਦੇ ਵੋਟਿੰਗ ਕੇਂਦਰਾਂ ਵਿੱਚ ਵੀ ਹੋਰ ਬੋਲੀਆਂ ਵਿੱਚ ਵੋਟ ਪਾਉਣ ਦੀ ਜਾਣਕਾਰੀ ਮਿਲਦੀ ਹੈ। ਤੁਸੀਂ VEC ਨੂੰ 131 832 'ਤੇ ਫ਼ੋਨ ਵੀ ਕਰ ਸਕਦੇ ਹੋ।", {"note": "ਦ ਮੈਲਬਰਨ ਇੰਡੀਅਨ ਕਿਸੇ ਉਮੀਦਵਾਰ ਜਾਂ ਪਾਰਟੀ ਦੀ ਹਮਾਇਤ ਨਹੀਂ ਕਰਦਾ। 9 ਨਵੰਬਰ ਨੂੰ ਨਾਮਜ਼ਦਗੀਆਂ ਬੰਦ ਹੋਣ ਤੋਂ ਬਾਅਦ ਅਸੀਂ ਤੱਥਾਂ 'ਤੇ ਅਧਾਰਿਤ ਗਾਈਡ ਛਾਪਾਂਗੇ।"}], "dek": "ਅਗਾਊਂ ਵੋਟਿੰਗ 18 ਨਵੰਬਰ ਨੂੰ ਸ਼ੁਰੂ ਹੋਵੇਗੀ ਅਤੇ ਡਾਕ ਵੋਟ ਦੀਆਂ ਅਰਜ਼ੀਆਂ 25 ਨਵੰਬਰ ਨੂੰ ਬੰਦ ਹੋਣਗੀਆਂ। ਜਾਣੋ ਵੋਟ ਕਿਵੇਂ ਪਾਉਣੀ ਹੈ ਅਤੇ ਆਪਣੀ ਬੋਲੀ ਵਿੱਚ ਮਦਦ ਕਿੱਥੋਂ ਮਿਲੇਗੀ।", "headline": "ਵਿਕਟੋਰੀਆ ਵਿੱਚ 28 ਨਵੰਬਰ ਨੂੰ ਵੋਟਾਂ: ਇਹ ਤਰੀਕਾਂ ਯਾਦ ਰੱਖੋ"}, "priority": 10, "risk": "green", "section": "civic", "slug": "victorian-election-2026-key-dates", "sources": [{"checked": "2026-11-08", "title": "Victorian Electoral Commission: 2026 state election", "url": "https://www.vec.vic.gov.au/voting/2026-state-election"}, {"checked": "2026-11-08", "title": "Victorian Electoral Commission: Voting options", "url": "https://www.vec.vic.gov.au/voting/2026-state-election/voting-options"}], "status": "published", "translations": {"hi": "reviewed-by-claude", "pa": "reviewed-by-claude"}, "type": "guide", "updated": "2026-11-08T11:22:03Z"}, {"byline": "The Melbourne Indian newsroom", "date": "2026-11-08", "en": {"body": ["The Melbourne Indian is a new, independent news service for Melbourne's Indian communities, and for anyone who wants to know what is happening in them.", "We focus on life here: council and state decisions, local business, festivals and faith, and the practical information families need. News from India appears when it affects people in Melbourne.", "Every story is free to read. We publish in English, Hindi and Punjabi, and we translate stories where a language edition will be useful to readers.", {"h": "How we work"}, "We report from published records and official sources, and we link to them at the end of every story so you can check our work. We use AI tools to help research, draft and translate. Every story is checked against its sources and approved by an editor before it is published. Sensitive stories, including politics, crime, courts and allegations about people, get extra review.", "We do not invent quotes, interviews or photographs. When we get something wrong, we correct it and say so.", {"h": "How we are funded"}, "We are funded by advertising from local businesses. Advertising and sponsored content are always labelled, and they never decide what we report.", "We are just getting started. If you run a community organisation, temple, gurdwara or business and want us to know what you are doing, we would like to hear from you. Email our editors at news@themelbourneindian.com.au. For advertising, email ads@themelbourneindian.com.au."], "dek": "A free news service for Melbourne's Indian communities, in English, Hindi and Punjabi.", "headline": "Welcome to The Melbourne Indian"}, "figure": {"en": "languages, one newsroom", "hi": "भाषाएँ, एक न्यूज़रूम", "pa": "ਬੋਲੀਆਂ, ਇੱਕ ਨਿਊਜ਼ਰੂਮ", "value": "3"}, "hi": {"body": ["द मेलबर्न इंडियन एक नई, स्वतंत्र समाचार सेवा है, मेलबर्न के भारतीय समुदायों के लिए और उन सभी के लिए जो जानना चाहते हैं कि इन समुदायों में क्या हो रहा है।", "हमारा ध्यान यहाँ की ज़िंदगी पर है: काउंसिल और राज्य सरकार के फ़ैसले, स्थानीय व्यवसाय, त्योहार और आस्था, और परिवारों के काम की व्यावहारिक जानकारी। भारत की ख़बरें तब छपेंगी जब उनका असर मेलबर्न में रहने वालों पर पड़ता हो।", "हर ख़बर पढ़ने के लिए निःशुल्क है। हम अंग्रेज़ी, हिंदी और पंजाबी में प्रकाशित करते हैं, और जहाँ किसी भाषा में ख़बर पाठकों के काम आए, वहाँ उसका अनुवाद करते हैं।", {"h": "हम कैसे काम करते हैं"}, "हम प्रकाशित रिकॉर्ड और आधिकारिक स्रोतों से रिपोर्ट करते हैं, और हर ख़बर के अंत में उनके लिंक देते हैं ताकि आप ख़ुद जाँच सकें। शोध, लेखन और अनुवाद में हम AI टूल्स की मदद लेते हैं। हर ख़बर स्रोतों से मिलाई जाती है और प्रकाशन से पहले एक संपादक उसे मंज़ूरी देता है। राजनीति, अपराध, अदालत और लोगों पर लगे आरोपों जैसी संवेदनशील ख़बरों की अतिरिक्त जाँच होती है।", "हम कोई उद्धरण, साक्षात्कार या तस्वीर गढ़ते नहीं हैं। ग़लती होने पर हम उसे सुधारते हैं और यह साफ़ बताते हैं।", {"h": "हमारा ख़र्च कैसे चलता है"}, "हमारा ख़र्च स्थानीय व्यवसायों के विज्ञापनों से चलता है। विज्ञापन और प्रायोजित सामग्री पर हमेशा स्पष्ट लेबल होता है, और वे यह तय नहीं करते कि हम क्या रिपोर्ट करें।", "हम अभी शुरुआत कर रहे हैं। अगर आप कोई सामुदायिक संस्था, मंदिर, गुरुद्वारा या व्यवसाय चलाते हैं और चाहते हैं कि हमें आपके काम की जानकारी हो, तो हम आपसे सुनना चाहेंगे। हमारे संपादकों को news@themelbourneindian.com.au पर ईमेल करें। विज्ञापन के लिए ads@themelbourneindian.com.au पर ईमेल करें।"], "dek": "मेलबर्न के भारतीय समुदायों के लिए अंग्रेज़ी, हिंदी और पंजाबी में एक निःशुल्क समाचार सेवा।", "headline": "द मेलबर्न इंडियन में आपका स्वागत है"}, "image": {"addedAt": "2026-11-08T11:22:03Z", "addedBy": "claude", "alt": {"en": "Flinders Street Station's domed sandstone facade at a busy intersection with trams and pedestrians, and Eureka Tower rising behind it."}, "caption": {"en": "Flinders Street Station and Eureka Tower in central Melbourne, the city The Melbourne Indian covers."}, "credit": "Philip Mallis from Melbourne", "file": "images/flinders-street-station-eureka-tower.jpg", "licence": "CC BY-SA 2.0", "og": "og/flinders-street-station-eureka-tower.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Flinders_Street_Station_and_Eureka_Tower,_Melbourne_(51381676618).jpg", "srcset": "img/flinders-street-station-eureka-tower-800.webp 800w, img/flinders-street-station-eureka-tower-1600.webp 1600w", "url": "img/flinders-street-station-eureka-tower-1600.webp"}, "pa": {"body": ["ਦ ਮੈਲਬਰਨ ਇੰਡੀਅਨ ਇੱਕ ਨਵੀਂ, ਆਜ਼ਾਦ ਖ਼ਬਰ ਸੇਵਾ ਹੈ, ਮੈਲਬਰਨ ਦੇ ਭਾਰਤੀ ਭਾਈਚਾਰਿਆਂ ਲਈ ਅਤੇ ਉਨ੍ਹਾਂ ਸਾਰਿਆਂ ਲਈ ਜੋ ਜਾਣਨਾ ਚਾਹੁੰਦੇ ਹਨ ਕਿ ਇਨ੍ਹਾਂ ਭਾਈਚਾਰਿਆਂ ਵਿੱਚ ਕੀ ਹੋ ਰਿਹਾ ਹੈ।", "ਸਾਡਾ ਧਿਆਨ ਇੱਥੋਂ ਦੀ ਜ਼ਿੰਦਗੀ 'ਤੇ ਹੈ: ਕੌਂਸਲ ਅਤੇ ਸੂਬਾ ਸਰਕਾਰ ਦੇ ਫ਼ੈਸਲੇ, ਸਥਾਨਕ ਕਾਰੋਬਾਰ, ਤਿਉਹਾਰ ਅਤੇ ਆਸਥਾ, ਅਤੇ ਪਰਿਵਾਰਾਂ ਦੇ ਕੰਮ ਆਉਣ ਵਾਲੀ ਜਾਣਕਾਰੀ। ਭਾਰਤ ਦੀਆਂ ਖ਼ਬਰਾਂ ਉਦੋਂ ਛਪਣਗੀਆਂ ਜਦੋਂ ਉਨ੍ਹਾਂ ਦਾ ਅਸਰ ਮੈਲਬਰਨ ਵਿੱਚ ਰਹਿਣ ਵਾਲਿਆਂ 'ਤੇ ਪੈਂਦਾ ਹੋਵੇ।", "ਹਰ ਖ਼ਬਰ ਪੜ੍ਹਨ ਲਈ ਮੁਫ਼ਤ ਹੈ। ਅਸੀਂ ਅੰਗਰੇਜ਼ੀ, ਹਿੰਦੀ ਅਤੇ ਪੰਜਾਬੀ ਵਿੱਚ ਛਾਪਦੇ ਹਾਂ, ਅਤੇ ਜਿੱਥੇ ਕਿਸੇ ਬੋਲੀ ਵਿੱਚ ਖ਼ਬਰ ਪਾਠਕਾਂ ਦੇ ਕੰਮ ਆਵੇ, ਉੱਥੇ ਉਸਦਾ ਅਨੁਵਾਦ ਕਰਦੇ ਹਾਂ।", {"h": "ਅਸੀਂ ਕਿਵੇਂ ਕੰਮ ਕਰਦੇ ਹਾਂ"}, "ਅਸੀਂ ਛਪੇ ਹੋਏ ਰਿਕਾਰਡਾਂ ਅਤੇ ਸਰਕਾਰੀ ਸਰੋਤਾਂ ਤੋਂ ਰਿਪੋਰਟ ਕਰਦੇ ਹਾਂ, ਅਤੇ ਹਰ ਖ਼ਬਰ ਦੇ ਅਖ਼ੀਰ ਵਿੱਚ ਉਨ੍ਹਾਂ ਦੇ ਲਿੰਕ ਦਿੰਦੇ ਹਾਂ ਤਾਂ ਜੋ ਤੁਸੀਂ ਆਪ ਜਾਂਚ ਕਰ ਸਕੋ। ਖੋਜ, ਲਿਖਾਈ ਅਤੇ ਅਨੁਵਾਦ ਵਿੱਚ ਅਸੀਂ AI ਟੂਲਾਂ ਦੀ ਮਦਦ ਲੈਂਦੇ ਹਾਂ। ਹਰ ਖ਼ਬਰ ਸਰੋਤਾਂ ਨਾਲ ਮਿਲਾਈ ਜਾਂਦੀ ਹੈ ਅਤੇ ਛਪਣ ਤੋਂ ਪਹਿਲਾਂ ਕੋਈ ਸੰਪਾਦਕ ਉਸਨੂੰ ਮਨਜ਼ੂਰੀ ਦਿੰਦਾ ਹੈ। ਸਿਆਸਤ, ਜੁਰਮ, ਅਦਾਲਤਾਂ ਅਤੇ ਲੋਕਾਂ 'ਤੇ ਲੱਗੇ ਦੋਸ਼ਾਂ ਵਰਗੀਆਂ ਸੰਵੇਦਨਸ਼ੀਲ ਖ਼ਬਰਾਂ ਦੀ ਵਾਧੂ ਜਾਂਚ ਹੁੰਦੀ ਹੈ।", "ਅਸੀਂ ਕੋਈ ਹਵਾਲਾ, ਇੰਟਰਵਿਊ ਜਾਂ ਤਸਵੀਰ ਨਹੀਂ ਘੜਦੇ। ਗ਼ਲਤੀ ਹੋਣ 'ਤੇ ਅਸੀਂ ਉਸਨੂੰ ਸੁਧਾਰਦੇ ਹਾਂ ਅਤੇ ਸਾਫ਼ ਦੱਸਦੇ ਹਾਂ।", {"h": "ਸਾਡਾ ਖ਼ਰਚਾ ਕਿਵੇਂ ਚੱਲਦਾ ਹੈ"}, "ਸਾਡਾ ਖ਼ਰਚਾ ਸਥਾਨਕ ਕਾਰੋਬਾਰਾਂ ਦੇ ਇਸ਼ਤਿਹਾਰਾਂ ਨਾਲ ਚੱਲਦਾ ਹੈ। ਇਸ਼ਤਿਹਾਰਾਂ ਅਤੇ ਸਪਾਂਸਰ ਕੀਤੀ ਸਮੱਗਰੀ 'ਤੇ ਹਮੇਸ਼ਾ ਸਾਫ਼ ਲੇਬਲ ਹੁੰਦਾ ਹੈ, ਅਤੇ ਇਹ ਤੈਅ ਨਹੀਂ ਕਰਦੇ ਕਿ ਅਸੀਂ ਕੀ ਰਿਪੋਰਟ ਕਰੀਏ।", "ਅਸੀਂ ਹੁਣੇ ਸ਼ੁਰੂਆਤ ਕਰ ਰਹੇ ਹਾਂ। ਜੇ ਤੁਸੀਂ ਕੋਈ ਭਾਈਚਾਰਕ ਸੰਸਥਾ, ਮੰਦਰ, ਗੁਰਦੁਆਰਾ ਜਾਂ ਕਾਰੋਬਾਰ ਚਲਾਉਂਦੇ ਹੋ ਅਤੇ ਚਾਹੁੰਦੇ ਹੋ ਕਿ ਸਾਨੂੰ ਤੁਹਾਡੇ ਕੰਮ ਬਾਰੇ ਪਤਾ ਹੋਵੇ, ਤਾਂ ਅਸੀਂ ਤੁਹਾਡੇ ਤੋਂ ਸੁਣਨਾ ਚਾਹਾਂਗੇ। ਸਾਡੇ ਸੰਪਾਦਕਾਂ ਨੂੰ news@themelbourneindian.com.au 'ਤੇ ਈਮੇਲ ਕਰੋ। ਇਸ਼ਤਿਹਾਰਾਂ ਲਈ ads@themelbourneindian.com.au 'ਤੇ ਈਮੇਲ ਕਰੋ।"], "dek": "ਮੈਲਬਰਨ ਦੇ ਭਾਰਤੀ ਭਾਈਚਾਰਿਆਂ ਲਈ ਅੰਗਰੇਜ਼ੀ, ਹਿੰਦੀ ਅਤੇ ਪੰਜਾਬੀ ਵਿੱਚ ਇੱਕ ਮੁਫ਼ਤ ਖ਼ਬਰ ਸੇਵਾ।", "headline": "ਦ ਮੈਲਬਰਨ ਇੰਡੀਅਨ ਵਿੱਚ ਤੁਹਾਡਾ ਸੁਆਗਤ ਹੈ"}, "priority": 2, "risk": "green", "section": "community", "slug": "welcome", "sources": [], "status": "published", "translations": {"hi": "reviewed-by-claude", "pa": "reviewed-by-claude"}, "type": "notice", "updated": "2026-11-08T11:22:03Z"}, {"approvedAt": "2026-11-08T23:46:39Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "created": "2026-11-08T23:46:39Z", "date": "2026-11-09", "en": {"body": ["Victorians vote on Saturday 28 November. Candidate nominations for the Legislative Assembly (lower house) close at 12 noon today, Monday 9 November.", "This guide covers the seven lower house districts where at least one in 10 residents was born in India. The figures come from the 2021 Census, compiled by the Parliament of Victoria Library on the current district boundaries.", {"note": "Early list: this shows candidates who had nominated by 10.50am on Monday 9 November, in the order they nominated, as listed by the Victorian Electoral Commission (VEC). More candidates may still nominate before noon. The order here is not the order on the ballot paper. We will update this guide with the final list and ballot order after nominations close."}, {"h": "Tarneit: 20.5% born in India"}, "Tarneit District is in the Western Metropolitan Region for the upper house. Candidates nominated so far:", {"dl": [["ISLAM, SM Zaberul", "No party listed"], ["MOINUDDIN, Aijaz", "No party listed"], ["RIFAI, A. Raheem", "The Greens"], ["VAN KEULEN, Leah", "Victorian Socialists"], ["WIGHT, Dylan", "Australian Labor Party"], ["UPPARLAPALLE, Venkat Ram", "Liberal"], ["VILLAGONZALO, Walter", "One Nation Victoria"], ["NIYONGABIRE, Horizana", "Family First"], ["ELSBURY, Andrew", "The West Party"], ["SUDHAGANI, Sindhu", "The Republican"], ["RAHN, Maurita", "Animal Justice Party"]]}, {"h": "Laverton: 15.0% born in India"}, "Laverton District is in the Western Metropolitan Region for the upper house. Candidates nominated so far:", {"dl": [["NGUYEN, Lucy", "The Greens"], ["RUDD, Van Thanh", "Victorian Socialists"], ["CONNOLLY, Sarah", "Australian Labor Party"], ["NOUNE, Ghada", "Liberal"], ["PAREDES, Rufo", "One Nation Victoria"], ["GARCIA, Jo", "Family First"], ["MENDELSOHN, Emma", "The West Party"], ["CHITTEDI, Suchithra", "The Republican"], ["MANSOURI JAJAEE, Shohre", "Animal Justice Party"]]}, {"h": "Kalkallo: 13.9% born in India"}, "Kalkallo District is in the Northern Metropolitan Region for the upper house. Candidates nominated so far:", {"dl": [["TIWARI, Payal", "The Greens"], ["MILLETT, Courtney", "Victorian Socialists"], ["SPENCE, Ros", "Australian Labor Party"], ["ISLAM, Rebeca", "No party listed"], ["DADISHO, Eddie", "Liberal"], ["STEANS, Troy", "One Nation Victoria"], ["DOBSON, Jeanette", "Family First"], ["LYNCH, Matthew", "Animal Justice Party"]]}, {"h": "Point Cook: 11.8% born in India"}, "Point Cook District is in the Western Metropolitan Region for the upper house. Candidates nominated so far:", {"dl": [["KRISHNA PANDI, Ponraj", "The Greens"], ["LAINE, Taylor", "Victorian Socialists"], ["HILAKARI, Mathew", "Australian Labor Party"], ["REDDY, Raja", "Liberal"], ["REID, Cameron", "One Nation Victoria"], ["MEURE, Keith", "Family First"], ["KELLY, Paul", "Labour DLP"], ["GRECH, Mark", "The West Party"], ["ALLE, Kirti", "The Republican"]]}, {"h": "Cranbourne: 11.6% born in India"}, "Cranbourne District is in the South-Eastern Metropolitan Region for the upper house. Candidates nominated so far:", {"dl": [["MERCER, Annalise", "The Greens"], ["YUNIS, Reem", "Victorian Socialists"], ["URQUIOLA, Liam", "Legalise Cannabis Victoria"], ["RICHARDS, Pauline", "Australian Labor Party"], ["TRIPODI, Gino", "Liberal"], ["HIRST, Andrew", "One Nation Victoria"], ["FOREMAN, Shane", "Family First"]]}, {"h": "Williamstown: 11.5% born in India"}, "Williamstown District is in the Western Metropolitan Region for the upper house. Candidates nominated so far:", {"dl": [["BRIFFA, Tony", "No party listed"], ["HOCKING, Ben", "The Greens"], ["MARTIN, Oskar", "Victorian Socialists"], ["HORNE, Melissa", "Australian Labor Party"], ["LINDEMANN, Paul", "Liberal"], ["LOUGHNAN, Catherine", "One Nation Victoria"], ["O'REGAN, Bruce", "Family First"], ["GANNON, Gill", "The West Party"], ["YARRA, Sagar Reddy", "The Republican"]]}, {"h": "Thomastown: 10.2% born in India"}, "Thomastown District is in the Northern Metropolitan Region for the upper house. Candidates nominated so far:", {"dl": [["TREWELLA, Gavin", "The Greens"], ["REDDY, Priya", "Victorian Socialists"], ["HALFPENNY, Bronwyn", "Australian Labor Party"], ["STOJCEVSKI, Belinda", "Liberal"], ["ANTHONY, Nadia", "One Nation Victoria"], ["RANCIE, Rob", "Family First"]]}, {"h": "How to fill in your ballot papers"}, "You will get two ballot papers. On the small lower house ballot paper, number every box in the order of your choice.", "On the large upper house ballot paper, you can vote above the line for parties or groups, or below the line for individual candidates. Either way, number at least 1 to 5 in your order of choice. Use numbers only, not ticks or crosses.", "This is the first state election since group voting tickets were removed from upper house elections, under changes to the Electoral Act passed in August 2026, the VEC says.", "Not sure which district you live in? Use the VEC's online map to find your electorate.", {"note": "The Melbourne Indian does not endorse candidates or parties. Candidates are listed exactly as the VEC lists them, with the party shown on its nominations pages. Census figures are people born in India as a share of each district's population in 2021."}], "dek": "Nominations close at noon today. Here is who had nominated in Tarneit, Laverton, Kalkallo, Point Cook, Cranbourne, Williamstown and Thomastown, and how to fill in your ballot papers.", "headline": "Victorian election: who is standing in the seven districts with the most India-born residents"}, "figure": {"en": "candidates nominated by 10.50am across these seven districts", "value": "59"}, "image": {"addedAt": "2026-11-08T23:46:39Z", "addedBy": "claude", "alt": {"en": "The columns and front steps of Parliament House on Spring Street, Melbourne, with an Australian flag against a blue sky."}, "caption": {"en": "Parliament House, Melbourne. Voters elect all 88 lower house members on 28 November."}, "credit": "Donaldytong", "file": "images/victoria-parliament-house.jpg", "licence": "Public domain", "og": "og/victoria-parliament-house.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:Victoria_Parliament_House_Melbourne.jpg", "srcset": "img/victoria-parliament-house-800.webp 800w, img/victoria-parliament-house-1600.webp 1600w", "url": "img/victoria-parliament-house-1600.webp"}, "priority": 9, "risk": "amber", "section": "civic", "slug": "victorian-election-2026-candidates-indian-communities", "sources": [{"checked": "2026-11-09", "title": "VEC: Tarneit District candidates", "url": "https://www.vec.vic.gov.au/electoral-boundaries/state-districts/tarneit-district/nominations"}, {"checked": "2026-11-09", "title": "VEC: Laverton District candidates", "url": "https://www.vec.vic.gov.au/electoral-boundaries/state-districts/laverton-district/nominations"}, {"checked": "2026-11-09", "title": "VEC: Kalkallo District candidates", "url": "https://www.vec.vic.gov.au/electoral-boundaries/state-districts/kalkallo-district/nominations"}, {"checked": "2026-11-09", "title": "VEC: Point Cook District candidates", "url": "https://www.vec.vic.gov.au/electoral-boundaries/state-districts/point-cook-district/nominations"}, {"checked": "2026-11-09", "title": "VEC: Cranbourne District candidates", "url": "https://www.vec.vic.gov.au/electoral-boundaries/state-districts/cranbourne-district/nominations"}, {"checked": "2026-11-09", "title": "VEC: Williamstown District candidates", "url": "https://www.vec.vic.gov.au/electoral-boundaries/state-districts/williamstown-district/nominations"}, {"checked": "2026-11-09", "title": "VEC: Thomastown District candidates", "url": "https://www.vec.vic.gov.au/electoral-boundaries/state-districts/thomastown-district/nominations"}, {"checked": "2026-11-09", "title": "Parliament of Victoria: Electorate data cards and data (ABS 2021 Census on 2022 boundaries)", "url": "https://www.parliament.vic.gov.au/teach-and-learn/resources/electorate-data-cards/"}, {"checked": "2026-11-09", "title": "VEC: How to fill out state ballot papers", "url": "https://www.vec.vic.gov.au/voting/learn-to-vote/how-to-fill-out-state-ballot-papers"}, {"checked": "2026-11-09", "title": "VEC: 2026 Electoral Act amendments", "url": "https://www.vec.vic.gov.au/about-us/legislation/electoral-act-amendments-2026"}, {"checked": "2026-11-09", "title": "VEC: 2026 state election", "url": "https://www.vec.vic.gov.au/voting/2026-state-election"}], "status": "published", "type": "guide", "updated": "2026-11-08T23:46:39Z"}, {"approvedAt": "2026-11-09T00:38:30Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-09", "en": {"body": ["The royal commission into corruption on Victoria's major infrastructure projects began its first public hearings in Collingwood on Monday 9 November, less than three weeks before the state election.", "Opening the hearings, counsel assisting Chris Young KC said the commission had requested more than 110,000 documents, sent hundreds of notices and already questioned witnesses in private hearings, according to ABC News coverage of the hearing.", "The first hearings are examining the Gap Road level crossing removal in Sunbury, part of the Sunbury line upgrade. They focus on a two-day work stoppage on 6 and 7 June 2022, during a shutdown of the line for critical works. Mr Young outlined allegations that work resumed after a meeting at the CFMEU's offices on 7 June, on terms that handed control of the site to the union. He said the commission would examine what happened, what arrangements were made, what they cost and what the government knew.", {"note": "Allegations aired at a royal commission are not proven. Mr Young said some of them have been denied. The commission has made no findings."}, {"h": "What the commission will look at"}, "Mr Young set out themes the inquiry expects to explore. They include allegations that the union placed unelected delegates on sites as health and safety representatives, sometimes through labour-hire companies, and that contractors were often left to deal with disruption themselves by \"buying peace\" and pricing its cost into their bids. He said those costs were shared with the state or passed on to it.", "He tendered a June 2023 briefing to Jacinta Allan, then the transport infrastructure minister, which raised concerns including pressure on contractors, excess staffing on sites, a rise in full-time union delegates and threats of unprotected industrial action. The briefing records concerns raised at the time and is not a finding. AAP has reported that Ms Allan, who later became premier, will be required to give evidence, but it is not yet known when.", "Later hearing blocks will examine alleged links between organised crime and the construction industry, and how government money was allocated and projects chosen.", "Mr Young also warned that threatening or punishing a witness is a serious offence, and said any reported threat would be referred to Victoria Police.", {"h": "About the inquiry"}, "The Royal Commission into the Integrity of Major Public and Civil Infrastructure Construction Projects in Victoria was established on 20 August 2026. It is led by the Honourable Christopher Kourakis AC, a former chief justice of South Australia, and its final report is due by 20 August 2027.", "Premier Ben Carroll called the inquiry as his first act after replacing Ms Allan, who had resisted calls from across the parliament for a royal commission. The calls followed reporting by Nine newspapers in 2024 alleging corruption and criminal infiltration of the CFMEU and Big Build sites. Parts of the union were placed into administration by the federal government in August 2024.", "A report for the union's administrators by barrister Geoffrey Watson SC estimated that alleged corrupt conduct had effectively cost Victorian taxpayers $15 billion. That figure is Mr Watson's estimate, and testing claims like it is part of the commission's work.", {"h": "Hearings during the campaign"}, "This block of hearings runs until Friday 20 November, overlapping with early voting, which opens on Wednesday 18 November. Polling day is Saturday 28 November. A second block of hearings is expected before the end of the year, ABC News has reported.", "ABC News has reported that the hearings will run through about two weeks of the four-week campaign. Mr Carroll has said that \"integrity is not negotiable\".", {"h": "How to watch or attend"}, {"dl": [["Where", "Level 9, 54 Wellington Street, Collingwood"], ["When", "9 to 20 November, usually from 10am. The lobby opens at 9.15am"], ["Entry", "Open to the public, with security screening. Allow extra time"], ["Online", "Hearings are livestreamed and transcripts are published at rcimcp.vic.gov.au"]]}, "The commission also takes submissions from anyone with information relevant to its terms of reference, through its website."], "dek": "The inquiry has sought more than 110,000 documents, counsel assisting said. Its first two-week block of hearings runs until 20 November, eight days before Victorians vote.", "headline": "Big Build royal commission opens public hearings, starting with a 2022 Sunbury rail shutdown"}, "featured": true, "figure": {"en": "documents sought by the inquiry", "value": "110,000+"}, "image": {"addedAt": "2026-11-09T00:44:15Z", "addedBy": "claude", "alt": {"en": "A blue and grey high-capacity Metro train showing Flinders Street as its destination waits at Sunbury station, beneath a footbridge, on an overcast morning."}, "caption": {"en": "A high-capacity train at Sunbury station on 30 October 2023, the first day these trains ran passenger services on the Sunbury line. The royal commission's first hearings are examining works on the line's upgrade at Gap Road, Sunbury."}, "credit": "Wongm", "file": "images/hcmt-set-37-sunbury-station.jpg", "licence": "CC BY-SA 4.0", "og": "og/hcmt-set-37-sunbury-station.jpg", "sourceUrl": "https://commons.wikimedia.org/wiki/File:HCMT_set_37_Sunbury_station.jpg", "srcset": "img/hcmt-set-37-sunbury-station-800.webp 800w, img/hcmt-set-37-sunbury-station-1600.webp 1600w", "url": "img/hcmt-set-37-sunbury-station-1600.webp"}, "priority": 9, "risk": "amber", "section": "civic", "slug": "big-build-royal-commission-hearings-begin", "sources": [{"checked": "2026-11-09", "title": "Royal Commission into the Integrity of Major Public and Civil Infrastructure Construction Projects in Victoria", "url": "https://www.rcimcp.vic.gov.au/"}, {"checked": "2026-11-09", "title": "Royal commission: Hearings (dates, venue, attendance)", "url": "https://www.rcimcp.vic.gov.au/hearings"}, {"checked": "2026-11-09", "title": "ABC News live blog: Big Build royal commission hearings begin (9 Nov 2026)", "url": "https://www.abc.net.au/news/2026-11-09/vic-election-blog-big-build-royal-commission/107357514"}, {"checked": "2026-11-09", "title": "ABC News: What to expect from Victoria's construction corruption royal commission", "url": "https://www.abc.net.au/news/2026-11-09/victoria-big-build-construction-royal-commission-explainer/107352214"}, {"checked": "2026-11-09", "title": "AAP via Braidwood Times: Big build inquiry resumes weeks before election day", "url": "https://www.braidwoodtimes.com.au/story/9387833/big-build-inquiry-resumes-weeks-before-election-day/"}, {"checked": "2026-11-09", "title": "ABC News: Election campaign will play out with a corruption royal commission in full swing (8 Nov 2026)", "url": "https://www.abc.net.au/news/2026-11-08/labor-royal-commission-ben-carroll-vic-election-campaign/107351126"}], "status": "published", "type": "news", "updated": "2026-11-09T00:44:15Z"}, {"approvedAt": "2026-11-09T01:33:53Z", "approvedBy": "claude", "byline": "The Melbourne Indian newsroom", "date": "2026-11-09", "en": {"body": ["A Hindu temple in Melbourne's west was left without power on the eve of Diwali after its electricity was cut for the second time in eight days, according to MPs from both major parties.", "Evan Mulholland, the Opposition's spokesman for multicultural and multifaith affairs, said power to the SMVS Swaminarayan temple in Mount Cottrell, next to Tarneit, was cut on Saturday 31 October, and the community paid thousands of dollars to have it reconnected. He said vandals returned on Saturday 7 November, the night before Diwali, and cut the power again at the main electrical board. The temple could not restore it in time for its celebrations, he said.", "\"No faith community in Victoria should have to live like this,\" Mr Mulholland said in a statement on Sunday, The Indian Sun reported.", {"note": "The details of the power cuts come from MPs' statements. The Melbourne Indian has not been able to confirm them with Victoria Police, which had not commented publicly at the time of publication. No one has been charged and the motive is not known."}, {"h": "Both parties respond"}, "Tarneit's Labor MP, Dylan Wight, visited the temple on Sunday. He said he was \"deeply disappointed and concerned by the latest act of vandalism\", and that no community should have to keep repairing damage to its place of worship.", "Mr Wight told The Indian Sun that Labor would provide $200,000 for security upgrades at the temple if it is re-elected on 28 November, with the work to be decided with temple management. How the money would be paid and when work could start have not been announced.", "The Liberal candidate for Tarneit, Venkat Ram Upparlapalle, visited the temple last week and called for a thorough police investigation, stronger security and accountability. \"A temple should be a place of peace, prayer and belonging,\" he wrote on social media.", "Earlier this month Premier Ben Carroll announced an $11 million Temple and Gurdwara Safety Fund, for security and other upgrades at Hindu temples and Sikh gurdwaras, at the Sri Durga Temple in Deanside. South Asia Times reported that t
